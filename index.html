<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Realistic Car Race - Timed Levels</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: #1e293b;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 38px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #level-info {
      text-align: right;
    }

    #level-badge {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: inline-block;
      margin-bottom: 4px;
    }

    #level-timer {
      font-size: 15px;
      font-weight: 700;
      color: #f87171;
    }

    #game-over, #start-screen, #level-banner {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over, #level-banner {
      display: none;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }

    #banner-text {
      font-size: 36px;
      font-weight: 800;
      color: #4ade80;
      text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="level-info">
        <div id="level-badge">Level 1</div>
        <div id="level-timer">Time: 25s</div>
      </div>
    </div>

    <div id="start-screen">
      <h1>Realistic Car Race</h1>
      <p>Tap left or right side to steer!<br>Navigate hyper-realistic 3D-shaded traffic cars against the timer.</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="level-banner">
      <div id="banner-text">LEVEL 2</div>
      <p style="opacity: 0.8; font-size: 16px;">Traffic speeds up! Beat the timer!</p>
    </div>

    <div id="game-over">
      <h2 id="game-over-title">Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelBadge = document.getElementById('level-badge');
    const levelTimerEl = document.getElementById('level-timer');
    const gameOverEl = document.getElementById('game-over');
    const gameOverTitle = document.getElementById('game-over-title');
    const levelBanner = document.getElementById('level-banner');
    const bannerText = document.getElementById('banner-text');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('realisticCarBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let level = 1;
    let timeLeft = 25;
    let levelDistance = 0;
    let targetDistance = 300;
    let gameState = 'start';
    let roadAnim = 0;

    let player = {
      x: width / 2,
      y: height - 150,
      width: 48,
      height: 92,
      color: '#0284c7' // Sports blue
    };

    let obstacles = [];
    let spawnTimer = 0;
    let steering = 0;

    function initGame() {
      score = 0;
      level = 1;
      scoreEl.textContent = '0';
      setupLevel();
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      levelBanner.style.display = 'none';
    }

    function setupLevel() {
      levelDistance = 0;
      timeLeft = Math.max(15, 28 - (level * 2));
      targetDistance = 250 + (level * 70);
      levelBadge.textContent = `Level ${level}`;
      obstacles = [];
      player.x = width / 2;
    }

    window.addEventListener('pointerdown', (e) => {
      if (gameState !== 'playing') return;
      if (e.clientX < width / 2) {
        steering = -1;
      } else {
        steering = 1;
      }
    });

    window.addEventListener('pointerup', () => {
      steering = 0;
    });

    setInterval(() => {
      if (gameState === 'playing') {
        timeLeft--;
        levelTimerEl.textContent = `Time: ${timeLeft}s`;
        if (timeLeft <= 0) {
          gameOver("Time's Up!");
        }
      }
    }, 1000);

    function update() {
      if (gameState !== 'playing') return;

      let roadLeft = width / 2 - 140;
      let roadRight = width / 2 + 140;

      player.x += steering * (6.5 + level * 0.8);
      if (player.x < roadLeft + 28) player.x = roadLeft + 28;
      if (player.x > roadRight - 28) player.x = roadRight - 28;

      let roadSpeed = 7.5 + (level * 2);
      roadAnim = (roadAnim + roadSpeed) % 40;

      levelDistance += roadSpeed * 0.1;
      score = (level - 1) * 300 + Math.floor(levelDistance * 10);
      scoreEl.textContent = score;

      if (levelDistance >= targetDistance) {
        triggerLevelUp();
      }

      spawnTimer++;
      let spawnInterval = Math.max(32, 70 - (level * 8));
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        let lanes = [roadLeft + 48, width / 2, roadRight - 48];
        let laneX = lanes[Math.floor(Math.random() * lanes.length)];
        obstacles.push({
          x: laneX,
          y: -120,
          width: 48,
          height: 92,
          speed: roadSpeed * 0.52 + Math.random() * 2,
          color: ['#dc2626', '#16a34a', '#ca8a04', '#7c3aed', '#0f172a'][Math.floor(Math.random() * 5)]
        });
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += roadSpeed + obs.speed;

        if (
          player.x - player.width / 2 < obs.x + obs.width / 2 &&
          player.x + player.width / 2 > obs.x - obs.width / 2 &&
          player.y - player.height / 2 < obs.y + obs.height / 2 &&
          player.y + player.height / 2 > obs.y - obs.height / 2
        ) {
          gameOver("Crash!");
        }

        if (obs.y > height + 120) {
          obstacles.splice(i, 1);
        }
      }
    }

    function triggerLevelUp() {
      gameState = 'leveling';
      level++;
      bannerText.textContent = `LEVEL ${level} UNLOCKED!`;
      levelBanner.style.display = 'flex';

      setTimeout(() => {
        levelBanner.style.display = 'none';
        setupLevel();
        gameState = 'playing';
      }, 1500);
    }

    // Helper function to render a realistic 3D animated style car with shadows, windshields, headlights, and body contours
    function drawRealisticCar(x, y, w, h, mainColor) {
      ctx.save();
      ctx.translate(x, y);

      // Drop Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.roundRect(-w/2 - 4, -h/2 + 6, w + 8, h, 14);
      ctx.fill();

      // Tires
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-w/2 - 5, -h/2 + 14, 7, 20); // Front Left
      ctx.fillRect(w/2 - 2, -h/2 + 14, 7, 20);  // Front Right
      ctx.fillRect(-w/2 - 5, h/2 - 30, 7, 20);  // Rear Left
      ctx.fillRect(w/2 - 2, h/2 - 30, 7, 20);   // Rear Right

      // Main Body Chassis Gradient
      let gradient = ctx.createLinearGradient(-w/2, 0, w/2, 0);
      gradient.addColorStop(0, '#090d16');
      gradient.addColorStop(0.3, mainColor);
      gradient.addColorStop(0.7, mainColor);
      gradient.addColorStop(1, '#090d16');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(-w/2, -h/2, w, h, [16, 16, 10, 10]);
      ctx.fill();

      // Body panel highlight line
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-w/2 + 4, -h/2 + 10);
      ctx.lineTo(-w/2 + 4, h/2 - 10);
      ctx.stroke();

      // Roof Cabin & Windows
      ctx.fillStyle = '#090d16';
      ctx.beginPath();
      ctx.roundRect(-w/2 + 6, -h/2 + 30, w - 12, h - 50, 6);
      ctx.fill();

      // Front Windshield Glass reflection
      ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.beginPath();
      ctx.moveTo(-w/2 + 8, -h/2 + 32);
      ctx.lineTo(w/2 - 8, -h/2 + 32);
      ctx.lineTo(w/2 - 10, -h/2 + 48);
      ctx.lineTo(-w/2 + 10, -h/2 + 48);
      ctx.closePath();
      ctx.fill();

      // Rear Windshield Glass
      ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.beginPath();
      ctx.moveTo(-w/2 + 10, h/2 - 26);
      ctx.lineTo(w/2 - 10, h/2 - 26);
      ctx.lineTo(w/2 - 8, h/2 - 36);
      ctx.lineTo(-w/2 + 8, h/2 - 36);
      ctx.closePath();
      ctx.fill();

      // Headlights
      ctx.fillStyle = '#fef08a';
      ctx.shadowColor = '#facc15';
      ctx.shadowBlur = 8;
      ctx.fillRect(-w/2 + 3, -h/2, 9, 5);
      ctx.fillRect(w/2 - 12, -h/2, 9, 5);
      ctx.shadowBlur = 0; // reset

      // Tail lights
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 6;
      ctx.fillRect(-w/2 + 4, h/2 - 4, 8, 4);
      ctx.fillRect(w/2 - 12, h/2 - 4, 8, 4);
      ctx.shadowBlur = 0;

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      let roadLeft = width / 2 - 140;
      let roadRight = width / 2 + 140;

      // Realistic environment grass background
      ctx.fillStyle = '#044e38';
      ctx.fillRect(0, 0, width, height);

      // Asphalt Road Surface with texture gradient
      let roadGrad = ctx.createLinearGradient(roadLeft, 0, roadRight, 0);
      roadGrad.addColorStop(0, '#1e293b');
      roadGrad.addColorStop(0.5, '#334155');
      roadGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = roadGrad;
      ctx.fillRect(roadLeft, 0, roadRight - roadLeft, height);

      // Concrete road shoulders
      ctx.fillStyle = '#64748b';
      ctx.fillRect(roadLeft, 0, 10, height);
      ctx.fillRect(roadRight - 10, 0, 10, height);

      // Center highway dashed lines
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 5;
      ctx.setLineDash([24, 24]);
      ctx.lineDashOffset = -roadAnim;
      ctx.beginPath();
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw realistic traffic obstacle cars
      obstacles.forEach(obs => {
        drawRealisticCar(obs.x, obs.y, obs.width, obs.height, obs.color);
      });

      // Draw realistic player sports car
      drawRealisticCar(player.x, player.y, player.width, player.height, player.color);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver(reason) {
      gameState = 'gameover';
      gameOverTitle.textContent = reason === "Time's Up!" ? "Time's Up!" : "Car Crashed!";
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('realisticCarBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
