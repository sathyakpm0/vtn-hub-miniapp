<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Knife Hit Fruits</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 38px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #knives-left {
      font-size: 18px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    #instruction {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 15px;
      opacity: 0.8;
      z-index: 10;
      pointer-events: none;
    }

    #game-over, #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over {
      display: none;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="knives-left">Knives: 7</div>
    </div>

    <div id="instruction">Tap anywhere to throw the knife!</div>

    <div id="start-screen">
      <h1>Knife Hit Fruits</h1>
      <p>Throw knives into the spinning fruit log.<br>Don't hit other knives! Gets tougher!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="game-over">
      <h2>Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const knivesLeftEl = document.getElementById('knives-left');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('knifeHitBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let knivesLeft = 7;
    let gameState = 'start';
    let logAngle = 0;
    let logSpeed = 0.02;
    let stuckKnives = [];
    let activeKnife = null;
    let currentLevelKnives = 7;

    const log = {
      x: () => width / 2,
      y: () => height * 0.3,
      radius: 85
    };

    function throwKnife() {
      if (gameState !== 'playing' || activeKnife || knivesLeft <= 0) return;

      knivesLeft--;
      knivesLeftEl.textContent = `Knives: ${knivesLeft}`;

      activeKnife = {
        x: width / 2,
        y: height * 0.78,
        vy: -22
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      throwKnife();
    });

    function update() {
      // Dynamic rotating speed changes to make it tougher
      logAngle += logSpeed;

      if (activeKnife) {
        activeKnife.y += activeKnife.vy;

        const lx = log.x();
        const ly = log.y();
        const dist = Math.hypot(activeKnife.x - lx, activeKnife.y - ly);

        // Check if knife hits the rotating fruit log surface
        if (dist <= log.radius + 10) {
          // Calculate angle relative to log center
          const hitAngle = Math.atan2(activeKnife.y - ly, activeKnife.x - lx) - logAngle;

          // Check collision with already stuck knives (tough constraint: ~0.3 radians clearance)
          let collided = false;
          for (let k of stuckKnives) {
            let diff = Math.abs(k.angle - hitAngle);
            while (diff > Math.PI * 2) diff -= Math.PI * 2;
            if (Math.min(diff, Math.PI * 2 - diff) < 0.28) {
              collided = true;
              break;
            }
          }

          if (collided) {
            // Hit another knife -> Game Over!
            activeKnife = null;
            setTimeout(gameOver, 300);
            return;
          }

          // Successfully stuck!
          stuckKnives.push({ angle: hitAngle });
          score += 10;
          scoreEl.textContent = score;
          activeKnife = null;

          // Check if level / stage cleared
          if (stuckKnives.length >= currentLevelKnives) {
            score += 50; // Level bonus
            scoreEl.textContent = score;
            stuckKnives = [];
            currentLevelKnives = Math.min(12, currentLevelKnives + 2);
            knivesLeft = currentLevelKnives;
            knivesLeftEl.textContent = `Knives: ${knivesLeft}`;
            // Increase rotation difficulty randomly
            logSpeed = (Math.random() > 0.5 ? 1 : -1) * (Math.abs(logSpeed) + 0.008);
          } else if (knivesLeft <= 0) {
            setTimeout(gameOver, 400);
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      const lx = log.x();
      const ly = log.y();

      // Draw Rotating Fruit Log / Target
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(logAngle);

      // Outer watermelon/orange peel look
      ctx.beginPath();
      ctx.arc(0, 0, log.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#16a34a';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#15803d';
      ctx.stroke();

      // Inner juicy fruit pulp design
      ctx.beginPath();
      ctx.arc(0, 0, log.radius - 12, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();

      // Fruit segments pattern
      ctx.strokeStyle = '#b91c1c';
      ctx.lineWidth = 3;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(i * Math.PI / 3) * (log.radius - 12), Math.sin(i * Math.PI / 3) * (log.radius - 12));
        ctx.stroke();
      }

      // Center core
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#fef08a';
      ctx.fill();

      // Draw stuck knives on the log
      stuckKnives.forEach(k => {
        ctx.save();
        ctx.rotate(k.angle);
        ctx.translate(log.radius - 2, 0);
        ctx.rotate(Math.PI / 2);

        // Blade
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(-3, -32, 6, 32);
        // Handle
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-4, 0, 8, 18);

        ctx.restore();
      });

      ctx.restore();

      // Draw active flying knife
      if (activeKnife) {
        ctx.save();
        ctx.translate(activeKnife.x, activeKnife.y);
        // Blade
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-3, -26, 6, 32);
        // Handle
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-4, 6, 8, 18);
        ctx.restore();
      }

      // Draw waiting ready knife at the bottom
      if (!activeKnife && gameState === 'playing') {
        ctx.save();
        ctx.translate(width / 2, height * 0.78);
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-3, -26, 6, 32);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-4, 6, 8, 18);
        ctx.restore();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      score = 0;
      scoreEl.textContent = '0';
      currentLevelKnives = 7;
      knivesLeft = 7;
      knivesLeftEl.textContent = `Knives: ${knivesLeft}`;
      stuckKnives = [];
      activeKnife = null;
      logSpeed = 0.022;
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
    }

    function gameOver() {
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('knifeHitBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
