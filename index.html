<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dart Master</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 38px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #darts-left {
      font-size: 18px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    #instruction {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 15px;
      opacity: 0.8;
      z-index: 10;
      pointer-events: none;
    }

    #game-over, #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over {
      display: none;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="darts-left">Darts: 10</div>
    </div>

    <div id="instruction">Drag back & release to throw!</div>

    <div id="start-screen">
      <h1>Dart Master</h1>
      <p>Time your throw and hit the bullseye!<br>Watch out for the spinning board.</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="game-over">
      <h2>Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const dartsLeftEl = document.getElementById('darts-left');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('dartBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let dartsLeft = 10;
    let gameState = 'start';
    let boardAngle = 0;
    let boardSpeed = 0.015;
    let stuckDarts = [];
    let activeDart = null;

    // Board position
    const board = {
      x: () => width / 2,
      y: () => height * 0.32,
      radius: 110
    };

    // Input tracking for dragging
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };
    let isDragging = false;

    function startDrag(e) {
      if (gameState !== 'playing' || activeDart) return;
      const pos = e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };
      
      // Allow dragging from lower screen area
      if (pos.y > height * 0.6) {
        isDragging = true;
        dragStart = pos;
        dragCurrent = pos;
      }
    }

    function moveDrag(e) {
      if (!isDragging) return;
      const pos = e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };
      dragCurrent = pos;
    }

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;

      const dx = dragCurrent.x - dragStart.x;
      const dy = dragCurrent.y - dragStart.y;

      // Check if pulled backward (dy < -20)
      if (dy < -20) {
        const power = Math.min(Math.sqrt(dx*dx + dy*dy), 200);
        throwDart(dx * 0.5, dy * 0.8);
      }
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', moveDrag);
    canvas.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', startDrag, { passive: false });
    canvas.addEventListener('touchmove', moveDrag, { passive: false });
    canvas.addEventListener('touchend', endDrag);

    function throwDart(vx, vy) {
      dartsLeft--;
      dartsLeftEl.textContent = `Darts: ${dartsLeft}`;

      activeDart = {
        x: width / 2 + (dragStart.x - width/2) * 0.3,
        y: height * 0.75,
        vx: vx * 0.08,
        vy: vy * 0.08,
        scale: 1.5
      };
    }

    function update() {
      // Rotate board
      boardAngle += boardSpeed;

      // Update active flying dart
      if (activeDart) {
        activeDart.x += activeDart.vx;
        activeDart.y += activeDart.vy;
        activeDart.scale = Math.max(0.6, activeDart.scale - 0.03);

        const bx = board.x();
        const by = board.y();
        const dist = Math.hypot(activeDart.x - bx, activeDart.y - by);

        // Check hit collision with board
        if (dist <= board.radius) {
          // Calculate angle relative to spinning board
          const hitAngle = Math.atan2(activeDart.y - by, activeDart.x - bx) - boardAngle;
          
          stuckDarts.push({
            angle: hitAngle,
            dist: dist,
            color: '#38bdf8'
          });

          // Calculate score based on distance from center
          let pts = 10;
          if (dist < 18) { pts = 50; showPopup("+50 BULLSEYE!"); }
          else if (dist < 45) { pts = 25; }
          else if (dist < 80) { pts = 15; }

          score += pts;
          scoreEl.textContent = score;

          activeDart = null;

          if (dartsLeft <= 0) {
            setTimeout(gameOver, 400);
          }
        } else if (activeDart.y < -50 || activeDart.x < -50 || activeDart.x > width + 50) {
          // Missed board entirely
          activeDart = null;
          if (dartsLeft <= 0) {
            setTimeout(gameOver, 400);
          }
        }
      }
    }

    function showPopup(text) {
      const el = document.createElement('div');
      el.className = 'perfect';
      el.style.position = 'absolute';
      el.style.left = (width / 2 - 50) + 'px';
      el.style.top = (height * 0.3) + 'px';
      el.style.color = '#4ade80';
      el.style.fontWeight = '700';
      el.style.fontSize = '24px';
      el.style.zIndex = '15';
      el.style.pointerEvents = 'none';
      el.style.transition = 'all 0.8s ease-out';
      el.textContent = text;
      document.getElementById('game-container').appendChild(el);
      setTimeout(() => {
        el.style.transform = 'translateY(-40px)';
        el.style.opacity = '0';
      }, 20);
      setTimeout(() => el.remove(), 800);
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      const bx = board.x();
      const by = board.y();

      // Draw Dartboard
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(boardAngle);

      // Outer ring
      ctx.beginPath();
      ctx.arc(0, 0, board.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 6;
      ctx.stroke();

      // Board segments colors
      const colors = ['#f8fafc', '#0f172a', '#ef4444', '#1e293b'];
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, board.radius - 6, i * Math.PI / 4, (i + 1) * Math.PI / 4);
        ctx.fillStyle = i % 2 === 0 ? '#ef4444' : '#1e293b';
        ctx.fill();
      }

      // Inner rings
      ctx.beginPath();
      ctx.arc(0, 0, 75, 0, Math.PI * 2);
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, 45, 0, Math.PI * 2);
      ctx.fillStyle = '#22c55e';
      ctx.fill();

      // Bullseye
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();

      // Draw stuck darts on board
      stuckDarts.forEach(d => {
        const da = d.angle + boardAngle;
        const dx = Math.cos(da) * d.dist;
        const dy = Math.sin(da) * d.dist;

        ctx.save();
        ctx.translate(dx, dy);
        ctx.rotate(da + Math.PI / 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(-3, -12, 6, 24);
        ctx.restore();
      });

      ctx.restore();

      // Draw active flying dart
      if (activeDart) {
        ctx.save();
        ctx.translate(activeDart.x, activeDart.y);
        ctx.scale(activeDart.scale, activeDart.scale);
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(0, -15);
        ctx.lineTo(6, 15);
        ctx.lineTo(-6, 15);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Draw pull-back aiming indicator line
      if (isDragging) {
        ctx.beginPath();
        ctx.moveTo(width / 2, height * 0.75);
        ctx.lineTo(width / 2 + (dragCurrent.x - dragStart.x), height * 0.75 + (dragCurrent.y - dragStart.y));
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
        ctx.lineWidth = 4;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      score = 0;
      scoreEl.textContent = '0';
      dartsLeft = 10;
      dartsLeftEl.textContent = `Darts: ${dartsLeft}`;
      stuckDarts = [];
      activeDart = null;
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
    }

    function gameOver() {
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('dartBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
