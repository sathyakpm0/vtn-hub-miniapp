<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cricket Master - Timed Levels</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: #0f172a;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 38px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #level-info {
      text-align: right;
    }

    #level-badge {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: inline-block;
      margin-bottom: 4px;
    }

    #balls-left {
      font-size: 15px;
      font-weight: 700;
      color: #f87171;
    }

    #game-over, #start-screen, #level-banner {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over, #level-banner {
      display: none;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }

    #banner-text {
      font-size: 36px;
      font-weight: 800;
      color: #4ade80;
      text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0 Runs</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="level-info">
        <div id="level-badge">Level 1</div>
        <div id="balls-left">Balls: 6</div>
      </div>
    </div>

    <div id="start-screen">
      <h1>Cricket Master</h1>
      <p>Tap left, center, or right to swing the bat!<br>Reach target runs before running out of balls. Spin & pace increase with levels!</p>
      <button id="start-btn">Start Match</button>
    </div>

    <div id="level-banner">
      <div id="banner-text">LEVEL 2</div>
      <p style="opacity: 0.8; font-size: 16px;">Target increased! Watch out for spin bowling!</p>
    </div>

    <div id="game-over">
      <h2 id="game-over-title">Game Over</h2>
      <div id="final-score">0 Runs</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelBadge = document.getElementById('level-badge');
    const ballsLeftEl = document.getElementById('balls-left');
    const gameOverEl = document.getElementById('game-over');
    const gameOverTitle = document.getElementById('game-over-title');
    const levelBanner = document.getElementById('level-banner');
    const bannerText = document.getElementById('banner-text');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('cricketBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let level = 1;
    let ballsLeft = 6;
    let targetRuns = 15;
    let currentLevelRuns = 0;
    let gameState = 'start'; // start, playing, bowling, shot, leveling, gameover

    let ball = {
      x: width / 2,
      y: 120,
      z: 0.2, // Scale simulation for 3D depth pitch
      vx: 0,
      vy: 0,
      vz: 0.015,
      bounced: false
    };

    let batsman = {
      x: width / 2,
      y: height - 160,
      swinging: false,
      shotType: 0 // -1 Left (Leg), 0 Straight, 1 Right (Off)
    };

    let hitShotResult = null; // { text: "SIX!", runs: 6, opacity: 1, y: height/2 }

    function initGame() {
      score = 0;
      level = 1;
      scoreEl.textContent = '0 Runs';
      setupLevel();
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      levelBanner.style.display = 'none';
      startNewDelivery();
    }

    function setupLevel() {
      currentLevelRuns = 0;
      ballsLeft = 6;
      targetRuns = 12 + (level * 6);
      levelBadge.textContent = `Level ${level}`;
      ballsLeftEl.textContent = `Balls: ${ballsLeft}`;
    }

    function startNewDelivery() {
      if (ballsLeft <= 0) {
        if (currentLevelRuns >= targetRuns) {
          triggerLevelUp();
        } else {
          gameOver("Target Missed!");
        }
        return;
      }

      gameState = 'bowling';
      ball.x = width / 2 + (Math.random() - 0.5) * 40;
      ball.y = height * 0.28;
      ball.z = 0.3;
      ball.bounced = false;

      // Speed & Spin variation per level
      let speed = 4 + (level * 0.7);
      let spin = (level >= 2) ? (Math.random() - 0.5) * (level * 0.8) : 0;

      ball.vy = speed;
      ball.vx = spin;
      batsman.swinging = false;
      hitShotResult = null;
    }

    window.addEventListener('pointerdown', (e) => {
      if (gameState !== 'bowling' || batsman.swinging) return;

      batsman.swinging = true;
      if (e.clientX < width * 0.35) {
        batsman.shotType = -1; // Leg side
      } else if (e.clientX > width * 0.65) {
        batsman.shotType = 1;  // Off side
      } else {
        batsman.shotType = 0;  // Straight drive
      }

      checkShotTiming();
    });

    function checkShotTiming() {
      let dist = Math.abs(ball.y - (batsman.y - 10));

      if (dist < 45) {
        // Connected!
        ballsLeft--;
        ballsLeftEl.textContent = `Balls: ${ballsLeft}`;

        let runs = 4;
        if (dist < 15) {
          runs = 6;
          showShotResult("SIX! 💥", 6);
        } else if (dist < 30) {
          runs = 4;
          showShotResult("FOUR! 🏏", 4);
        } else {
          runs = 2;
          showShotResult("2 Runs!", 2);
        }

        score += runs;
        currentLevelRuns += runs;
        scoreEl.textContent = `${score} Runs`;

        if (currentLevelRuns >= targetRuns && ballsLeft === 0) {
          setTimeout(triggerLevelUp, 1200);
        } else {
          setTimeout(startNewDelivery, 1300);
        }
      }
    }

    function showShotResult(text, runs) {
      hitShotResult = {
        text: text,
        runs: runs,
        opacity: 1,
        y: height * 0.45
      };
    }

    function update() {
      if (gameState === 'bowling') {
        ball.y += ball.vy;
        ball.x += ball.vx;
        ball.z = Math.min(1.0, ball.z + 0.015);

        // Ball bounce on pitch
        if (ball.y > height * 0.52 && !ball.bounced) {
          ball.bounced = true;
          ball.vy *= 0.95; // Slight friction slowing
        }

        // Missed ball / Wicket check
        if (ball.y > height - 110) {
          ballsLeft--;
          ballsLeftEl.textContent = `Balls: ${ballsLeft}`;

          // Hit stumps
          if (Math.abs(ball.x - width / 2) < 26) {
            showShotResult("WICKET! 🔴", 0);
          } else {
            showShotResult("Dot Ball ⚪", 0);
          }

          gameState = 'shot';
          setTimeout(startNewDelivery, 1300);
        }
      }

      if (hitShotResult) {
        hitShotResult.y -= 1.5;
        hitShotResult.opacity = Math.max(0, hitShotResult.opacity - 0.015);
      }
    }

    function triggerLevelUp() {
      gameState = 'leveling';
      level++;
      bannerText.textContent = `LEVEL ${level} UNLOCKED!`;
      levelBanner.style.display = 'flex';

      setTimeout(() => {
        levelBanner.style.display = 'none';
        setupLevel();
        gameState = 'playing';
        startNewDelivery();
      }, 1500);
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Stadium Outfield Grass
      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, 0, width, height);

      // Curved Boundary Line
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(width / 2, height * 0.3, width * 0.46, 0, Math.PI);
      ctx.stroke();

      // Cricket Pitch Center
      let pitchTopX = width / 2 - 40;
      let pitchBottomX = width / 2 - 65;
      let pitchWTop = 80;
      let pitchWBottom = 130;

      ctx.fillStyle = '#d97706'; // Clay pitch color
      ctx.beginPath();
      ctx.moveTo(pitchTopX, height * 0.25);
      ctx.lineTo(pitchTopX + pitchWTop, height * 0.25);
      ctx.lineTo(pitchBottomX + pitchWBottom, height - 120);
      ctx.lineTo(pitchBottomX, height - 120);
      ctx.closePath();
      ctx.fill();

      // Popping Crease Line
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pitchBottomX - 10, height - 150);
      ctx.lineTo(pitchBottomX + pitchWBottom + 10, height - 150);
      ctx.stroke();

      // Stumps (Wickets) at Batsman End
      ctx.fillStyle = '#fef08a';
      for (let i = -1; i <= 1; i++) {
        ctx.fillRect(width / 2 + (i * 8) - 2, height - 145, 4, 30);
      }

      // Stumps at Bowler End
      for (let i = -1; i <= 1; i++) {
        ctx.fillRect(width / 2 + (i * 5) - 1.5, height * 0.26, 3, 18);
      }

      // Draw Batsman
      ctx.save();
      ctx.translate(batsman.x - 20, batsman.y);

      // Pads & Body
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(-10, -35, 12, 35); // Left Leg Pad
      ctx.fillRect(4, -35, 12, 35);  // Right Leg Pad

      // Shirt
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(-12, -65, 30, 30);

      // Helmet
      ctx.fillStyle = '#090d16';
      ctx.beginPath();
      ctx.arc(3, -75, 10, 0, Math.PI * 2);
      ctx.fill();

      // Cricket Bat
      ctx.save();
      ctx.translate(10, -30);
      if (batsman.swinging) {
        ctx.rotate(batsman.shotType * 0.6 - 0.8);
      } else {
        ctx.rotate(0.2);
      }
      ctx.fillStyle = '#b45309';
      ctx.fillRect(-4, -40, 8, 45); // Wooden blade
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-3, -52, 6, 12);  // Grip
      ctx.restore();

      ctx.restore();

      // Draw Ball (with depth scaling)
      if (gameState === 'bowling') {
        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.fillStyle = '#dc2626'; // Red cricket seam ball
        ctx.beginPath();
        ctx.arc(0, 0, 8 * ball.z + 4, 0, Math.PI * 2);
        ctx.fill();

        // Seam highlight
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 7 * ball.z + 3, 0.4, Math.PI + 0.4);
        ctx.stroke();
        ctx.restore();
      }

      // Shot Result Popup Text
      if (hitShotResult && hitShotResult.opacity > 0) {
        ctx.save();
        ctx.globalAlpha = hitShotResult.opacity;
        ctx.fillStyle = hitShotResult.runs > 0 ? '#4ade80' : '#ef4444';
        ctx.font = 'bold 36px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 10;
        ctx.fillText(hitShotResult.text, width / 2, hitShotResult.y);
        ctx.restore();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver(reason) {
      gameState = 'gameover';
      gameOverTitle.textContent = reason;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('cricketBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = `${score} Runs`;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
