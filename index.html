<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VTN HUB VIP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #0b0b0f 0%, #1a0b1e 50%, #0f0a14 100%);
      color: #f5e6c8;
      padding: 18px 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .lock-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid #5c3d1e;
      border-radius: 20px;
      padding: 40px 25px;
      max-width: 320px;
    }

    .lock-box h1 {
      font-size: 28px;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #ffd700, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lock-box p {
      color: #c9b28a;
      font-size: 15px;
      line-height: 1.5;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- LOCKED SCREEN (for normal users) -->
  <div id="locked-screen" class="lock-box">
    <h1>🔒 Coming Soon</h1>
    <p>VTN HUB Mini App is under maintenance.<br><br>Please check back later.</p>
  </div>

  <!-- REAL APP (only for you) -->
  <div id="app-content" class="hidden">
    <h1 style="color:#ffd700; margin-bottom: 15px;">👑 Welcome Admin</h1>
    <p style="color:#c9b28a;">You can access the Mini App.<br>Development mode is active.</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#0b0b0f');
    tg.setBackgroundColor('#0b0b0f');

    // Only your ID is allowed
    const ADMIN_IDS = [8150531247];

    const user = tg.initDataUnsafe?.user;
    const isAdmin = user && ADMIN_IDS.includes(user.id);

    if (isAdmin) {
      document.getElementById('locked-screen').classList.add('hidden');
      document.getElementById('app-content').classList.remove('hidden');
    }
  </script>
</body>
</html>
