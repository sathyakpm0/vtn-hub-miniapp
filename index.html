<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tower Climb - Timed Levels</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #0f172a, #1e293b);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 38px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #level-info {
      text-align: right;
    }

    #level-badge {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: inline-block;
      margin-bottom: 4px;
    }

    #level-timer {
      font-size: 15px;
      font-weight: 700;
      color: #f87171;
    }

    #game-over, #start-screen, #level-banner {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over, #level-banner {
      display: none;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }

    #banner-text {
      font-size: 36px;
      font-weight: 800;
      color: #4ade80;
      text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="level-info">
        <div id="level-badge">Level 1</div>
        <div id="level-timer">Time: 20s</div>
      </div>
    </div>

    <div id="start-screen">
      <h1>Tower Climb</h1>
      <p>Tap left or right to jump!<br>Beat the timer to clear each tough level before time runs out!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="level-banner">
      <div id="banner-text">LEVEL 2</div>
      <p style="opacity: 0.8; font-size: 16px;">Platforms shrink & speed up! Beat the timer!</p>
    </div>

    <div id="game-over">
      <h2 id="game-over-title">Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelBadge = document.getElementById('level-badge');
    const levelTimerEl = document.getElementById('level-timer');
    const gameOverEl = document.getElementById('game-over');
    const gameOverTitle = document.getElementById('game-over-title');
    const levelBanner = document.getElementById('level-banner');
    const bannerText = document.getElementById('banner-text');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('towerClimbTimedBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let level = 1;
    let timeLeft = 20; // 20 seconds to clear level target height
    let targetHeight = 15; // 15 meters target per level
    let currentLevelHeight = 0;
    let gameState = 'start'; // start, playing, leveling, gameover
    let cameraY = 0;

    let player = {
      x: width / 2,
      y: 0,
      vx: 0,
      vy: 0,
      radius: 16
    };

    let platforms = [];

    function initGame() {
      score = 0;
      level = 1;
      scoreEl.textContent = '0';
      setupLevel();
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      levelBanner.style.display = 'none';
    }

    function setupLevel() {
      currentLevelHeight = 0;
      timeLeft = Math.max(12, 22 - (level * 2)); // Less time on higher levels!
      targetHeight = 15 + (level * 5); // Taller target each level
      levelBadge.textContent = `Level ${level}`;
      cameraY = 0;

      player.x = width / 2;
      player.y = height - 160;
      player.vx = 0;
      player.vy = -12;

      generatePlatforms();
    }

    function generatePlatforms() {
      platforms = [];
      platforms.push({ x: width / 2 - 60, y: height - 100, width: 120, height: 16, moving: false, dir: 1 });

      let currentY = height - 180;
      while (currentY > -4000) {
        // Tougher: platforms become much narrower with level increase
        let pWidth = Math.max(40, 110 - (level * 10));
        let pX = Math.random() * (width - pWidth);
        let isMoving = level >= 2 && Math.random() < (0.3 + level * 0.05);

        platforms.push({
          x: pX,
          y: currentY,
          width: pWidth,
          height: 16,
          moving: isMoving,
          dir: Math.random() > 0.5 ? 1 : -1
        });
        currentY -= 65 + Math.random() * 25;
      }
    }

    // Touch controls
    window.addEventListener('pointerdown', (e) => {
      if (gameState !== 'playing') return;
      if (e.clientX < width / 2) {
        player.vx = -7;
      } else {
        player.vx = 7;
      }
    });

    window.addEventListener('pointerup', () => {
      player.vx = 0;
    });

    // Level timer countdown loop interval
    setInterval(() => {
      if (gameState === 'playing') {
        timeLeft--;
        levelTimerEl.textContent = `Time: ${timeLeft}s`;
        if (timeLeft <= 0) {
          gameOver("Time's Up!");
        }
      }
    }, 1000);

    function update() {
      if (gameState !== 'playing') return;

      player.vy += 0.46;
      player.x += player.vx;
      player.y += player.vy;

      if (player.x < 0) player.x = width;
      if (player.x > width) player.x = 0;

      // Move platforms faster on higher levels
      platforms.forEach(p => {
        if (p.moving) {
          p.x += p.dir * (2 + level * 0.5);
          if (p.x <= 0 || p.x + p.width >= width) {
            p.dir *= -1;
          }
        }
      });

      // Jump / Bounce collisions
      if (player.vy > 0) {
        platforms.forEach(p => {
          if (
            player.x + player.radius > p.x &&
            player.x - player.radius < p.x + p.width &&
            player.y + player.radius >= p.y &&
            player.y + player.radius <= p.y + p.height + 6
          ) {
            player.vy = -14.5;
          }
        });
      }

      // Camera follow
      let targetCameraY = player.y - height * 0.45;
      if (targetCameraY < cameraY) {
        cameraY += (targetCameraY - cameraY) * 0.1;
      }

      // Track level target height progress
      currentLevelHeight = Math.max(0, Math.floor((height - 100 - player.y) / 10));
      score = (level - 1) * 200 + currentLevelHeight * 10;
      scoreEl.textContent = score;

      if (currentLevelHeight >= targetHeight) {
        triggerLevelUp();
      }

      // Fall below screen = instant failure
      if (player.y > cameraY + height + 50) {
        gameOver("Fall Down!");
      }
    }

    function triggerLevelUp() {
      gameState = 'leveling';
      level++;
      bannerText.textContent = `LEVEL ${level} UNLOCKED!`;
      levelBanner.style.display = 'flex';

      setTimeout(() => {
        levelBanner.style.display = 'none';
        setupLevel();
        gameState = 'playing';
      }, 1500);
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(0, -cameraY);

      platforms.forEach(p => {
        ctx.fillStyle = p.moving ? '#f59e0b' : '#38bdf8';
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.width, p.height, 8);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(p.x, p.y, p.width, 4);
      });

      // Player
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(player.x - 4, player.y - 4, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver(reason) {
      gameState = 'gameover';
      gameOverTitle.textContent = reason === "Time's Up!" ? "Time's Up!" : "Game Over";
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('towerClimbTimedBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
