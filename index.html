<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Master Fruit Blade</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #110d0a;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #fff;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD overlay */
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .score-box {
      display: flex;
      flex-direction: column;
    }

    #score {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #facc15;
      text-shadow: 0 3px 12px rgba(0,0,0,0.8), 0 0 20px rgba(250, 204, 21, 0.4);
    }

    #best {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.85;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    #timer-container {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    #timer-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
    }

    #timer {
      font-size: 32px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #38bdf8;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.6), 0 2px 6px rgba(0,0,0,0.9);
      transition: color 0.3s;
    }

    #timer.warning {
      color: #ef4444 !important;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); filter: drop-shadow(0 0 4px #ef4444); }
      to { transform: scale(1.1); filter: drop-shadow(0 0 14px #ef4444); }
    }

    #combo-box {
      font-size: 26px;
      font-weight: 900;
      font-style: italic;
      color: #4ade80;
      text-shadow: 0 0 15px rgba(74, 222, 128, 0.8), 0 2px 6px rgba(0,0,0,0.8);
      opacity: 0;
      transform: scale(0.8) rotate(-5deg);
      transition: opacity 0.2s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #combo-box.show {
      opacity: 1;
      transform: scale(1.15) rotate(-5deg);
    }

    /* Modals & Screens */
    .screen-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(30, 20, 15, 0.92) 0%, rgba(10, 8, 6, 0.97) 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      gap: 14px;
      backdrop-filter: blur(8px);
    }

    #start-screen {
      display: flex;
    }

    h1 {
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fef08a 0%, #f97316 50%, #dc2626 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.9));
      text-align: center;
      line-height: 1.1;
    }

    h2 {
      font-size: 38px;
      font-weight: 900;
      color: #f87171;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(248, 113, 113, 0.5);
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #38bdf8;
      font-weight: 700;
    }

    .instructions {
      font-size: 15px;
      color: #d1d5db;
      text-align: center;
      line-height: 1.6;
      max-width: 320px;
      margin: 10px 0;
    }

    .stat-card {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 36px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 8px;
    }

    #final-score {
      font-size: 54px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 25px rgba(250, 204, 21, 0.6);
    }

    #best-score-text {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .btn {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
      border: none;
      padding: 16px 48px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 10px 25px rgba(217, 119, 6, 0.4), inset 0 2px 4px rgba(255,255,255,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div class="score-box">
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="combo-box">Combo x3</div>
    </div>

    <div id="timer-container">
      <div id="timer-label">Time Remaining</div>
      <div id="timer">03:00</div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-overlay">
      <div class="badge">Arcade 3-Min Trial</div>
      <h1>Ninja Blade</h1>
      <p class="instructions">
        Swipe your blade across flying fruits.<br>
        Slice multiple in one stroke for <b>Combos</b>!<br>
        ⚠️ <b>Avoid Bombs</b> or lose 10 seconds!
      </p>
      <button id="start-btn" class="btn">Play Round</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="screen-overlay">
      <h2>Time's Up!</h2>
      <div class="stat-card">
        <div id="final-score">0</div>
        <div id="best-score-text">Best: 0</div>
      </div>
      <button id="restart-btn" class="btn">Play Again</button>
    </div>
  </div>

  <script>
    // --- Telegram WebApp Integration & Haptics ---
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#110d0a');
      tg.setBackgroundColor('#110d0a');
    }

    function triggerHaptic(type = 'medium') {
      try {
        if (tg?.HapticFeedback) {
          if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
          else if (type === 'light') tg.HapticFeedback.impactOccurred('light');
          else tg.HapticFeedback.impactOccurred('medium');
        } else if (navigator.vibrate) {
          navigator.vibrate(type === 'heavy' ? 45 : 18);
        }
      } catch (e) {}
    }

    // --- Synthesized Web Audio Engine (Ultra-crisp & ZERO assets needed) ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playSwoosh() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, now);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.12);
      },
      playSlice(comboLevel = 1) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // Splat/Squish noise buffer
        const bufferSize = this.ctx.sampleRate * 0.14;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400 + comboLevel * 200, now);
        filter.Q.setValueAtTime(3, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);

        // Blade chime note
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'triangle';
        const baseFreq = 520 + (comboLevel * 120);
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.1);

        oscGain.gain.setValueAtTime(0.18, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      },
      playBomb() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.5);

        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.55);
      }
    };

    // --- Setup & Canvas ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const comboEl = document.getElementById('combo-box');
    const timerEl = document.getElementById('timer');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Game Variables ---
    const ROUND_TIME = 180; // 3 minutes = 180 seconds
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('ninjaBladeBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let fruits = [];
    let fruitHalves = [];
    let splatters = [];
    let particles = [];
    let floatTexts = [];
    let bladePath = [];
    let gameState = 'start';
    let timeLeft = ROUND_TIME;
    let combo = 0;
    let lastSliceTime = 0;
    let spawnTimer = 0;
    let gameTime = 0;
    let screenShake = 0;
    let flashScreenAlpha = 0;

    // --- Fruit Definitions ---
    const FRUIT_PRESETS = [
      { name: 'watermelon', radius: 46, points: 1, skinColor: '#22c55e', fleshColor: '#ef4444', seedColor: '#1e293b' },
      { name: 'orange', radius: 40, points: 1, skinColor: '#f97316', fleshColor: '#fb923c', seedColor: '#fed7aa' },
      { name: 'apple', radius: 38, points: 1, skinColor: '#dc2626', fleshColor: '#fef08a', seedColor: '#78350f' },
      { name: 'banana', radius: 36, points: 2, skinColor: '#eab308', fleshColor: '#fef9c3', seedColor: '#ca8a04' },
      { name: 'coconut', radius: 42, points: 2, skinColor: '#78350f', fleshColor: '#f8fafc', seedColor: '#451a03' },
      { name: 'dragonfruit', radius: 44, points: 3, skinColor: '#db2777', fleshColor: '#fdf2f8', seedColor: '#18181b' },
      { name: 'bomb', radius: 38, points: 0, isBomb: true }
    ];

    // --- Background Wooden Texture Simulation ---
    function drawBackground() {
      // Dojo wood slats
      const slatHeight = 70;
      const numSlats = Math.ceil(height / slatHeight);
      for (let i = 0; i < numSlats; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#1e140d' : '#19100a';
        ctx.fillRect(0, i * slatHeight, width, slatHeight);
        ctx.strokeStyle = '#0d0805';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, i * slatHeight, width, slatHeight);
      }

      // Vignette effect
      const grad = ctx.createRadialGradient(width / 2, height / 2, width * 0.25, width / 2, height / 2, width * 0.85);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.7)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Splatters on the board
      splatters.forEach(s => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rotation);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, s.rx, s.ry, 0, 0, Math.PI * 2);
        ctx.fill();

        // Little satellite droplets
        s.drops.forEach(d => {
          ctx.beginPath();
          ctx.arc(d.dx, d.dy, d.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      });
      ctx.globalAlpha = 1;
    }

    // --- Draw Complete Whole Fruit ---
    function drawFruit(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rotation);

      if (f.isBomb) {
        // Bomb Body
        const bombGrad = ctx.createRadialGradient(-8, -8, 4, 0, 0, f.radius);
        bombGrad.addColorStop(0, '#475569');
        bombGrad.addColorStop(1, '#090d16');
        ctx.fillStyle = bombGrad;
        ctx.beginPath();
        ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#1e293b';
        ctx.stroke();

        // Bomb Cap
        ctx.fillStyle = '#64748b';
        ctx.fillRect(-8, -f.radius - 6, 16, 7);

        // Fuse with burn spark
        ctx.beginPath();
        ctx.moveTo(0, -f.radius - 6);
        ctx.quadraticCurveTo(14, -f.radius - 22, 12, -f.radius - 32);
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Animated Fuse Spark
        const sparkTime = performance.now() * 0.015;
        const sparkSize = 6 + Math.sin(sparkTime) * 3;
        ctx.beginPath();
        ctx.arc(12, -f.radius - 32, sparkSize, 0, Math.PI * 2);
        ctx.fillStyle = '#fde047';
        ctx.shadowColor = '#f97316';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Warning skull/symbol
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('☠', 0, 2);

      } else {
        // Realistic Whole Fruits with dynamic shading
        const rad = f.radius;

        // Outer skin
        ctx.beginPath();
        ctx.arc(0, 0, rad, 0, Math.PI * 2);
        const skinGrad = ctx.createRadialGradient(-rad * 0.35, -rad * 0.35, rad * 0.1, 0, 0, rad);
        skinGrad.addColorStop(0, '#ffffff35');
        skinGrad.addColorStop(0.3, f.skinColor);
        skinGrad.addColorStop(1, '#00000040');
        ctx.fillStyle = skinGrad;
        ctx.fill();

        if (f.name === 'watermelon') {
          // Dark wavy stripes
          ctx.strokeStyle = '#14532d';
          ctx.lineWidth = 6;
          for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 14, -rad + 3);
            ctx.quadraticCurveTo(i * 18 + 6, 0, i * 14, rad - 3);
            ctx.stroke();
          }
        } else if (f.name === 'apple') {
          // Stem & green leaf
          ctx.fillStyle = '#78350f';
          ctx.fillRect(-2.5, -rad - 10, 5, 12);
          ctx.beginPath();
          ctx.ellipse(8, -rad - 8, 10, 5, 0.4, 0, Math.PI * 2);
          ctx.fillStyle = '#4ade80';
          ctx.fill();
        } else if (f.name === 'orange') {
          // Dimple pores
          ctx.fillStyle = 'rgba(255,255,255,0.25)';
          for (let a = 0; a < 8; a++) {
            const ang = a * 0.78;
            ctx.beginPath();
            ctx.arc(Math.cos(ang) * (rad * 0.5), Math.sin(ang) * (rad * 0.5), 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Realistic Gloss Reflection
        ctx.beginPath();
        ctx.ellipse(-rad * 0.35, -rad * 0.35, rad * 0.3, rad * 0.18, -0.6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fill();
      }

      ctx.restore();
    }

    // --- Draw Splitted Fruit Half (Inner Cross-section) ---
    function drawFruitHalf(h) {
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rotation);

      const r = h.radius;
      // Sliced face is a semi-circle along horizontal axis
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI, false);
      ctx.closePath();
      ctx.fillStyle = h.skinColor;
      ctx.fill();

      // Inner Rind / Flesh
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.88, 0, Math.PI, false);
      ctx.closePath();
      ctx.fillStyle = h.fleshColor;
      ctx.fill();

      // Interior Details per fruit type
      if (h.name === 'watermelon') {
        ctx.fillStyle = '#1e293b';
        [[-r * 0.45, 10], [0, 16], [r * 0.45, 10], [-r * 0.22, 22], [r * 0.22, 22]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.ellipse(sx, sy, 2.5, 4.5, 0.2, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (h.name === 'orange') {
        // Orange Citrus Segments
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1.5;
        for (let a = 1; a < 6; a++) {
          const ang = (Math.PI / 6) * a;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ang) * (r * 0.85), Math.sin(ang) * (r * 0.85));
          ctx.stroke();
        }
      } else if (h.name === 'apple') {
        // Apple Core & Pip
        ctx.fillStyle = '#ca8a04';
        ctx.beginPath();
        ctx.ellipse(0, 8, 8, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#451a03';
        ctx.beginPath();
        ctx.arc(2, 8, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (h.name === 'dragonfruit') {
        // Black speck seeds
        ctx.fillStyle = '#09090b';
        for (let i = 0; i < 9; i++) {
          const sx = (Math.random() - 0.5) * (r * 1.3);
          const sy = 4 + Math.random() * (r * 0.65);
          ctx.fillRect(sx, sy, 2, 2);
        }
      }

      ctx.restore();
    }

    // --- Floating Text Popups (+1, +3, Combo!) ---
    function addFloatText(text, x, y, color = '#facc15', size = 28) {
      floatTexts.push({ text, x, y, color, size, alpha: 1, vy: -2.5 });
    }

    // --- Splatter Generation ---
    function createSplatter(x, y, color) {
      const drops = [];
      const numDrops = 6 + Math.floor(Math.random() * 8);
      for (let i = 0; i < numDrops; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 18 + Math.random() * 55;
        drops.push({
          dx: Math.cos(angle) * dist,
          dy: Math.sin(angle) * dist,
          r: 2.5 + Math.random() * 4.5
        });
      }

      splatters.push({
        x, y,
        rx: 26 + Math.random() * 22,
        ry: 18 + Math.random() * 16,
        rotation: Math.random() * Math.PI * 2,
        color: color + '55', // translucent
        drops,
        alpha: 0.95
      });

      if (splatters.length > 25) splatters.shift();
    }

    // --- Realistic Slicing Physics ---
    function sliceFruit(f, bladeAngle) {
      if (f.sliced) return;
      f.sliced = true;

      if (f.isBomb) {
        AudioEngine.playBomb();
        triggerHaptic('heavy');
        screenShake = 24;
        flashScreenAlpha = 0.85;

        // Penalty for bomb in 3-minute arcade
        timeLeft = Math.max(0, timeLeft - 10);
        addFloatText("-10 SEC!", f.x, f.y, '#ef4444', 36);

        // Huge bomb particle cloud
        for (let i = 0; i < 45; i++) {
          particles.push({
            x: f.x, y: f.y,
            vx: (Math.random() - 0.5) * 18,
            vy: (Math.random() - 0.5) * 18,
            radius: 3 + Math.random() * 8,
            color: ['#f97316', '#ef4444', '#fbbf24', '#475569'][Math.floor(Math.random() * 4)],
            alpha: 1,
            gravity: 0.35
          });
        }
        fruits = fruits.filter(item => item !== f);
        return;
      }

      // Combo Tracking
      const now = Date.now();
      if (now - lastSliceTime < 420) {
        combo++;
      } else {
        combo = 1;
      }
      lastSliceTime = now;

      const earnedPoints = f.points * (combo > 1 ? combo : 1);
      score += earnedPoints;
      scoreEl.textContent = score;

      AudioEngine.playSlice(combo);
      triggerHaptic(combo > 2 ? 'heavy' : 'light');

      // Floating score visual
      if (combo > 1) {
        addFloatText(`+${earnedPoints} (Combo x${combo})`, f.x, f.y - 10, '#4ade80', 30);
        comboEl.textContent = `Combo x${combo}!`;
        comboEl.classList.add('show');
      } else {
        addFloatText(`+${earnedPoints}`, f.x, f.y - 10, '#fef08a', 24);
      }

      // Dojo wall stain & spray
      createSplatter(f.x, f.y, f.fleshColor);

      // Squirting juice drops
      for (let i = 0; i < 22; i++) {
        const spd = 4 + Math.random() * 12;
        const ang = Math.random() * Math.PI * 2;
        particles.push({
          x: f.x, y: f.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          radius: 2 + Math.random() * 4,
          color: Math.random() > 0.4 ? f.fleshColor : f.skinColor,
          alpha: 1,
          gravity: 0.4
        });
      }

      // True Split Halves (Left & Right halves pushed apart perpendicularly)
      const perpAngle = bladeAngle + Math.PI / 2;
      const pushSpeed = 4.5 + Math.random() * 2.5;

      fruitHalves.push({
        x: f.x,
        y: f.y,
        vx: f.vx + Math.cos(perpAngle) * pushSpeed,
        vy: f.vy + Math.sin(perpAngle) * pushSpeed - 1.5,
        rotation: bladeAngle,
        rotSpeed: -0.1 - Math.random() * 0.15,
        radius: f.radius,
        name: f.name,
        skinColor: f.skinColor,
        fleshColor: f.fleshColor,
        seedColor: f.seedColor,
        alpha: 1
      });

      fruitHalves.push({
        x: f.x,
        y: f.y,
        vx: f.vx - Math.cos(perpAngle) * pushSpeed,
        vy: f.vy - Math.sin(perpAngle) * pushSpeed - 1.5,
        rotation: bladeAngle + Math.PI,
        rotSpeed: 0.1 + Math.random() * 0.15,
        radius: f.radius,
        name: f.name,
        skinColor: f.skinColor,
        fleshColor: f.fleshColor,
        seedColor: f.seedColor,
        alpha: 1
      });

      fruits = fruits.filter(item => item !== f);
    }

    // --- Fruit Spawning System (Waves & Arcs from bottom) ---
    function spawnWave() {
      const isMulti = Math.random() < 0.65;
      const waveSize = isMulti ? 2 + Math.floor(Math.random() * 3) : 1;

      for (let i = 0; i < waveSize; i++) {
        setTimeout(() => {
          if (gameState !== 'playing') return;
          const isBomb = Math.random() < 0.18;
          const template = isBomb 
            ? FRUIT_PRESETS.find(p => p.isBomb) 
            : FRUIT_PRESETS[Math.floor(Math.random() * (FRUIT_PRESETS.length - 1))];

          const startX = width * 0.15 + Math.random() * (width * 0.7);
          const startY = height + 40;

          // Parabolic throw aiming toward center
          const targetX = width * 0.25 + Math.random() * (width * 0.5);
          const launchVx = (targetX - startX) * 0.022;
          const launchVy = -(13.5 + Math.random() * 4.5); // arc height

          fruits.push({
            ...template,
            x: startX,
            y: startY,
            vx: launchVx,
            vy: launchVy,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.08,
            sliced: false
          });
        }, i * 160);
      }
    }

    // --- Touch / Mouse Blade Input ---
    let isMouseDown = false;
    let prevPoint = null;

    function handlePointerDown(e) {
      AudioEngine.init();
      isMouseDown = true;
      const p = getEventPos(e);
      prevPoint = p;
      bladePath = [{ x: p.x, y: p.y, time: performance.now() }];
    }

    function handlePointerMove(e) {
      if (!isMouseDown || gameState !== 'playing') return;
      const p = getEventPos(e);
      const now = performance.now();

      bladePath.push({ x: p.x, y: p.y, time: now });
      if (bladePath.length > 18) bladePath.shift();

      if (prevPoint) {
        const dx = p.x - prevPoint.x;
        const dy = p.y - prevPoint.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 15) {
          AudioEngine.playSwoosh();
          const bladeAngle = Math.atan2(dy, dx);

          // Check intersection with all active fruits
          for (let i = fruits.length - 1; i >= 0; i--) {
            const f = fruits[i];
            const d = pointToSegmentDistance(f.x, f.y, prevPoint.x, prevPoint.y, p.x, p.y);
            if (d < f.radius + 10) {
              sliceFruit(f, bladeAngle);
            }
          }
        }
      }
      prevPoint = p;
    }

    function handlePointerUp() {
      isMouseDown = false;
      prevPoint = null;
    }

    function getEventPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
    canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerUp);

    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    // --- Blade Trail Render ---
    function drawBladeTrail() {
      const now = performance.now();
      bladePath = bladePath.filter(pt => now - pt.time < 160);

      if (bladePath.length < 2) return;

      // Outer Glow
      ctx.beginPath();
      ctx.moveTo(bladePath[0].x, bladePath[0].y);
      for (let i = 1; i < bladePath.length; i++) {
        ctx.lineTo(bladePath[i].x, bladePath[i].y);
      }
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      // Sharp Silver Core
      ctx.beginPath();
      ctx.moveTo(bladePath[0].x, bladePath[0].y);
      for (let i = 1; i < bladePath.length; i++) {
        ctx.lineTo(bladePath[i].x, bladePath[i].y);
      }
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    // --- Main Game Update Loop ---
    function update(dt) {
      if (gameState !== 'playing') return;

      gameTime += dt;
      spawnTimer += dt;

      // Dynamic spawn cadence that scales nicely across 3 minutes
      const currentInterval = Math.max(0.9, 2.2 - (gameTime / ROUND_TIME) * 1.1);
      if (spawnTimer >= currentInterval) {
        spawnWave();
        spawnTimer = 0;
      }

      // Update whole fruits
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.x += f.vx;
        f.y += f.vy;
        f.vy += 0.38; // gravity
        f.rotation += f.rotSpeed;

        if (f.y > height + 80 && f.vy > 0) {
          fruits.splice(i, 1);
        }
      }

      // Update falling fruit halves
      for (let i = fruitHalves.length - 1; i >= 0; i--) {
        const h = fruitHalves[i];
        h.x += h.vx;
        h.y += h.vy;
        h.vy += 0.48; // heavier gravity
        h.rotation += h.rotSpeed;

        if (h.y > height + 90) {
          fruitHalves.splice(i, 1);
        }
      }

      // Update juice spray particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= 0.02;
        if (p.alpha <= 0 || p.y > height) {
          particles.splice(i, 1);
        }
      }

      // Update floating score texts
      for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.025;
        if (ft.alpha <= 0) {
          floatTexts.splice(i, 1);
        }
      }

      // Fade board splatters gently over time
      splatters.forEach(s => {
        s.alpha -= 0.0003;
      });
      splatters = splatters.filter(s => s.alpha > 0.05);

      // Reset combo visual if idle
      if (Date.now() - lastSliceTime > 650) {
        combo = 0;
        comboEl.classList.remove('show');
      }

      // Screen shake decay
      if (screenShake > 0) screenShake *= 0.88;
      if (flashScreenAlpha > 0) flashScreenAlpha -= dt * 2.5;

      // 3-Minute Countdown
      timeLeft -= dt;
      if (timeLeft < 0) timeLeft = 0;

      // Format Timer (MM:SS)
      const minutes = Math.floor(timeLeft / 60);
      const seconds = Math.floor(timeLeft % 60);
      timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

      if (timeLeft <= 30) {
        timerEl.classList.add('warning');
      } else {
        timerEl.classList.remove('warning');
      }

      if (timeLeft <= 0) {
        endGame();
      }
    }

    // --- Render Loop ---
    function render() {
      ctx.save();

      // Screen shake translation
      if (screenShake > 0.5) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      drawBackground();

      // Sliced Halves (behind whole fruits)
      fruitHalves.forEach(h => drawFruitHalf(h));

      // Whole Flying Fruits
      fruits.forEach(f => drawFruit(f));

      // Juice Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Floating Texts
      floatTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillStyle = ft.color;
        ctx.font = `bold ${ft.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 8;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });

      // Blade Stroke Trail
      drawBladeTrail();

      // Bomb flash effect
      if (flashScreenAlpha > 0.02) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashScreenAlpha})`;
        ctx.fillRect(0, 0, width, height);
      }

      ctx.restore();
    }

    // --- Game Clock Cycle ---
    let lastStamp = performance.now();
    function tick(now) {
      const dt = Math.min((now - lastStamp) / 1000, 0.05);
      lastStamp = now;
      update(dt);
      render();
      requestAnimationFrame(tick);
    }

    // --- Start & End Lifecycle ---
    function startGame() {
      AudioEngine.init();
      score = 0;
      timeLeft = ROUND_TIME; // 180 seconds = 3 mins
      combo = 0;
      gameTime = 0;
      spawnTimer = 0;
      fruits = [];
      fruitHalves = [];
      particles = [];
      splatters = [];
      floatTexts = [];
      bladePath = [];
      screenShake = 0;
      flashScreenAlpha = 0;

      scoreEl.textContent = '0';
      timerEl.textContent = '03:00';
      timerEl.classList.remove('warning');

      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      gameState = 'playing';
    }

    function endGame() {
      gameState = 'gameover';
      triggerHaptic('heavy');

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('ninjaBladeBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }

      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Highscore: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    requestAnimationFrame(tick);
  </script>
</body>
