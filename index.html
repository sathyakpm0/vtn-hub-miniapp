<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cricket Champions: 3 Overs Showdown</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    
    /* Top TV Broadcast Scoreboard */
    #scoreboard {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 2px solid #3b82f6; border-radius: 12px; padding: 10px 16px;
      color: #fff; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      pointer-events: none; z-index: 10;
    }
    .team-badge { display: flex; align-items: center; gap: 8px; }
    .badge-icon { font-size: 24px; }
    .score-main { font-size: 26px; font-weight: 900; color: #38ef7d; letter-spacing: 1px; }
    .wickets-limit { font-size: 13px; color: #ef4444; font-weight: bold; }
    .match-info { text-align: right; }
    .overs-count { font-size: 18px; font-weight: 800; color: #fbbf24; }
    .match-tag { font-size: 10px; color: #94a3b8; font-weight: bold; letter-spacing: 1px; }

    /* Timing Circle Indicator */
    #timing-ring-container {
      position: absolute; bottom: 130px; left: 50%;
      transform: translateX(-50%); width: 90px; height: 90px;
      pointer-events: none; display: flex; align-items: center; justify-content: center;
    }
    .ring-target {
      position: absolute; width: 70px; height: 70px;
      border: 3px dashed rgba(56, 239, 125, 0.7); border-radius: 50%;
    }
    .ring-pulse {
      position: absolute; width: 100px; height: 100px;
      border: 4px solid #f59e0b; border-radius: 50%;
      transform: scale(1.6); opacity: 0;
    }

    /* Big Responsive Batting Tap Button */
    #hit-btn-container {
      position: absolute; bottom: 25px; left: 0; width: 100%;
      display: flex; justify-content: center; z-index: 20;
    }
    #hit-btn {
      width: 82%; max-width: 320px; height: 62px;
      background: linear-gradient(180deg, #ff0055 0%, #c2003f 100%);
      border: 2px solid #ff77a8; border-radius: 35px;
      box-shadow: 0 8px 25px rgba(255, 0, 85, 0.5), inset 0 2px 4px rgba(255,255,255,0.4);
      color: #fff; font-size: 22px; font-weight: 900; letter-spacing: 2px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; active: transform: scale(0.96);
    }
    #hit-btn:active { transform: scale(0.95); }

    /* Broadcast Action Toast (Six, Catch, etc.) */
    #broadcast-toast {
      position: absolute; top: 40%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 46px; font-weight: 900; font-style: italic;
      color: #ffeb3b; text-shadow: 0 0 25px #ff0055, 4px 4px 0 #000;
      transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center; white-space: nowrap; pointer-events: none; z-index: 30;
    }
    #broadcast-toast.show { transform: translate(-50%, -50%) scale(1.15); }
    #toast-detail { font-size: 17px; color: #fff; text-shadow: 1px 1px 3px #000; font-style: normal; }

    /* Game Over Modal */
    #gameover-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 30, 0.95); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 50; padding: 20px;
    }
    .modal-card {
      background: #1e293b; border: 3px solid #f59e0b; border-radius: 20px;
      padding: 30px 25px; text-align: center; max-width: 320px; width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-title { font-size: 28px; font-weight: 900; color: #ff0055; margin-bottom: 10px; }
    .modal-score { font-size: 42px; font-weight: 900; color: #38ef7d; margin: 10px 0; }
    .modal-stats { font-size: 14px; color: #94a3b8; margin-bottom: 25px; }
    .btn-restart {
      background: #3b82f6; border: none; padding: 14px 28px; border-radius: 30px;
      color: #fff; font-size: 18px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <!-- Scoreboard -->
  <div id="scoreboard">
    <div class="team-badge">
      <div class="badge-icon">🦁</div>
      <div>
        <div class="score-main" id="score">0 / 0</div>
        <div class="wickets-limit">MAX 3 WICKETS</div>
      </div>
    </div>
    <div class="match-info">
      <div class="overs-count" id="overs">0.0 / 3.0</div>
      <div class="match-tag" id="status-tag">3 OVERS SHOWDOWN</div>
    </div>
  </div>

  <!-- Timing Ring Graphic -->
  <div id="timing-ring-container">
    <div class="ring-target"></div>
    <div class="ring-pulse" id="ringPulse"></div>
  </div>

  <!-- Action Notification Toast -->
  <div id="broadcast-toast">
    <div id="toast-title">SIX!</div>
    <div id="toast-detail">TIMING: PERFECT!</div>
  </div>

  <!-- Tap to Hit Button -->
  <div id="hit-btn-container">
    <button id="hit-btn">🏏 TAP TO HIT</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-modal">
    <div class="modal-card">
      <div class="modal-title" id="go-title">ALL OUT!</div>
      <div class="modal-score" id="go-score">42 / 3</div>
      <div class="modal-stats" id="go-stats">OVERS COMPLETED: 1.4 / 3.0</div>
      <button class="btn-restart" id="btnRestart">PLAY AGAIN</button>
    </div>
  </div>

<script>
// --- TELEGRAM WEBAPP INTEGRATION ---
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
}

function triggerHaptic(type) {
  if (tg?.HapticFeedback) {
    if (type === 'six') tg.HapticFeedback.impactOccurred('heavy');
    else if (type === 'four') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'out') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred('light');
  }
}

// --- SYNTHESIZED CRICKET AUDIO ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBatHitSound(perfect = true) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = perfect ? 'triangle' : 'square';
  osc.frequency.setValueAtTime(perfect ? 520 : 260, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.14);
  gain.gain.setValueAtTime(1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

function playCheerCrowd() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const bufferSize = audioCtx.sampleRate * 1.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.setValueAtTime(900, audioCtx.currentTime);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start();
}

// --- THREE.JS SCENE SETUP ---
const container = document.getElementById('game-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e3a8a); // Evening cricket stadium blue
scene.fog = new THREE.Fog(0x1e3a8a, 40, 110);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Balanced Stadium Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xfff7ed, 1.1);
mainLight.position.set(18, 30, 20);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 1024;
mainLight.shadow.mapSize.height = 1024;
mainLight.shadow.camera.near = 5;
mainLight.shadow.camera.far = 70;
mainLight.shadow.camera.left = -25;
mainLight.shadow.camera.right = 25;
mainLight.shadow.camera.top = 25;
mainLight.shadow.camera.bottom = -25;
scene.add(mainLight);

// Stadium Grandstand / Crowd Wall
const standsGeo = new THREE.CylinderGeometry(52, 54, 9, 36, 1, true);
const standsMat = new THREE.MeshLambertMaterial({ color: 0x334155, side: THREE.BackSide });
const stands = new THREE.Mesh(standsGeo, standsMat);
stands.position.y = 4.5;
scene.add(stands);

// Floodlight Towers
function createFloodlightTower(x, z) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 18, 8), new THREE.MeshLambertMaterial({ color: 0x64748b }));
  pole.position.set(x, 9, z);
  const head = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 0.8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  head.position.set(x, 18, z);
  head.lookAt(0, 0, 0);
  scene.add(pole, head);
}
createFloodlightTower(-35, -35);
createFloodlightTower(35, -35);
createFloodlightTower(-35, 35);
createFloodlightTower(35, 35);

// Outfield (Lush Lawn)
const outfieldGeo = new THREE.CircleGeometry(50, 48);
const outfieldMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
const outfield = new THREE.Mesh(outfieldGeo, outfieldMat);
outfield.rotation.x = -Math.PI / 2;
outfield.receiveShadow = true;
scene.add(outfield);

// Boundary Rope
const rope = new THREE.Mesh(new THREE.TorusGeometry(47, 0.35, 8, 48), new THREE.MeshLambertMaterial({ color: 0xffffff }));
rope.rotation.x = Math.PI / 2;
rope.position.y = 0.1;
scene.add(rope);

// Cricket Pitch Strip
const pitchGeo = new THREE.BoxGeometry(3.6, 0.05, 22);
const pitchMat = new THREE.MeshLambertMaterial({ color: 0xd4a373 }); // Natural clay turf
const pitch = new THREE.Mesh(pitchGeo, pitchMat);
pitch.position.set(0, 0, 0);
pitch.receiveShadow = true;
scene.add(pitch);

// Pitch Creases
function createWhiteLine(z, w = 3.0) {
  const line = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, 0.12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  line.position.set(0, 0, z);
  scene.add(line);
}
createWhiteLine(8.5);  // Batting Crease
createWhiteLine(-8.5); // Bowling Crease

// 3D Stumps Builder
function createWicketSet(z) {
  const group = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xf59e0b });
  for (let i = -1; i <= 1; i++) {
    const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.85, 8), mat);
    stump.position.set(i * 0.15, 0.425, 0);
    stump.castShadow = true;
    group.add(stump);
  }
  const bail = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.36, 6), mat);
  bail.rotation.z = Math.PI / 2;
  bail.position.set(0, 0.86, 0);
  group.add(bail);
  group.position.set(0, 0, z);
  scene.add(group);
  return group;
}
const batterWickets = createWicketSet(9.4);
createWicketSet(-9.4);

// --- CARTOON CHARACTER BUILDERS ---
// Helper: Procedural Cartoon Eye
function createCartoonEye() {
  const eye = new THREE.Group();
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), new THREE.MeshBasicMaterial({ color: 0x000000 }));
  pupil.position.z = 0.05;
  eye.add(sclera, pupil);
  return eye;
}

// 1. CARTOON BATSMAN (Lion Hero)
function buildCartoonLionBatsman() {
  const char = new THREE.Group();

  // Head (Golden Lion)
  const headMat = new THREE.MeshLambertMaterial({ color: 0xf59e0b });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), headMat);
  head.position.y = 1.45;
  head.castShadow = true;
  char.add(head);

  // Lion Ears
  const earMat = new THREE.MeshLambertMaterial({ color: 0xd97706 });
  const leftEar = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), earMat);
  leftEar.position.set(-0.24, 1.7, 0);
  const rightEar = leftEar.clone();
  rightEar.position.x = 0.24;
  char.add(leftEar, rightEar);

  // Snout & Nose
  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 10), new THREE.MeshLambertMaterial({ color: 0xfef08a }));
  snout.position.set(0, 1.38, 0.25);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), new THREE.MeshBasicMaterial({ color: 0x1f2937 }));
  nose.position.set(0, 1.44, 0.35);
  char.add(snout, nose);

  // Eyes
  const leftEye = createCartoonEye();
  leftEye.position.set(-0.11, 1.52, 0.26);
  const rightEye = createCartoonEye();
  rightEye.position.set(0.11, 1.52, 0.26);
  char.add(leftEye, rightEye);

  // Blue Cricket Cap
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.33, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x1d4ed8 }));
  cap.position.y = 1.48;
  const visor = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.04, 16, 1, false, 0, Math.PI), new THREE.MeshLambertMaterial({ color: 0x1d4ed8 }));
  visor.position.set(0, 1.48, 0.22);
  visor.rotation.x = 0.2;
  char.add(cap, visor);

  // Torso / Jersey (India Blue)
  const jersey = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.24, 0.65, 12), new THREE.MeshLambertMaterial({ color: 0x2563eb }));
  jersey.position.y = 0.88;
  jersey.castShadow = true;
  char.add(jersey);

  // White Pads & Legs
  const padMat = new THREE.MeshLambertMaterial({ color: 0xf8fafc });
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.58, 0.2), padMat);
  leftLeg.position.set(-0.16, 0.29, 0);
  leftLeg.castShadow = true;
  const rightLeg = leftLeg.clone();
  rightLeg.position.x = 0.16;
  char.add(leftLeg, rightLeg);

  // Bat Pivot & Willow Bat
  const batArmPivot = new THREE.Group();
  batArmPivot.position.set(0.28, 0.95, 0.1);

  const bat = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.85, 0.06), new THREE.MeshLambertMaterial({ color: 0xb45309 }));
  bat.position.set(0, -0.42, 0);
  bat.castShadow = true;

  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.35, 8), new THREE.MeshLambertMaterial({ color: 0xffffff }));
  handle.position.set(0, 0.12, 0);
  batArmPivot.add(bat, handle);
  char.add(batArmPivot);

  char.batPivot = batArmPivot;
  return char;
}

// 2. CARTOON BOWLER (Fast Cheetah)
function buildCartoonBowler() {
  const char = new THREE.Group();
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 14, 14), new THREE.MeshLambertMaterial({ color: 0xeab308 }));
  head.position.y = 1.4;
  head.castShadow = true;
  char.add(head);

  // Cheetah Ears & Eyes
  const ear = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshLambertMaterial({ color: 0xa16207 }));
  ear.position.set(-0.2, 1.62, 0);
  const ear2 = ear.clone(); ear2.position.x = 0.2;
  char.add(ear, ear2);

  const e1 = createCartoonEye(); e1.position.set(-0.09, 1.44, 0.23);
  const e2 = createCartoonEye(); e2.position.set(0.09, 1.44, 0.23);
  char.add(e1, e2);

  // Jersey (Rival Green)
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.22, 0.65, 10), new THREE.MeshLambertMaterial({ color: 0x16a34a }));
  body.position.y = 0.85;
  body.castShadow = true;
  char.add(body);

  // Bowling Arm Pivot
  const armPivot = new THREE.Group();
  armPivot.position.set(0.3, 1.1, 0);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 8), new THREE.MeshLambertMaterial({ color: 0xeab308 }));
  arm.position.y = -0.3;
  armPivot.add(arm);
  char.add(armPivot);
  char.armPivot = armPivot;

  // Legs for run animation
  const l1 = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.6, 8), new THREE.MeshLambertMaterial({ color: 0x15803d }));
  l1.position.set(-0.12, 0.3, 0);
  const l2 = l1.clone(); l2.position.x = 0.12;
  char.add(l1, l2);
  char.leftLeg = l1; char.rightLeg = l2;

  return char;
}

// 3. CARTOON FIELDER (Fox)
function buildCartoonFielder(color = 0x16a34a) {
  const char = new THREE.Group();
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), new THREE.MeshLambertMaterial({ color: 0xf97316 }));
  head.position.y = 1.25;
  char.add(head);

  // Fox Snout
  const snout = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.25, 8), new THREE.MeshLambertMaterial({ color: 0xffedd5 }));
  snout.rotation.x = Math.PI / 2;
  snout.position.set(0, 1.2, 0.25);
  char.add(snout);

  const e1 = createCartoonEye(); e1.position.set(-0.08, 1.3, 0.19);
  const e2 = createCartoonEye(); e2.position.set(0.08, 1.3, 0.19);
  char.add(e1, e2);

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.18, 0.55, 10), new THREE.MeshLambertMaterial({ color }));
  body.position.y = 0.75;
  body.castShadow = true;
  char.add(body);

  const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.5, 8), new THREE.MeshLambertMaterial({ color }));
  leg1.position.set(-0.1, 0.25, 0);
  const leg2 = leg1.clone(); leg2.position.x = 0.1;
  char.add(leg1, leg2);
  char.leg1 = leg1; char.leg2 = leg2;

  return char;
}

// Instantiate Characters
const batsman = buildCartoonLionBatsman();
batsman.position.set(0.25, 0, 8.6);
batsman.rotation.y = -Math.PI / 2;
scene.add(batsman);

const bowler = buildCartoonBowler();
bowler.position.set(0, 0, -18);
scene.add(bowler);

// Position 5 Active Cartoon Fielders
const fielders = [
  { char: buildCartoonFielder(), basePos: new THREE.Vector3(-14, 0, 4), pos: new THREE.Vector3(-14, 0, 4), name: 'Cover' },
  { char: buildCartoonFielder(), basePos: new THREE.Vector3(14, 0, 3), pos: new THREE.Vector3(14, 0, 3), name: 'Mid-Wicket' },
  { char: buildCartoonFielder(), basePos: new THREE.Vector3(-8, 0, -10), pos: new THREE.Vector3(-8, 0, -10), name: 'Mid-Off' },
  { char: buildCartoonFielder(), basePos: new THREE.Vector3(9, 0, -10), pos: new THREE.Vector3(9, 0, -10), name: 'Mid-On' },
  { char: buildCartoonFielder(), basePos: new THREE.Vector3(18, 0, 16), pos: new THREE.Vector3(18, 0, 16), name: 'Deep Square' }
];
fielders.forEach(f => {
  f.char.position.copy(f.basePos);
  f.char.lookAt(0, 0, 8.6);
  scene.add(f.char);
});

// 3D Cricket Ball
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.12, 16, 16),
  new THREE.MeshLambertMaterial({ color: 0xdc2626 }) // Red Kookaburra
);
ball.castShadow = true;
scene.add(ball);

// --- MATCH STATE & CRICKET RULES ---
const TOTAL_BALLS = 18; // 3 OVERS (3 x 6)
let ballsBowled = 0;
let runs = 0;
let wickets = 0;
const MAX_WICKETS = 3;

let gameState = 'START_RUNUP'; // START_RUNUP, BOWLING, IN_AIR, FIELDING, BALL_DEAD, MATCH_OVER
let ballVelocity = new THREE.Vector3();
let ballLandingTime = 0;
let ballDeliveryTime = 0;
let swingProgress = 0;
let isSwinging = false;
let activeChasingFielder = null;

// Camera Default
const camDefaultPos = new THREE.Vector3(0, 2.7, 13.5);
const camDefaultLook = new THREE.Vector3(0, 1.2, 0);
camera.position.copy(camDefaultPos);
camera.lookAt(camDefaultLook);

// UI Toast Prompt
function showToast(title, subtitle, color = '#ffeb3b') {
  const toast = document.getElementById('broadcast-toast');
  const tTitle = document.getElementById('toast-title');
  const tSub = document.getElementById('toast-detail');
  tTitle.innerText = title;
  tTitle.style.color = color;
  tSub.innerText = subtitle;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
}

// Update Broadcast Scoreboard UI
function updateScoreboard() {
  document.getElementById('score').innerText = `${runs} / ${wickets}`;
  const ov = Math.floor(ballsBowled / 6);
  const b = ballsBowled % 6;
  document.getElementById('overs').innerText = `${ov}.${b} / 3.0`;
}

// Check End of Match
function checkMatchOver() {
  if (wickets >= MAX_WICKETS || ballsBowled >= TOTAL_BALLS) {
    gameState = 'MATCH_OVER';
    const modal = document.getElementById('gameover-modal');
    document.getElementById('go-title').innerText = wickets >= MAX_WICKETS ? "ALL OUT!" : "INNINGS COMPLETED!";
    document.getElementById('go-score').innerText = `${runs} / ${wickets}`;
    document.getElementById('go-stats').innerText = `TOTAL RUNS: ${runs} | BALLS FACED: ${ballsBowled}/${TOTAL_BALLS}`;
    modal.style.display = 'flex';
    triggerHaptic('out');
    return true;
  }
  return false;
}

// Restart Match
document.getElementById('btnRestart').addEventListener('click', () => {
  runs = 0; wickets = 0; ballsBowled = 0;
  document.getElementById('gameover-modal').style.display = 'none';
  updateScoreboard();
  startNextDelivery();
});

// Delivery Cycle Routine
function startNextDelivery() {
  if (checkMatchOver()) return;

  gameState = 'START_RUNUP';
  bowler.position.set(0, 0, -18);
  ball.position.set(0, 1.4, -18);
  ballVelocity.set(0, 0, 0);

  // Reset Fielders
  fielders.forEach(f => {
    f.char.position.copy(f.basePos);
    f.char.lookAt(0, 0, 8.6);
  });
  activeChasingFielder = null;

  // Reset Camera
  camera.position.copy(camDefaultPos);
  camera.lookAt(camDefaultLook);

  // Batsman Stance
  batsman.batPivot.rotation.set(0.3, 0, 0.4);
  isSwinging = false;
  swingProgress = 0;
}

// Release the Ball from Bowler's Hand
function releaseDelivery() {
  gameState = 'BOWLING';
  ballDeliveryTime = performance.now();

  // Delivery variation: In-swinger, Out-swinger, Yorker or Good length
  const targetX = (Math.random() - 0.5) * 0.9; // Line around off/middle stump
  const targetZ = 8.6; // Batsman crease
  const deliveryFlightTime = 55; // Frames to arrive

  ball.position.set(bowler.position.x + 0.25, 1.8, bowler.position.z);
  ballVelocity.x = (targetX - ball.position.x) / deliveryFlightTime;
  ballVelocity.z = (targetZ - ball.position.z) / deliveryFlightTime;
  ballVelocity.y = -0.024; // Drops towards pitch
}

// --- BATSMAN SWING & TIMING LOGIC ---
function triggerBatSwing() {
  if (gameState !== 'BOWLING' || isSwinging) return;
  isSwinging = true;
  swingProgress = 0;

  // Calculate Timing Delta
  const distToCrease = ball.position.z;
  const timingDelta = Math.abs(distToCrease - 8.6); // 8.6 is sweet spot

  // Evaluate Timing Outcomes
  if (timingDelta <= 0.35) {
    // 1. PERFECT TIMING -> MASSIVE 6!
    playBatHitSound(true);
    playCheerCrowd();
    triggerHaptic('six');
    runs += 6;
    ballsBowled++;
    showToast("SIX!", "PERFECT TIMING! 🚀", "#ffeb3b");
    
    gameState = 'IN_AIR';
    ballVelocity.set((Math.random() - 0.5) * 0.9, 0.65, -(0.85 + Math.random() * 0.35));
    endBallAfterDelay(3200);

  } else if (timingDelta <= 0.8) {
    // 2. GOOD TIMING -> 4 RUNS CRACKING BOUNDARY!
    playBatHitSound(true);
    triggerHaptic('four');
    runs += 4;
    ballsBowled++;
    showToast("FOUR!", "GREAT TIMING! CRACKING DRIVE", "#38ef7d");
    
    gameState = 'IN_AIR';
    const side = Math.random() > 0.5 ? 1 : -1;
    ballVelocity.set(side * 0.75, 0.25, -(0.7 + Math.random() * 0.2));
    endBallAfterDelay(2800);

  } else if (timingDelta <= 1.5) {
    // 3. MISCUED / EARLY OR LATE -> RISKY SHOT INTO THE AIR!
    playBatHitSound(false);
    triggerHaptic('medium');
    
    const hitDirection = (Math.random() - 0.5) * 1.2;
    ballVelocity.set(hitDirection, 0.45, -(0.4 + Math.random() * 0.3));
    gameState = 'FIELDING';

    // Assign nearest fielder to chase
    activeChasingFielder = fielders.reduce((prev, curr) => {
      return curr.char.position.distanceTo(ball.position) < prev.char.position.distanceTo(ball.position) ? curr : prev;
    }, fielders[0]);

    // Check Catch probability based on timing
    setTimeout(() => {
      if (gameState === 'FIELDING') {
        const dist = activeChasingFielder.char.position.distanceTo(ball.position);
        if (dist < 4.5) {
          // CAUGHT OUT!
          wickets++;
          ballsBowled++;
          triggerHaptic('out');
          showToast("CAUGHT OUT!", `CATCH TAKEN BY ${activeChasingFielder.name.toUpperCase()}!`, "#ef4444");
        } else {
          // SAVED FOR 1 OR 2 RUNS
          const scoredRuns = Math.random() > 0.5 ? 2 : 1;
          runs += scoredRuns;
          ballsBowled++;
          showToast(`${scoredRuns} RUNS`, "GOOD RUNNING BETWEEN WICKETS", "#38ef7d");
        }
        updateScoreboard();
        endBallAfterDelay(1500);
      }
    }, 1400);

  } else {
    // 4. TOO LATE / SWUNG AT AIR
    showToast("MISSED!", "TOO LATE!", "#94a3b8");
  }
  updateScoreboard();
}

function endBallAfterDelay(ms) {
  setTimeout(() => {
    gameState = 'BALL_DEAD';
    updateScoreboard();
    setTimeout(startNextDelivery, 1200);
  }, ms);
}

// User Controls
document.getElementById('hit-btn').addEventListener('touchstart', (e) => {
  e.preventDefault();
  triggerBatSwing();
});
document.getElementById('hit-btn').addEventListener('mousedown', triggerBatSwing);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') triggerBatSwing();
});

// --- MAIN 60FPS GAME LOOP ---
function animate() {
  requestAnimationFrame(animate);

  // 1. Bowler Run-Up & Arm Windmill
  if (gameState === 'START_RUNUP') {
    bowler.position.z += 0.22;
    bowler.leftLeg.rotation.x = Math.sin(bowler.position.z * 3) * 0.6;
    bowler.rightLeg.rotation.x = -Math.sin(bowler.position.z * 3) * 0.6;
    bowler.armPivot.rotation.x += 0.25;

    if (bowler.position.z >= -9.2) {
      releaseDelivery();
    }
  }

  // 2. Ball Flying towards Batter
  if (gameState === 'BOWLING') {
    ball.position.add(ballVelocity);
    // Pitch Bounce
    if (ball.position.y <= 0.14) {
      ball.position.y = 0.14;
      ballVelocity.y = 0.085; // Upward bounce
    }

    // Timing Ring Feedback
    const dist = ball.position.z;
    const ring = document.getElementById('ringPulse');
    if (dist > 3.0 && dist < 9.0) {
      const scale = 1.0 + Math.max(0, (8.6 - dist) * 0.2);
      ring.style.opacity = '1';
      ring.style.transform = `scale(${Math.min(2.0, scale)})`;
    } else {
      ring.style.opacity = '0';
    }

    // Clean Bowled / Missed Detection
    if (ball.position.z > 9.6) {
      ring.style.opacity = '0';
      if (Math.abs(ball.position.x) < 0.45 && ball.position.y < 0.9) {
        // HIT WICKETS!
        wickets++;
        ballsBowled++;
        triggerHaptic('out');
        showToast("CLEAN BOWLED!", "MIDDLE STUMP SHATTERED! 💥", "#ef4444");
        batterWickets.children[1].rotation.x = -1.2; // dislodge middle stump
        batterWickets.children[3].position.y = 1.4;  // fly bails
        updateScoreboard();
        endBallAfterDelay(1800);
      } else {
        // Dot Ball / Beaten outside
        ballsBowled++;
        showToast("DOT BALL", "BEATEN OUTSIDE OFF", "#94a3b8");
        updateScoreboard();
        endBallAfterDelay(1200);
      }
      gameState = 'BALL_DEAD';
    }
  }

  // 3. Batsman Swing Follow-Through
  if (isSwinging) {
    swingProgress += 0.14;
    batsman.batPivot.rotation.x = 0.3 - swingProgress * 2.4;
    if (swingProgress >= 1.0) {
      isSwinging = false;
    }
  }

  // 4. Ball in Air & Fielders Chasing
  if (gameState === 'IN_AIR' || gameState === 'FIELDING') {
    ball.position.add(ballVelocity);
    ballVelocity.y -= 0.016; // Gravity

    // Bounce on grass
    if (ball.position.y <= 0.12) {
      ball.position.y = 0.12;
      ballVelocity.y = -ballVelocity.y * 0.45;
      ballVelocity.multiplyScalar(0.96);
    }

    // Dynamic Camera Tracking shot
    camera.position.lerp(new THREE.Vector3(ball.position.x * 0.3, 4.5, ball.position.z + 11), 0.06);
    camera.lookAt(ball.position);

    // Fielders running towards ball
    if (activeChasingFielder) {
      const fChar = activeChasingFielder.char;
      fChar.lookAt(ball.position.x, 0, ball.position.z);
      fChar.position.lerp(new THREE.Vector3(ball.position.x, 0, ball.position.z), 0.045);
      // Leg run animation
      fChar.leg1.rotation.x = Math.sin(performance.now() * 0.015) * 0.5;
      fChar.leg2.rotation.x = -Math.sin(performance.now() * 0.015) * 0.5;
    }
  }

  renderer.render(scene, camera);
}

// Window Resize Handling
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Launch Match
updateScoreboard();
startNextDelivery();
animate();
</script>
