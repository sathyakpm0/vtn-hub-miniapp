<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cricket Safari: 3-Over Animal Champions</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #09101d; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }

    /* Broadcast TV Header */
    #broadcast-header {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.9));
      border: 2px solid #3b82f6; border-radius: 12px; padding: 8px 16px;
      color: #fff; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      pointer-events: none; z-index: 10;
    }
    .batter-tag { display: flex; align-items: center; gap: 10px; }
    .batter-avatar { font-size: 28px; }
    .batter-name { font-size: 13px; font-weight: 800; color: #facc15; text-transform: uppercase; }
    .score-box { font-size: 26px; font-weight: 900; color: #38ef7d; }
    
    .match-meta { text-align: right; }
    .overs-val { font-size: 18px; font-weight: 900; color: #60a5fa; }
    .wickets-limit { font-size: 11px; color: #ef4444; font-weight: 800; }

    /* Timing Bar Indicator */
    #timing-box {
      position: absolute; bottom: 110px; left: 50%;
      transform: translateX(-50%); width: 260px;
      background: rgba(15, 23, 42, 0.9); border: 2px solid #64748b;
      border-radius: 20px; padding: 6px 12px; text-align: center;
      pointer-events: none; z-index: 10;
    }
    .timing-label { font-size: 11px; font-weight: 800; color: #94a3b8; letter-spacing: 1px; margin-bottom: 4px; }
    .timing-track {
      position: relative; width: 100%; height: 14px;
      background: #334155; border-radius: 10px; overflow: hidden;
      display: flex;
    }
    .zone-early { width: 35%; background: #f59e0b; }
    .zone-perfect { width: 30%; background: #22c55e; }
    .zone-late { width: 35%; background: #ef4444; }
    .timing-pointer {
      position: absolute; top: 0; left: 0%; width: 6px; height: 100%;
      background: #ffffff; box-shadow: 0 0 8px #fff; border-radius: 3px;
      transition: left 0.04s linear;
    }

    /* Big Responsive Batting Tap Button */
    #hit-btn-container {
      position: absolute; bottom: 22px; left: 0; width: 100%;
      display: flex; justify-content: center; z-index: 20;
    }
    #hit-btn {
      width: 86%; max-width: 340px; height: 65px;
      background: linear-gradient(180deg, #10b981 0%, #047857 100%);
      border: 3px solid #6ee7b7; border-radius: 35px;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5), inset 0 2px 4px rgba(255,255,255,0.4);
      color: #fff; font-size: 22px; font-weight: 900; letter-spacing: 2px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; active: transform: scale(0.96);
    }
    #hit-btn:active { transform: scale(0.96); }

    /* Action Message Banner */
    #action-toast {
      position: absolute; top: 35%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 46px; font-weight: 900; font-style: italic;
      color: #ffeb3b; text-shadow: 0 0 25px #ff0055, 4px 4px 0 #000;
      transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center; white-space: nowrap; pointer-events: none; z-index: 30;
    }
    #action-toast.show { transform: translate(-50%, -50%) scale(1.15); }
    #toast-sub { font-size: 16px; color: #fff; font-style: normal; text-shadow: 1px 1px 3px #000; }

    /* Game Over Modal */
    #gameover-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 30, 0.95); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 50; padding: 20px;
    }
    .modal-card {
      background: #1e293b; border: 3px solid #f59e0b; border-radius: 20px;
      padding: 30px 25px; text-align: center; max-width: 320px; width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-title { font-size: 28px; font-weight: 900; color: #ef4444; margin-bottom: 10px; }
    .modal-score { font-size: 44px; font-weight: 900; color: #38ef7d; margin: 10px 0; }
    .modal-stats { font-size: 14px; color: #94a3b8; margin-bottom: 25px; }
    .btn-restart {
      background: #3b82f6; border: none; padding: 14px 28px; border-radius: 30px;
      color: #fff; font-size: 18px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <!-- Broadcast Header -->
  <div id="broadcast-header">
    <div class="batter-tag">
      <div class="batter-avatar" id="avatarIcon">🦁</div>
      <div>
        <div class="batter-name" id="batterName">LION (C)</div>
        <div class="score-box" id="score">0 / 0</div>
      </div>
    </div>
    <div class="match-meta">
      <div class="overs-val" id="overs">0.0 / 3.0</div>
      <div class="wickets-limit">3 WICKETS MAX</div>
    </div>
  </div>

  <!-- Timing Bar Indicator -->
  <div id="timing-box">
    <div class="timing-label">TIMING METER</div>
    <div class="timing-track">
      <div class="zone-early"></div>
      <div class="zone-perfect"></div>
      <div class="zone-late"></div>
      <div class="timing-pointer" id="timingPointer"></div>
    </div>
  </div>

  <!-- Action Toast Display -->
  <div id="action-toast">
    <div id="toast-title">SIX!</div>
    <div id="toast-sub">PERFECT COVER DRIVE</div>
  </div>

  <!-- Hit Button -->
  <div id="hit-btn-container">
    <button id="hit-btn">🏏 HIT SHOT</button>
  </div>

  <!-- Match Over Screen -->
  <div id="gameover-modal">
    <div class="modal-card">
      <div class="modal-title" id="go-title">ALL OUT!</div>
      <div class="modal-score" id="go-score">36 / 3</div>
      <div class="modal-stats" id="go-stats">3 OVERS COMPLETED</div>
      <button class="btn-restart" id="btnRestart">PLAY AGAIN</button>
    </div>
  </div>

<script>
// --- TELEGRAM SDK & HAPTICS ---
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
}

function triggerHaptic(type) {
  if (tg?.HapticFeedback) {
    if (type === 'six') tg.HapticFeedback.impactOccurred('heavy');
    else if (type === 'four') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'out') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred('light');
  }
}

// --- SYNTHESIZED AUDIO (NO EXTERNAL ASSETS NEEDED) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playWillowBatCrack(sweetSpot = true) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = sweetSpot ? 'triangle' : 'square';
  osc.frequency.setValueAtTime(sweetSpot ? 560 : 250, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.14);
  gain.gain.setValueAtTime(1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

function playCrowdCheer() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const bufferSize = audioCtx.sampleRate * 1.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.setValueAtTime(880, audioCtx.currentTime);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start();
}

// --- THREE.JS STADIUM & GRAPHICS SETUP ---
const container = document.getElementById('game-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e3a8a);
scene.fog = new THREE.Fog(0x1e3a8a, 40, 110);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Warm Stadium Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff7ed, 1.1);
sunLight.position.set(15, 30, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
sunLight.shadow.camera.near = 5;
sunLight.shadow.camera.far = 70;
sunLight.shadow.camera.left = -25;
sunLight.shadow.camera.right = 25;
sunLight.shadow.camera.top = 25;
sunLight.shadow.camera.bottom = -25;
scene.add(sunLight);

// Stadium Grandstands
const stands = new THREE.Mesh(
  new THREE.CylinderGeometry(52, 54, 8, 36, 1, true),
  new THREE.MeshLambertMaterial({ color: 0x334155, side: THREE.BackSide })
);
stands.position.y = 4;
scene.add(stands);

// Outfield Turf (Lush Lawn Green)
const outfield = new THREE.Mesh(
  new THREE.CircleGeometry(50, 48),
  new THREE.MeshLambertMaterial({ color: 0x15803d })
);
outfield.rotation.x = -Math.PI / 2;
outfield.receiveShadow = true;
scene.add(outfield);

// Boundary Rope
const rope = new THREE.Mesh(
  new THREE.TorusGeometry(47, 0.35, 8, 48),
  new THREE.MeshLambertMaterial({ color: 0xffffff })
);
rope.rotation.x = Math.PI / 2;
rope.position.y = 0.1;
scene.add(rope);

// Cricket Pitch Strip
const pitch = new THREE.Mesh(
  new THREE.BoxGeometry(3.6, 0.05, 22),
  new THREE.MeshLambertMaterial({ color: 0xd4a373 }) // Warm clay turf
);
pitch.position.set(0, 0, 0);
pitch.receiveShadow = true;
scene.add(pitch);

// Pitch Creases
function createWhiteLine(z, w = 3.0) {
  const line = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, 0.12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  line.position.set(0, 0, z);
  scene.add(line);
}
createWhiteLine(8.5);  // Batting Crease
createWhiteLine(-8.5); // Bowling Crease

// Pitch Landing Target (Circle marker)
const pitchTarget = new THREE.Mesh(
  new THREE.RingGeometry(0.2, 0.38, 24),
  new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide })
);
pitchTarget.rotation.x = -Math.PI / 2;
pitchTarget.position.set(0, 0.04, 3.5);
scene.add(pitchTarget);

// 3D Stumps Builder
function createWicketSet(z) {
  const group = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xf59e0b });
  for (let i = -1; i <= 1; i++) {
    const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.85, 8), mat);
    stump.position.set(i * 0.15, 0.425, 0);
    stump.castShadow = true;
    group.add(stump);
  }
  const bail = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.36, 6), mat);
  bail.rotation.z = Math.PI / 2;
  bail.position.set(0, 0.86, 0);
  group.add(bail);
  group.position.set(0, 0, z);
  scene.add(group);
  return group;
}
const batterWickets = createWicketSet(9.4);
createWicketSet(-9.4);

// 3D Cricket Ball
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.12, 16, 16),
  new THREE.MeshLambertMaterial({ color: 0xdc2626 })
);
ball.castShadow = true;
scene.add(ball);

// --- HUMAN-PROPORTIONED ATHLETIC CARTOON CRICKETER ENGINE ---
function createCartoonEye() {
  const eye = new THREE.Group();
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), new THREE.MeshBasicMaterial({ color: 0x000000 }));
  pupil.position.z = 0.05;
  eye.add(sclera, pupil);
  return eye;
}

// Procedural Animal Heads on Human Bodies
function createAnimalHead(type) {
  const headGroup = new THREE.Group();

  if (type === 'lion') {
    // 1. Lion: Golden fur, brown mane, round ears, cute snout
    const mane = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.12, 8, 16), new THREE.MeshLambertMaterial({ color: 0xb45309 }));
    mane.position.set(0, 0, -0.05);
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 14), new THREE.MeshLambertMaterial({ color: 0xf59e0b }));
    const snout = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), new THREE.MeshLambertMaterial({ color: 0xfef08a }));
    snout.position.set(0, -0.05, 0.2);
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), new THREE.MeshBasicMaterial({ color: 0x1e293b }));
    nose.position.set(0, 0, 0.28);
    const ear1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), new THREE.MeshLambertMaterial({ color: 0xd97706 }));
    ear1.position.set(-0.2, 0.2, 0);
    const ear2 = ear1.clone(); ear2.position.x = 0.2;
    headGroup.add(mane, skull, snout, nose, ear1, ear2);

  } else if (type === 'elephant') {
    // 2. Elephant: Grey head, big floppy side ears, curved trunk in front
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.27, 14, 14), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
    // Big floppy ears
    const ear1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.03, 10), new THREE.MeshLambertMaterial({ color: 0x64748b }));
    ear1.rotation.y = Math.PI / 2;
    ear1.position.set(-0.28, 0.05, 0);
    const ear2 = ear1.clone(); ear2.position.x = 0.28;
    // Curved trunk
    const trunk1 = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.05, 0.25, 8), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
    trunk1.position.set(0, -0.15, 0.22);
    trunk1.rotation.x = -0.3;
    const trunk2 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.18, 8), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
    trunk2.position.set(0, -0.28, 0.3);
    trunk2.rotation.x = 0.5;
    headGroup.add(skull, ear1, ear2, trunk1, trunk2);

  } else if (type === 'cat') {
    // 3. Cat: Pointed triangle ears, cute snout, whiskers
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.25, 14, 14), new THREE.MeshLambertMaterial({ color: 0xf97316 }));
    const earGeo = new THREE.ConeGeometry(0.09, 0.18, 6);
    const earMat = new THREE.MeshLambertMaterial({ color: 0xc2410c });
    const ear1 = new THREE.Mesh(earGeo, earMat); ear1.position.set(-0.16, 0.24, 0);
    const ear2 = new THREE.Mesh(earGeo, earMat); ear2.position.set(0.16, 0.24, 0);
    const snout = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), new THREE.MeshLambertMaterial({ color: 0xffedd5 }));
    snout.position.set(0, -0.06, 0.19);
    headGroup.add(skull, ear1, ear2, snout);

  } else if (type === 'dog') {
    // Dog: Floppy brown ears, snout
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.25, 14, 14), new THREE.MeshLambertMaterial({ color: 0xd97706 }));
    const ear1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.24, 0.08), new THREE.MeshLambertMaterial({ color: 0x78350f }));
    ear1.position.set(-0.24, 0, 0); ear1.rotation.z = 0.3;
    const ear2 = ear1.clone(); ear2.position.x = 0.24; ear2.rotation.z = -0.3;
    const snout = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.18), new THREE.MeshLambertMaterial({ color: 0xffedd5 }));
    snout.position.set(0, -0.06, 0.2);
    headGroup.add(skull, ear1, ear2, snout);
  }

  // Cartoon Eyes
  const e1 = createCartoonEye(); e1.position.set(-0.09, 0.04, 0.22);
  const e2 = createCartoonEye(); e2.position.set(0.09, 0.04, 0.22);
  headGroup.add(e1, e2);

  // Cricket Cap
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x1d4ed8 }));
  cap.position.y = 0.04;
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.03, 0.2), new THREE.MeshLambertMaterial({ color: 0x1d4ed8 }));
  visor.position.set(0, 0.05, 0.24);
  visor.rotation.x = 0.15;
  headGroup.add(cap, visor);

  return headGroup;
}

// Full Human Athletic Body with Proper Limbs & Right-Hand Bat Grip
function buildHumanCricketer(animalType, jerseyColor = 0x2563eb) {
  const cricketer = new THREE.Group();

  // 1. Torso / Athletic Jersey
  const jerseyMat = new THREE.MeshLambertMaterial({ color: jerseyColor });
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.65, 0.28), jerseyMat);
  torso.position.y = 1.05;
  torso.castShadow = true;
  cricketer.add(torso);

  // 2. Head with Animal Face
  const head = createAnimalHead(animalType);
  head.position.y = 1.55;
  cricketer.add(head);

  // 3. Legs with Cricket Pads & Spikes
  const legMat = new THREE.MeshLambertMaterial({ color: 0xf8fafc });
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.7, 0.22), legMat);
  leftLeg.position.set(-0.15, 0.35, 0);
  leftLeg.castShadow = true;
  const rightLeg = leftLeg.clone();
  rightLeg.position.x = 0.15;
  cricketer.add(leftLeg, rightLeg);

  // 4. Arms & Right-Hand Bat Rig
  const batPivot = new THREE.Group();
  batPivot.position.set(0, 1.15, 0); // Shoulder level pivot

  // Left Arm (Top Hand on bat handle)
  const armMat = new THREE.MeshLambertMaterial({ color: jerseyColor });
  const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.45, 8), armMat);
  leftArm.position.set(-0.25, -0.2, 0.15);
  leftArm.rotation.set(0.6, 0, -0.4);

  // Right Arm (Bottom Power Hand)
  const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.45, 8), armMat);
  rightArm.position.set(0.2, -0.2, 0.15);
  rightArm.rotation.set(0.7, 0, 0.4);

  // Batting Gloves
  const gloveMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const glove = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), gloveMat);
  glove.position.set(0, -0.4, 0.2);

  // English Willow Cricket Bat
  const batBlade = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.85, 0.05), new THREE.MeshLambertMaterial({ color: 0xb45309 }));
  batBlade.position.set(0, -0.5, 0);
  batBlade.castShadow = true;

  const batHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.35, 8), new THREE.MeshLambertMaterial({ color: 0xffffff }));
  batHandle.position.set(0, 0.08, 0);

  const batMeshGroup = new THREE.Group();
  batMeshGroup.add(batBlade, batHandle);
  batMeshGroup.position.set(0, -0.35, 0.2);

  batPivot.add(leftArm, rightArm, glove, batMeshGroup);
  cricketer.add(batPivot);

  cricketer.batPivot = batPivot;
  cricketer.head = head;
  cricketer.leftLeg = leftLeg;
  cricketer.rightLeg = rightLeg;

  return cricketer;
}

// Batsmen Roster for Each Wicket
const batsmenRoster = [
  { name: 'LION (C)', type: 'lion', icon: '🦁' },
  { name: 'ELEPHANT', type: 'elephant', icon: '🐘' },
  { name: 'CAT POWER', type: 'cat', icon: '🐱' }
];

let currentBatterIndex = 0;
let batsman = buildHumanCricketer(batsmenRoster[0].type);
// Authentic Right-Hand Stance: Left shoulder pointing down the pitch towards bowler (-Z)
batsman.position.set(0.35, 0, 8.6);
batsman.rotation.y = -Math.PI / 2; // Side-on stance
batsman.head.rotation.y = Math.PI / 2; // Head turned to face the bowler
scene.add(batsman);

// Bowler (Fast Cheetah)
const bowler = buildHumanCricketer('dog', 0x16a34a);
bowler.position.set(0, 0, -18);
scene.add(bowler);

// Cartoon Fielders (Positioned in Full Camera View)
const fielders = [
  { char: buildHumanCricketer('dog', 0x16a34a), basePos: new THREE.Vector3(-9, 0, 2), name: 'Cover' },
  { char: buildHumanCricketer('cat', 0x16a34a), basePos: new THREE.Vector3(-14, 0, 6), name: 'Point' },
  { char: buildHumanCricketer('dog', 0x16a34a), basePos: new THREE.Vector3(-6, 0, -8), name: 'Mid-Off' },
  { char: buildHumanCricketer('cat', 0x16a34a), basePos: new THREE.Vector3(6, 0, -8), name: 'Mid-On' },
  { char: buildHumanCricketer('dog', 0x16a34a), basePos: new THREE.Vector3(12, 0, 4), name: 'Square Leg' }
];

fielders.forEach(f => {
  f.char.position.copy(f.basePos);
  f.char.lookAt(0.35, 0, 8.6);
  scene.add(f.char);
});

// --- MATCH RULES & GAME LOGIC ---
const TOTAL_BALLS = 18; // 3 OVERS (3 x 6)
let ballsBowled = 0;
let runs = 0;
let wickets = 0;
const MAX_WICKETS = 3;

let gameState = 'RUN_UP'; // RUN_UP, BOWLED, IN_AIR, FIELDING, BALL_DEAD, MATCH_OVER
let ballVelocity = new THREE.Vector3();
let swingProgress = 0;
let isSwinging = false;
let activeChasingFielder = null;

// Camera Position: Right Behind Batsman's Eye Level
const defaultCamPos = new THREE.Vector3(0.5, 2.7, 13.5);
const defaultCamLook = new THREE.Vector3(0, 1.2, 0);
camera.position.copy(defaultCamPos);
camera.lookAt(defaultCamLook);

function updateScoreboard() {
  document.getElementById('score').innerText = `${runs} / ${wickets}`;
  const ov = Math.floor(ballsBowled / 6);
  const b = ballsBowled % 6;
  document.getElementById('overs').innerText = `${ov}.${b} / 3.0`;
}

function showToast(title, sub, color = '#ffeb3b') {
  const toast = document.getElementById('action-toast');
  document.getElementById('toast-title').innerText = title;
  document.getElementById('toast-title').style.color = color;
  document.getElementById('toast-sub').innerText = sub;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
}

// Switch to New Batsman when Wicket Falls
function changeToNewBatsman() {
  currentBatterIndex++;
  if (currentBatterIndex >= batsmenRoster.length) return;

  const newBatter = batsmenRoster[currentBatterIndex];
  document.getElementById('batterName').innerText = newBatter.name;
  document.getElementById('avatarIcon').innerText = newBatter.icon;

  // Swap 3D Model with dramatic entrance
  scene.remove(batsman);
  batsman = buildHumanCricketer(newBatter.type);
  batsman.position.set(0.35, 0, 8.6);
  batsman.rotation.y = -Math.PI / 2;
  batsman.head.rotation.y = Math.PI / 2;
  scene.add(batsman);

  showToast(`NEW BATSMAN: ${newBatter.name}`, "ENTERS THE CREASE", "#38ef7d");
}

function checkMatchOver() {
  if (wickets >= MAX_WICKETS || ballsBowled >= TOTAL_BALLS) {
    gameState = 'MATCH_OVER';
    const modal = document.getElementById('gameover-modal');
    document.getElementById('go-title').innerText = wickets >= MAX_WICKETS ? "ALL OUT!" : "INNINGS COMPLETED!";
    document.getElementById('go-score').innerText = `${runs} / ${wickets}`;
    document.getElementById('go-stats').innerText = `TOTAL RUNS: ${runs} | BALLS FACED: ${ballsBowled}/${TOTAL_BALLS}`;
    modal.style.display = 'flex';
    triggerHaptic('out');
    return true;
  }
  return false;
}

document.getElementById('btnRestart').addEventListener('click', () => {
  runs = 0; wickets = 0; ballsBowled = 0; currentBatterIndex = 0;
  document.getElementById('gameover-modal').style.display = 'none';
  document.getElementById('batterName').innerText = batsmenRoster[0].name;
  document.getElementById('avatarIcon').innerText = batsmenRoster[0].icon;

  scene.remove(batsman);
  batsman = buildHumanCricketer(batsmenRoster[0].type);
  batsman.position.set(0.35, 0, 8.6);
  batsman.rotation.y = -Math.PI / 2;
  batsman.head.rotation.y = Math.PI / 2;
  scene.add(batsman);

  updateScoreboard();
  startNextDelivery();
});

// Delivery Cycle Routine
function startNextDelivery() {
  if (checkMatchOver()) return;

  gameState = 'RUN_UP';
  bowler.position.set(0, 0, -18);
  ball.position.set(0, 1.4, -18);
  ballVelocity.set(0, 0, 0);

  // Fielders return to stations
  fielders.forEach(f => {
    f.char.position.copy(f.basePos);
    f.char.lookAt(0.35, 0, 8.6);
  });
  activeChasingFielder = null;

  // Reset Camera
  camera.position.copy(defaultCamPos);
  camera.lookAt(defaultCamLook);

  // Right-hand backlift stance
  batsman.batPivot.rotation.set(0.35, 0, 0.4);
  isSwinging = false;
  swingProgress = 0;

  // Reset Timing Pointer
  document.getElementById('timingPointer').style.left = '0%';
}

function releaseDelivery() {
  gameState = 'BOWLED';
  // Ball delivery parameters: comfortable, realistic flight speed
  const targetX = 0.25 + (Math.random() - 0.5) * 0.5; // Stumps to off-stump line
  const flightFrames = 48; // Smooth reaction speed

  ball.position.set(0.2, 1.8, -8.5);
  ballVelocity.x = (targetX - ball.position.x) / flightFrames;
  ballVelocity.z = (8.6 - ball.position.z) / flightFrames;
  ballVelocity.y = -0.024;
}

// --- EASY-TO-PLAY TIMING SHOT EXECUTION ---
function hitShot() {
  if (gameState !== 'BOWLED' || isSwinging) return;
  isSwinging = true;
  swingProgress = 0;

  const ballDist = ball.position.z;
  const timingDelta = Math.abs(ballDist - 8.6); // 8.6 is sweet spot

  if (timingDelta <= 0.45) {
    // 1. PERFECT TIMING -> MASSIVE SIX!
    playWillowBatCrack(true);
    playCrowdCheer();
    triggerHaptic('six');
    runs += 6;
    ballsBowled++;
    showToast("SIX!", "PERFECT TIMING! MASSIVE SHOT! 🚀", "#ffeb3b");

    gameState = 'IN_AIR';
    ballVelocity.set((Math.random() - 0.5) * 0.85, 0.65, -(0.85 + Math.random() * 0.35));
    endBallAfterDelay(3000);

  } else if (timingDelta <= 0.95) {
    // 2. GOOD TIMING -> CRACKING 4 RUNS!
    playWillowBatCrack(true);
    triggerHaptic('four');
    runs += 4;
    ballsBowled++;
    showToast("FOUR!", "SWEET COVER DRIVE! 🏏", "#38ef7d");

    gameState = 'IN_AIR';
    const side = Math.random() > 0.5 ? 1 : -1;
    ballVelocity.set(side * 0.75, 0.2, -(0.7 + Math.random() * 0.2));
    endBallAfterDelay(2600);

  } else if (timingDelta <= 1.6) {
    // 3. EARLY OR LATE -> SKIED TOWARDS FIELDERS!
    playWillowBatCrack(false);
    triggerHaptic('medium');

    const sliceDir = (Math.random() - 0.5) * 1.3;
    ballVelocity.set(sliceDir, 0.45, -(0.35 + Math.random() * 0.3));
    gameState = 'FIELDING';

    // Nearest fielder sprints to catch or stop
    activeChasingFielder = fielders.reduce((prev, curr) => {
      return curr.char.position.distanceTo(ball.position) < prev.char.position.distanceTo(ball.position) ? curr : prev;
    }, fielders[0]);

    setTimeout(() => {
      if (gameState === 'FIELDING') {
        const dist = activeChasingFielder.char.position.distanceTo(ball.position);
        if (dist < 4.8) {
          // CAUGHT OUT!
          wickets++;
          ballsBowled++;
          triggerHaptic('out');
          showToast("CAUGHT OUT!", `CATCH TAKEN BY ${activeChasingFielder.name.toUpperCase()}!`, "#ef4444");
          updateScoreboard();
          setTimeout(() => {
            changeToNewBatsman();
            endBallAfterDelay(1500);
          }, 800);
        } else {
          // 1 or 2 RUNS SAVED
          const scored = Math.random() > 0.5 ? 2 : 1;
          runs += scored;
          ballsBowled++;
          showToast(`${scored} RUNS`, "GOOD RUNNING BETWEEN WICKETS", "#38ef7d");
          updateScoreboard();
          endBallAfterDelay(1400);
        }
      }
    }, 1300);

  } else {
    // 4. TOO EARLY / TOO LATE
    showToast("MISSED!", "MISTIMED SHOT", "#94a3b8");
  }
  updateScoreboard();
}

function endBallAfterDelay(ms) {
  setTimeout(() => {
    gameState = 'BALL_DEAD';
    updateScoreboard();
    setTimeout(startNextDelivery, 1200);
  }, ms);
}

// Responsive Touch & Click Hit Handlers
document.getElementById('hit-btn').addEventListener('touchstart', (e) => {
  e.preventDefault();
  hitShot();
});
document.getElementById('hit-btn').addEventListener('mousedown', hitShot);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') hitShot();
});

// --- 60 FPS ANIMATION ENGINE ---
function animate() {
  requestAnimationFrame(animate);

  // 1. Bowler Run-up Animation
  if (gameState === 'RUN_UP') {
    bowler.position.z += 0.24;
    bowler.leftLeg.rotation.x = Math.sin(bowler.position.z * 3) * 0.6;
    bowler.rightLeg.rotation.x = -Math.sin(bowler.position.z * 3) * 0.6;
    if (bowler.position.z >= -8.5) {
      releaseDelivery();
    }
  }

  // 2. Ball Flying & Pitch Bounce
  if (gameState === 'BOWLED') {
    ball.position.add(ballVelocity);
    if (ball.position.y <= 0.14) {
      ball.position.y = 0.14;
      ballVelocity.y = 0.082; // Realistic upward turf bounce
    }

    // Dynamic Timing Meter Pointer Update
    const progress = Math.min(100, Math.max(0, ((ball.position.z + 8.5) / 17.1) * 100));
    document.getElementById('timingPointer').style.left = `${progress}%`;

    // Clean Bowled or Dot Ball
    if (ball.position.z > 9.6) {
      if (Math.abs(ball.position.x - 0.35) < 0.45 && ball.position.y < 0.9) {
        // HIT WICKETS!
        wickets++;
        ballsBowled++;
        triggerHaptic('out');
        showToast("CLEAN BOWLED!", "MIDDLE STUMP SHATTERED! 💥", "#ef4444");
        batterWickets.children[1].rotation.x = -1.2;
        batterWickets.children[3].position.y = 1.3;
        updateScoreboard();
        setTimeout(() => {
          changeToNewBatsman();
          endBallAfterDelay(1500);
        }, 800);
      } else {
        // Dot Ball
        ballsBowled++;
        showToast("DOT BALL", "BEATEN BY PACE", "#94a3b8");
        updateScoreboard();
        endBallAfterDelay(1200);
      }
      gameState = 'BALL_DEAD';
    }
  }

  // 3. Batsman Realistic Right-Hand Downswing Arc
  if (isSwinging) {
    swingProgress += 0.15;
    batsman.batPivot.rotation.x = 0.35 - swingProgress * 2.3;
    batsman.batPivot.rotation.y = swingProgress * 0.8; // Torso rotation
    if (swingProgress >= 1.0) isSwinging = false;
  }

  // 4. Ball in Air & Fielders Actively Chasing
  if (gameState === 'IN_AIR' || gameState === 'FIELDING') {
    ball.position.add(ballVelocity);
    ballVelocity.y -= 0.016; // Gravity

    // Turf bounce
    if (ball.position.y <= 0.12) {
      ball.position.y = 0.12;
      ballVelocity.y = -ballVelocity.y * 0.45;
      ballVelocity.multiplyScalar(0.96);
    }

    // Camera smoothly follows the ball trajectory
    camera.position.lerp(new THREE.Vector3(ball.position.x * 0.3 + 0.5, 4.5, ball.position.z + 10.5), 0.06);
    camera.lookAt(ball.position);

    // Active fielder sprints towards ball's landing location
    if (activeChasingFielder) {
      const fChar = activeChasingFielder.char;
      fChar.lookAt(ball.position.x, 0, ball.position.z);
      fChar.position.lerp(new THREE.Vector3(ball.position.x, 0, ball.position.z), 0.048);
      // Fielder running leg animation
      fChar.leftLeg.rotation.x = Math.sin(performance.now() * 0.015) * 0.6;
      fChar.rightLeg.rotation.x = -Math.sin(performance.now() * 0.015) * 0.6;
    }
  }

  renderer.render(scene, camera);
}

// Window Resize Handling
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start Match
updateScoreboard();
startNextDelivery();
animate();
</script>
</body>
  </html>
