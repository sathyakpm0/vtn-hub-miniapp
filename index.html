<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cyber Climb - Overdrive Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #05060d;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #150a2b 0%, #05060f 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD overlay */
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: env(safe-area-inset-top, 16px) 16px 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .hud-card {
      background: rgba(14, 18, 38, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 247, 255, 0.25);
      padding: 8px 14px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 247, 255, 0.15);
    }

    #score-wrapper {
      display: flex;
      flex-direction: column;
    }

    #score {
      font-family: 'Orbitron', monospace;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 1px;
      text-shadow: 0 0 12px #00f7ff, 0 0 24px rgba(0, 247, 255, 0.6);
      line-height: 1;
    }

    #combo-badge {
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      font-weight: 800;
      color: #ff007b;
      letter-spacing: 1px;
      text-shadow: 0 0 10px #ff007b;
      margin-top: 4px;
      display: none;
      animation: pulseCombo 0.4s infinite alternate ease-in-out;
    }

    @keyframes pulseCombo {
      from { transform: scale(1); filter: brightness(1); }
      to { transform: scale(1.08); filter: brightness(1.3); }
    }

    #level-badge {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 800;
      color: #ffe600;
      text-shadow: 0 0 10px #ffe600;
      letter-spacing: 1.5px;
      text-align: right;
    }

    #level-timer {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      font-weight: 800;
      color: #00f7ff;
      text-shadow: 0 0 10px #00f7ff;
      margin-top: 2px;
      text-align: right;
    }

    /* Altitude Progress Bar */
    #progress-wrapper {
      width: 100%;
      background: rgba(10, 15, 30, 0.65);
      border: 1px solid rgba(0, 247, 255, 0.3);
      border-radius: 20px;
      padding: 3px 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }

    #progress-bar-track {
      flex: 1;
      height: 7px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    #progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f7ff, #39ff14);
      box-shadow: 0 0 10px #39ff14;
      transition: width 0.15s ease-out;
    }

    #altitude-text {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 800;
      color: #39ff14;
      white-space: nowrap;
      text-shadow: 0 0 8px #39ff14;
    }

    /* High Tech Glassmorphic Modals */
    .screen-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(16, 12, 40, 0.88), rgba(3, 4, 10, 0.98));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    h1, h2 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 36px;
      background: linear-gradient(135deg, #00f7ff 0%, #ff007b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 0, 123, 0.6));
    }

    .sub-glow {
      color: #94a3b8;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 26px;
      line-height: 1.5;
    }

    .cyber-btn {
      position: relative;
      background: linear-gradient(135deg, #00f7ff, #0077ff);
      color: #02071a;
      border: none;
      padding: 16px 48px;
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 40px;
      box-shadow: 0 0 20px rgba(0, 247, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.8);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.1s ease, filter 0.2s;
    }

    .cyber-btn:active {
      transform: scale(0.94);
      filter: brightness(1.2);
    }

    /* Dynamic Level Up Toast */
    #level-banner {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      background: rgba(10, 15, 30, 0.95);
      border: 2px solid #39ff14;
      box-shadow: 0 0 35px #39ff14, inset 0 0 15px rgba(57, 255, 20, 0.3);
      padding: 18px 36px;
      border-radius: 18px;
      text-align: center;
      z-index: 25;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.35s ease;
    }

    #level-banner.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    #banner-text {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 900;
      color: #39ff14;
      text-shadow: 0 0 15px #39ff14;
    }

    #final-score {
      font-family: 'Orbitron', monospace;
      font-size: 52px;
      font-weight: 900;
      color: #ff007b;
      text-shadow: 0 0 25px rgba(255, 0, 123, 0.8);
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <!-- UI Overlay -->
    <div id="ui">
      <div class="hud-top-row">
        <div class="hud-card" id="score-wrapper">
          <div id="score">0</div>
          <div id="combo-badge">COMBO x2</div>
        </div>
        <div class="hud-card">
          <div id="level-badge">LVL 1</div>
          <div id="level-timer">28.0s</div>
        </div>
      </div>

      <!-- Ascent Progress Bar -->
      <div id="progress-wrapper">
        <div id="progress-bar-track">
          <div id="progress-bar-fill"></div>
        </div>
        <div id="altitude-text">0m / 80m</div>
      </div>
    </div>

    <!-- Level Cleared Banner -->
    <div id="level-banner">
      <div id="banner-text">LEVEL 2 REACHED</div>
      <div style="font-size: 14px; color: #a3e635; margin-top: 4px; font-weight: 700;">+SPEED & COMPRESSION</div>
    </div>

    <!-- Start Overlay -->
    <div id="start-screen" class="screen-overlay">
      <h1>Cyber Climb</h1>
      <p class="sub-glow">Tap Left & Right to steer your thrust.<br>Climb to the summit before core collapse!</p>
      <button id="start-btn" class="cyber-btn">IGNITION</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over" class="screen-overlay" style="display: none;">
      <h2 id="game-over-title" style="color: #ff3366; text-shadow: 0 0 20px #ff3366;">SYSTEM FAILURE</h2>
      <div id="final-score">0</div>
      <p id="best-score-text" style="font-size: 16px; margin-bottom: 24px; color: #94a3b8; font-weight: 700;">TOP RECORD: 0</p>
      <button id="restart-btn" class="cyber-btn">REBOOT</button>
    </div>
  </div>

  <script>
    /* ========================================================
       TELEGRAM HAPTICS & SETUP
       ======================================================== */
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#05060d');
      tg.setBackgroundColor('#05060d');
    }

    function triggerHaptic(type = 'impact', style = 'medium') {
      if (!tg?.HapticFeedback) return;
      if (type === 'impact') tg.HapticFeedback.impactOccurred(style);
      if (type === 'notification') tg.HapticFeedback.notificationOccurred(style);
    }

    /* ========================================================
       SYNTHESIZED AUDIO
       ======================================================== */
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playJump(boost = 1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140 * boost, now);
        osc.frequency.exponentialRampToValueAtTime(440 * boost, now + 0.14);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      },
      playLevelUp() {
        if (!this.ctx) return;
        const notes = [440, 554, 659, 880];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime + i * 0.08;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        });
      },
      playGameOver() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.45);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    };

    /* ========================================================
       CORE INITIALIZATION & HI-DPI CANVAS
       ======================================================== */
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const comboBadge = document.getElementById('combo-badge');
    const levelBadge = document.getElementById('level-badge');
    const levelTimerEl = document.getElementById('level-timer');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const altitudeText = document.getElementById('altitude-text');
    const gameOverEl = document.getElementById('game-over');
    const gameOverTitle = document.getElementById('game-over-title');
    const levelBanner = document.getElementById('level-banner');
    const bannerText = document.getElementById('banner-text');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width = 0;
    let height = 0;
    let dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    /* ========================================================
       PARTICLES & VISUAL JUICE
       ======================================================== */
    let particles = [];
    let floatingTexts = [];
    let screenShake = 0;

    function createExplosion(x, y, color, count = 18, speedMult = 1) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 4.5 + 1.5) * speedMult;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3.5 + 1.5,
          color,
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }
    }

    function spawnFloatText(x, y, text, color = '#00f7ff') {
      floatingTexts.push({
        x, y, text, color, alpha: 1, vy: -2
      });
    }

    /* ========================================================
       GAME STATE & LEVEL CONFIG
       ======================================================== */
    let score = 0;
    let combo = 0;
    let lastBounceTime = 0;
    let bestScore = parseInt(localStorage.getItem('cyberClimb_best') || '0');
    let level = 1;
    let timeLeft = 28;
    let targetHeightMeters = 80;
    let currentHeightMeters = 0;
    let maxClimbedMeters = 0;
    let gameState = 'start';
    let cameraY = 0;
    const PIXELS_PER_METER = 22;

    const player = {
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      radius: 15,
      scaleX: 1,
      scaleY: 1
    };

    let platforms = [];
    let stars = [];

    // Background Stars
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.35 + 0.1,
        color: Math.random() > 0.4 ? '#00f7ff' : '#ff007b'
      });
    }

    function initGame() {
      AudioEngine.init();
      score = 0;
      combo = 0;
      level = 1;
      scoreEl.textContent = '0';
      comboBadge.style.display = 'none';
      setupLevel();
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      levelBanner.classList.remove('show');
    }

    function setupLevel() {
      currentHeightMeters = 0;
      maxClimbedMeters = 0;

      // Realistic balanced climb height per level (takes ~20-30s of intense jumping)
      targetHeightMeters = 80 + ((level - 1) * 30);
      timeLeft = 26 + Math.min(12, level * 2);

      levelBadge.textContent = `LVL ${level}`;
      levelTimerEl.textContent = `${timeLeft.toFixed(1)}s`;
      altitudeText.textContent = `0m / ${targetHeightMeters}m`;
      progressBarFill.style.width = '0%';
      cameraY = 0;

      player.x = width / 2;
      player.y = height - 180;
      player.vx = 0;
      player.vy = -13.5;
      player.scaleX = 1;
      player.scaleY = 1;

      generatePlatforms();
    }

    function generatePlatforms() {
      platforms = [];
      // Ground launch platform
      platforms.push({
        x: width / 2 - 70,
        y: height - 120,
        width: 140,
        height: 14,
        type: 'start',
        color: '#00f7ff',
        moving: false,
        dir: 1,
        speed: 0
      });

      let currentY = height - 200;
      // Generate past the summit goal line
      const topBound = height - 120 - (targetHeightMeters * PIXELS_PER_METER) - 600;

      while (currentY > topBound) {
        const pWidth = Math.max(50, 120 - (level * 7) - Math.random() * 15);
        const pX = Math.random() * (width - pWidth);
        const isMoving = level >= 2 && Math.random() < Math.min(0.65, 0.15 + level * 0.1);
        const isBoost = Math.random() < 0.13;

        let color = '#00f7ff';
        if (isMoving) color = '#ffe600';
        if (isBoost) color = '#ff007b';

        platforms.push({
          x: pX,
          y: currentY,
          width: pWidth,
          height: 14,
          type: isBoost ? 'boost' : (isMoving ? 'moving' : 'normal'),
          color: color,
          moving: isMoving,
          dir: Math.random() > 0.5 ? 1 : -1,
          speed: (1.5 + level * 0.35)
        });

        // Platform gap spacing
        currentY -= (72 + Math.random() * 24);
      }
    }

    /* ========================================================
       INPUT / STEERING
       ======================================================== */
    let touchDir = 0;
    window.addEventListener('pointerdown', (e) => {
      if (gameState !== 'playing') return;
      touchDir = e.clientX < width / 2 ? -1 : 1;
      triggerHaptic('impact', 'light');
    });

    window.addEventListener('pointerup', () => {
      touchDir = 0;
    });

    /* ========================================================
       MAIN LOOP & UPDATES
       ======================================================== */
    let lastTime = performance.now();

    function update(dt) {
      if (gameState !== 'playing') return;

      // Countdown Timer
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        gameOver("TIME COLLAPSE");
        return;
      }
      levelTimerEl.textContent = `${timeLeft.toFixed(1)}s`;
      if (timeLeft <= 5) {
        levelTimerEl.style.color = '#ff0055';
        levelTimerEl.style.textShadow = '0 0 15px #ff0055';
      } else {
        levelTimerEl.style.color = '#00f7ff';
        levelTimerEl.style.textShadow = '0 0 10px #00f7ff';
      }

      // Lateral player physics
      if (touchDir !== 0) {
        player.vx += touchDir * 28 * dt;
        player.vx = Math.max(-9, Math.min(9, player.vx));
      } else {
        player.vx *= 0.88;
      }

      // Gravity & squash/stretch restore
      player.vy += 26 * dt;
      player.x += player.vx;
      player.y += player.vy;

      player.scaleX += (1 - player.scaleX) * 0.12;
      player.scaleY += (1 - player.scaleY) * 0.12;

      // Screen edge wrapping
      if (player.x < -10) player.x = width + 10;
      if (player.x > width + 10) player.x = -10;

      // Move dynamic platforms
      for (let p of platforms) {
        if (p.moving) {
          p.x += p.dir * p.speed;
          if (p.x <= 0) { p.x = 0; p.dir = 1; }
          if (p.x + p.width >= width) { p.x = width - p.width; p.dir = -1; }
        }
      }

      // Collision Check (only when falling)
      if (player.vy > 0) {
        for (let p of platforms) {
          if (
            player.x + player.radius * 0.7 > p.x &&
            player.x - player.radius * 0.7 < p.x + p.width &&
            player.y + player.radius >= p.y &&
            player.y + player.radius <= p.y + p.height + 12
          ) {
            // Overdrive combo timing
            const now = performance.now();
            if (now - lastBounceTime < 950) {
              combo = Math.min(combo + 1, 8);
              comboBadge.style.display = 'block';
              comboBadge.textContent = `OVERDRIVE x${combo + 1}`;
              // Small time bonus for high momentum combos
              if (combo >= 3) {
                timeLeft = Math.min(timeLeft + 0.8, 35);
              }
            } else {
              combo = 0;
              comboBadge.style.display = 'none';
            }
            lastBounceTime = now;

            const isBoost = p.type === 'boost';
            player.vy = isBoost ? -19.5 : -14.2;

            if (isBoost) {
              timeLeft = Math.min(timeLeft + 2.0, 35); // Boost platform awards extra time
              spawnFloatText(player.x, p.y - 30, "+2.0s TIME!", "#39ff14");
            }

            // Squash & stretch physics
            player.scaleX = 1.45;
            player.scaleY = 0.55;

            // Visual juice
            screenShake = isBoost ? 9 : 4.5;
            triggerHaptic('impact', isBoost ? 'heavy' : 'medium');
            AudioEngine.playJump(isBoost ? 1.4 : 1.0 + (combo * 0.08));

            createExplosion(player.x, p.y, p.color, isBoost ? 24 : 12, isBoost ? 1.8 : 1);
            spawnFloatText(player.x, p.y - 10, isBoost ? "HYPERBOOST!" : (combo > 1 ? `+${(combo+1)*12}` : "+10"), p.color);
            break;
          }
        }
      }

      // Smooth Camera tracking
      const targetCamY = player.y - height * 0.45;
      if (targetCamY < cameraY) {
        cameraY += (targetCamY - cameraY) * 0.16;
      }

      // Height Calculation & Progress Bar update
      currentHeightMeters = Math.max(0, Math.floor((height - 120 - player.y) / PIXELS_PER_METER));
      maxClimbedMeters = Math.max(maxClimbedMeters, currentHeightMeters);

      const progressPct = Math.min(100, Math.floor((maxClimbedMeters / targetHeightMeters) * 100));
      progressBarFill.style.width = `${progressPct}%`;
      altitudeText.textContent = `${maxClimbedMeters}m / ${targetHeightMeters}m`;

      score = Math.max(score, (level - 1) * 800 + maxClimbedMeters * 15 + combo * 30);
      scoreEl.textContent = score;

      // Victory Condition: Reached the Summit!
      if (maxClimbedMeters >= targetHeightMeters) {
        triggerLevelUp();
      }

      // Game Over: Fall below screen
      if (player.y > cameraY + height + 60) {
        gameOver("SIGNAL LOST");
      }
    }

    function triggerLevelUp() {
      gameState = 'leveling';
      level++;
      AudioEngine.playLevelUp();
      triggerHaptic('notification', 'success');
      bannerText.textContent = `LEVEL ${level} REACHED`;
      levelBanner.classList.add('show');
      createExplosion(width / 2, height / 2 + cameraY, '#39ff14', 45, 2.8);

      setTimeout(() => {
        levelBanner.classList.remove('show');
        setupLevel();
        gameState = 'playing';
      }, 1400);
    }

    /* ========================================================
       RENDERING PIPELINE
       ======================================================== */
    function draw() {
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      let shakeX = (Math.random() - 0.5) * screenShake;
      let shakeY = (Math.random() - 0.5) * screenShake;
      screenShake *= 0.9;
      ctx.translate(shakeX, -cameraY + shakeY);

      // Background Stars (Parallax)
      for (let s of stars) {
        let drawY = (s.y + cameraY * (1 - s.speed)) % height;
        if (drawY < 0) drawY += height;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, drawY + cameraY, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Summit Goal Line
      const summitY = height - 120 - (targetHeightMeters * PIXELS_PER_METER);
      if (summitY < cameraY + height + 100 && summitY > cameraY - 100) {
        ctx.save();
        ctx.strokeStyle = '#39ff14';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 18;
        ctx.lineWidth = 3;
        ctx.setLineDash([12, 8]);
        ctx.beginPath();
        ctx.moveTo(0, summitY);
        ctx.lineTo(width, summitY);
        ctx.stroke();

        ctx.fillStyle = '#39ff14';
        ctx.font = "bold 13px 'Orbitron', monospace";
        ctx.fillText("▲ SUMMIT EXTRACTION POINT ▲", width / 2 - 110, summitY - 12);
        ctx.restore();
      }

      // Platforms with Neon Glow
      for (let p of platforms) {
        if (p.y > cameraY + height + 50 || p.y < cameraY - 50) continue;

        ctx.save();
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;

        ctx.fillStyle = '#0a1024';
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.width, p.height, 7);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.roundRect(p.x + 2, p.y + 1, p.width - 4, 3, 2);
        ctx.fill();

        ctx.restore();
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= pt.decay;

        if (pt.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.fillStyle = pt.color;
        ctx.shadowColor = pt.color;
        ctx.shadowBlur = 8;
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        ctx.restore();
      }

      // Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.025;
        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.font = "bold 13px 'Orbitron', monospace";
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 8;
        ctx.fillText(ft.text, ft.x - 20, ft.y);
        ctx.restore();
      }

      // Cyber Orb Player
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.scale(player.scaleX, player.scaleY);

      const glowColor = combo > 2 ? '#ff007b' : '#00f7ff';
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 20;

      const grad = ctx.createRadialGradient(-3, -3, 2, 0, 0, player.radius);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, glowColor);
      grad.addColorStop(1, '#061033');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, 0, player.radius - 2, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
      ctx.restore();
    }

    /* ========================================================
       ENGINE LOOP
       ======================================================== */
    function engineLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      update(dt);
      draw();
      requestAnimationFrame(engineLoop);
    }

    function gameOver(reason) {
      gameState = 'gameover';
      AudioEngine.playGameOver();
      triggerHaptic('notification', 'error');

      gameOverTitle.textContent = reason;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('cyberClimb_best', bestScore);
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `TOP RECORD: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);

    requestAnimationFrame(engineLoop);
  </script>
</body>
  </html>
