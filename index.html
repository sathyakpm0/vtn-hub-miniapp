<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fruit Slice</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #0f172a 0%, #1e293b 100%);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 36px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #combo {
      font-size: 22px;
      font-weight: 700;
      color: #4ade80;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #timer {
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 18px;
      opacity: 0.85;
      z-index: 10;
      pointer-events: none;
    }

    #game-over, #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #start-screen {
      display: flex;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="combo">Combo x2</div>
    </div>

    <div id="timer">Time: 40</div>

    <div id="start-screen">
      <h1>Fruit Slice</h1>
      <p>Swipe to slice the fruits<br>Avoid the bombs!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="game-over">
      <h2>Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const comboEl = document.getElementById('combo');
    const timerEl = document.getElementById('timer');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('fruitSliceBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let fruits = [];
    let particles = [];
    let slashPoints = [];
    let gameState = 'start';
    let timeLeft = 40;
    let combo = 0;
    let lastSliceTime = 0;
    let spawnTimer = 0;
    let gameTime = 0;

    const FRUIT_TYPES = [
      { name: 'apple', points: 1 },
      { name: 'orange', points: 1 },
      { name: 'watermelon', points: 2 },
      { name: 'banana', points: 1 },
      { name: 'grape', points: 1 },
      { name: 'bomb', points: 0, isBomb: true }
    ];

    // ========== MUCH BIGGER + Attractive Fruits ==========
    function drawFruit(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rotation);

      if (f.isBomb) {
        // Bomb - bigger
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Shine
        ctx.beginPath();
        ctx.arc(-9, -9, 9, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.13)';
        ctx.fill();

        // Fuse
        ctx.beginPath();
        ctx.moveTo(0, -32);
        ctx.quadraticCurveTo(12, -48, 8, -58);
        ctx.strokeStyle = '#f87171';
        ctx.lineWidth = 5;
        ctx.stroke();

        // Spark
        ctx.beginPath();
        ctx.arc(8, -58, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#fbbf24';
        ctx.fill();
      }
      else if (f.name === 'apple') {
        // Apple - bigger
        ctx.beginPath();
        ctx.arc(0, 4, 30, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();

        // Darker side
        ctx.beginPath();
        ctx.arc(8, 6, 23, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.13)';
        ctx.fill();

        // Highlight
        ctx.beginPath();
        ctx.arc(-10, -6, 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fill();

        // Stem
        ctx.beginPath();
        ctx.moveTo(0, -26);
        ctx.lineTo(0, -38);
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 4.5;
        ctx.stroke();

        // Leaf
        ctx.beginPath();
        ctx.ellipse(12, -34, 13, 7, 0.55, 0, Math.PI * 2);
        ctx.fillStyle = '#22c55e';
        ctx.fill();
      }
      else if (f.name === 'orange') {
        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, Math.PI * 2);
        ctx.fillStyle = '#f97316';
        ctx.fill();

        // Texture dots
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        for (let i = 0; i < 9; i++) {
          const a = i * 0.7;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 13, Math.sin(a) * 13, 2.8, 0, Math.PI * 2);
          ctx.fill();
        }

        // Highlight
        ctx.beginPath();
        ctx.arc(-10, -10, 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fill();
      }
      else if (f.name === 'watermelon') {
        // Outer green
        ctx.beginPath();
        ctx.arc(0, 0, 34, 0, Math.PI * 2);
        ctx.fillStyle = '#16a34a';
        ctx.fill();

        // Dark stripes
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 5;
        for (let i = -3; i <= 3; i++) {
          ctx.beginPath();
          ctx.moveTo(i * 10, -33);
          ctx.lineTo(i * 10, 33);
          ctx.stroke();
        }

        // Red inside
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();

        // Seeds
        ctx.fillStyle = '#1e293b';
        [[-9, 3], [9, -4], [0, 12], [-6, -10], [7, 8]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.ellipse(sx, sy, 3.2, 5.5, 0.3, 0, Math.PI * 2);
          ctx.fill();
        });
      }
      else if (f.name === 'banana') {
        // Banana - bigger
        ctx.beginPath();
        ctx.moveTo(-28, 8);
        ctx.quadraticCurveTo(-16, -26, 8, -22);
        ctx.quadraticCurveTo(28, -16, 26, 10);
        ctx.quadraticCurveTo(10, 18, -28, 8);
        ctx.fillStyle = '#eab308';
        ctx.fill();

        // Brown ends
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.arc(-27, 7, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(25, 9, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // Lines
        ctx.strokeStyle = 'rgba(120, 53, 15, 0.35)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(-14, -3);
        ctx.quadraticCurveTo(2, -11, 16, 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-16, 5);
        ctx.quadraticCurveTo(0, -2, 14, 8);
        ctx.stroke();
      }
      else if (f.name === 'grape') {
        // Grape bunch - bigger
        const positions = [
          [0, -12], [-13, -3], [13, -3],
          [-8, 10], [8, 10], [0, 20],
          [-18, 8], [18, 8]
        ];
        positions.forEach(([px, py], i) => {
          ctx.beginPath();
          ctx.arc(px, py, 12, 0, Math.PI * 2);
          ctx.fillStyle = i % 2 === 0 ? '#a855f7' : '#7e22ce';
          ctx.fill();

          // Highlight
          ctx.beginPath();
          ctx.arc(px - 4, py - 4, 4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.25)';
          ctx.fill();
        });

        // Stem
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(0, -34);
        ctx.strokeStyle = '#4d7c0f';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      ctx.restore();
    }

    // ========== Input ==========
    let isDrawing = false;
    let lastX = 0, lastY = 0;

    function getPos(e) {
      if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function startDraw(e) {
      e.preventDefault();
      if (gameState !== 'playing') return;
      isDrawing = true;
      const pos = getPos(e);
      lastX = pos.x;
      lastY = pos.y;
      slashPoints = [{ x: pos.x, y: pos.y, life: 8 }];
    }

    function moveDraw(e) {
      e.preventDefault();
      if (!isDrawing || gameState !== 'playing') return;
      const pos = getPos(e);
      slashPoints.push({ x: pos.x, y: pos.y, life: 8 });
      if (slashPoints.length > 12) slashPoints.shift();
      checkSlice(lastX, lastY, pos.x, pos.y);
      lastX = pos.x;
      lastY = pos.y;
    }

    function endDraw(e) {
      e.preventDefault();
      isDrawing = false;
      slashPoints = [];
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    function checkSlice(x1, y1, x2, y2) {
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        if (f.sliced) continue;
        const dist = pointToSegmentDistance(f.x, f.y, x1, y1, x2, y2);
        if (dist < 36) {           // bigger hit area
          sliceFruit(f);
        }
      }
    }

    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
      const dot = A * C + B * D;
      const lenSq = C * C + D * D;
      let param = lenSq !== 0 ? dot / lenSq : -1;
      let xx, yy;
      if (param < 0) { xx = x1; yy = y1; }
      else if (param > 1) { xx = x2; yy = y2; }
      else { xx = x1 + param * C; yy = y1 + param * D; }
      return Math.sqrt((px - xx) ** 2 + (py - yy) ** 2);
    }

    function sliceFruit(fruit) {
      fruit.sliced = true;

      if (fruit.isBomb) {
        createExplosion(fruit.x, fruit.y, '#ef4444');
        gameOver();
        return;
      }

      score += fruit.points * (combo > 0 ? combo : 1);
      scoreEl.textContent = score;

      const now = Date.now();
      if (now - lastSliceTime < 900) combo++;
      else combo = 1;
      lastSliceTime = now;

      if (combo > 1) {
        comboEl.textContent = `Combo x${combo}`;
        comboEl.style.opacity = '1';
      }

      createParticles(fruit.x, fruit.y, fruit.color || '#f97316');
      setTimeout(() => {
        fruits = fruits.filter(f => f !== fruit);
      }, 100);
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 9,
          vy: (Math.random() - 0.5) * 9 - 2,
          life: 32 + Math.random() * 20,
          color,
          size: 3.5 + Math.random() * 4.5
        });
      }
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 28; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 15,
          vy: (Math.random() - 0.5) * 15,
          life: 42 + Math.random() * 20,
          color,
          size: 4.5 + Math.random() * 5.5
        });
      }
    }

    function spawnFruit() {
      const isBomb = Math.random() < 0.12;
      const type = isBomb ? FRUIT_TYPES[5] : FRUIT_TYPES[Math.floor(Math.random() * 5)];

      const fromLeft = Math.random() > 0.5;
      const x = fromLeft ? -60 : width + 60;
      const y = height * 0.45 + Math.random() * (height * 0.32);

      const speed = 4.4 + Math.random() * 2.2;
      const angle = fromLeft ? (-0.55 - Math.random() * 0.45) : (Math.PI + 0.55 + Math.random() * 0.45);

      fruits.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3.4,
        name: type.name,
        points: type.points,
        isBomb: type.isBomb || false,
        sliced: false,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.13,
        color: type.name === 'apple' ? '#ef4444' :
               type.name === 'orange' ? '#f97316' :
               type.name === 'watermelon' ? '#22c55e' :
               type.name === 'banana' ? '#eab308' :
               type.name === 'grape' ? '#a855f7' : '#1e293b'
      });
    }

    function update(dt) {
      if (gameState !== 'playing') return;

      gameTime += dt;
      spawnTimer += dt;

      const spawnInterval = Math.max(0.5, 1.05 - gameTime * 0.011);
      if (spawnTimer > spawnInterval) {
        spawnFruit();
        if (Math.random() < 0.28) spawnFruit();
        spawnTimer = 0;
      }

      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.x += f.vx;
        f.y += f.vy;
        f.vy += 0.17;
        f.rotation += f.rotSpeed;

        if (f.y > height + 90 || f.x < -110 || f.x > width + 110) {
          fruits.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.14;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = slashPoints.length - 1; i >= 0; i--) {
        slashPoints[i].life--;
        if (slashPoints[i].life <= 0) slashPoints.splice(i, 1);
      }

      if (Date.now() - lastSliceTime > 1000) {
        combo = 0;
        comboEl.style.opacity = '0';
      }

      timeLeft -= dt;
      timerEl.textContent = `Time: ${Math.max(0, Math.ceil(timeLeft))}`;
      if (timeLeft <= 0) gameOver();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      fruits.forEach(f => {
        if (!f.sliced) drawFruit(f);
      });

      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 35);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      if (slashPoints.length > 1) {
        ctx.beginPath();
        ctx.moveTo(slashPoints[0].x, slashPoints[0].y);
        for (let i = 1; i < slashPoints.length; i++) {
          ctx.lineTo(slashPoints[i].x, slashPoints[i].y);
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
        ctx.lineWidth = 11;
        ctx.stroke();
      }
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      score = 0;
      scoreEl.textContent = '0';
      timeLeft = 40;
      combo = 0;
      fruits = [];
      particles = [];
      slashPoints = [];
      spawnTimer = 0;
      gameTime = 0;
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      comboEl.style.opacity = '0';
    }

    function gameOver() {
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('fruitSliceBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
