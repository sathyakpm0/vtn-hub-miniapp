<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Penalty Shootout</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

body {
  background: #0f172a;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
}

#game-container {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#ui {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  z-index: 5;
  pointer-events: none;
}

#score {
  font-size: 36px;
  font-weight: bold;
}

#best {
  font-size: 13px;
  opacity: .75;
}

#shots {
  font-size: 17px;
  font-weight: bold;
}

#message {
  position: absolute;
  top: 43%;
  width: 100%;
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  opacity: 0;
  z-index: 10;
  pointer-events: none;
  text-shadow: 0 3px 12px #000;
}

#instruction {
  position: absolute;
  bottom: 65px;
  width: 100%;
  text-align: center;
  font-size: 14px;
  opacity: .85;
  pointer-events: none;
}

#power-bar-container {
  position: absolute;
  bottom: 32px;
  left: 15%;
  width: 70%;
  height: 13px;
  background: #ffffff30;
  border-radius: 20px;
  overflow: hidden;
  display: none;
}

#power-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg,#22c55e,#eab308,#ef4444);
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(15,23,42,.96);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 15px;
  z-index: 20;
  text-align: center;
  padding: 25px;
}

#start-screen {
  display: flex;
}

h1,h2 {
  font-size: 32px;
}

.overlay p {
  font-size: 15px;
  line-height: 1.6;
  opacity: .8;
}

#final-score {
  font-size: 52px;
  font-weight: bold;
  color: #38bdf8;
}

button {
  background: #38bdf8;
  color: #0f172a;
  border: none;
  border-radius: 40px;
  padding: 15px 42px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 12px;
}

button:active {
  transform: scale(.95);
}
</style>
</head>

<body>

<div id="game-container">

<canvas id="game"></canvas>

<div id="ui">
  <div>
    <div id="score">0</div>
    <div id="best">Best: 0</div>
  </div>
  <div id="shots">Shot 1/5</div>
</div>

<div id="message"></div>

<div id="instruction">
  Drag left or right to aim. Release to shoot!
</div>

<div id="power-bar-container">
  <div id="power-bar"></div>
</div>

<div id="start-screen" class="overlay">
  <h1>⚽ Penalty Shootout</h1>
  <p>
    Aim carefully and beat the goalkeeper!<br>
    You have 5 shots. Score as many goals as possible.
  </p>
  <button id="start-btn">Start Game</button>
</div>

<div id="game-over" class="overlay">
  <h2>🏆 Game Over</h2>
  <div id="final-score">0 / 5</div>
  <div id="best-score-text">Best: 0</div>
  <button id="restart-btn">Play Again</button>
</div>

</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0f172a');
  tg.setBackgroundColor('#0f172a');
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const shotsEl = document.getElementById("shots");
const messageEl = document.getElementById("message");
const instructionEl = document.getElementById("instruction");
const powerContainer = document.getElementById("power-bar-container");
const powerBar = document.getElementById("power-bar");

const startScreen = document.getElementById("start-screen");
const gameOver = document.getElementById("game-over");

const finalScore = document.getElementById("final-score");
const bestScoreText = document.getElementById("best-score-text");

let W = 0;
let H = 0;
let dpr = 1;

let score = 0;
let shotNumber = 1;
const maxShots = 5;

let bestScore = 0;

try {
  bestScore = Number(localStorage.getItem("penaltyBest") || 0);
} catch(e) {}

bestEl.textContent = "Best: " + bestScore;

let gameState = "start";
let goal = {};
let ball = {};
let keeper = {};

let aimX = 0;
let power = 0;
let powerDirection = 1;
let holding = false;

let shotProgress = 0;
let shotDuration = 0.65;
let resultTimer = 0;
let shotResult = "";

let lastTime = performance.now();

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;

  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  setupGoal();

  if (ball && gameState !== "shooting") {
    resetBall();
  }
}

function setupGoal() {
  const gw = Math.min(W * 0.78, 350);
  const gh = Math.min(H * 0.19, 135);

  goal = {
    x: (W - gw) / 2,
    y: H * 0.19,
    width: gw,
    height: gh,
    lineY: H * 0.19 + gh
  };

  keeper.width = 58;
  keeper.height = 85;
  keeper.x = W / 2;
  keeper.startX = W / 2;
  keeper.targetX = W / 2;
  keeper.diving = false;
  keeper.diveProgress = 0;
}

function resetBall() {
  ball = {
    x: W / 2,
    y: H * 0.79,
    startX: W / 2,
    startY: H * 0.79,
    radius: 16,
    vx: 0,
    vy: 0,
    moving: false,
    targetX: W / 2,
    targetY: goal.lineY,
    height: 0
  };

  aimX = W / 2;
  power = 0;
  powerDirection = 1;
  holding = false;

  keeper.x = W / 2;
  keeper.targetX = W / 2;
  keeper.diving = false;
  keeper.diveProgress = 0;

  powerContainer.style.display = "none";
  powerBar.style.width = "0%";
  instructionEl.style.opacity = "1";
}

function updateShotText() {
  shotsEl.textContent = `Shot ${shotNumber}/${maxShots}`;
}

function startGame() {
  score = 0;
  shotNumber = 1;

  scoreEl.textContent = "0";

  startScreen.style.display = "none";
  gameOver.style.display = "none";

  setupGoal();
  resetBall();

  gameState = "aiming";
  updateShotText();
}

function startNextShot() {
  shotNumber++;

  if (shotNumber > maxShots) {
    endGame();
    return;
  }

  resetBall();

  gameState = "aiming";
  updateShotText();
}

function endGame() {
  gameState = "gameover";

  if (score > bestScore) {
    bestScore = score;

    try {
      localStorage.setItem("penaltyBest", String(bestScore));
    } catch(e) {}

    bestEl.textContent = "Best: " + bestScore;
  }

  finalScore.textContent = score + " / 5";
  bestScoreText.textContent = "Best: " + bestScore;

  gameOver.style.display = "flex";
}

function showMessage(text, color) {
  messageEl.textContent = text;
  messageEl.style.color = color;
  messageEl.style.opacity = "1";
}

function getPosition(e) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

/* AIMING */

function startHold(e) {
  if (gameState !== "aiming") return;

  e.preventDefault();

  holding = true;

  try {
    canvas.setPointerCapture(e.pointerId);
  } catch(err) {}

  const pos = getPosition(e);
  updateAim(pos.x);

  powerContainer.style.display = "block";
}

function updateAim(x) {
  const minX = goal.x + 12;
  const maxX = goal.x + goal.width - 12;

  aimX = Math.max(minX, Math.min(maxX, x));
}

function moveHold(e) {
  if (!holding || gameState !== "aiming") return;

  e.preventDefault();

  const pos = getPosition(e);
  updateAim(pos.x);
}

function endHold(e) {
  if (!holding || gameState !== "aiming") return;

  e.preventDefault();

  holding = false;
  shoot();
}

canvas.addEventListener("pointerdown", startHold);
canvas.addEventListener("pointermove", moveHold);
canvas.addEventListener("pointerup", endHold);
canvas.addEventListener("pointercancel", endHold);

/* SHOOTING */

function shoot() {
  if (gameState !== "aiming") return;

  gameState = "shooting";

  powerContainer.style.display = "none";
  instructionEl.style.opacity = "0";

  ball.startX = W / 2;
  ball.startY = H * 0.79;

  ball.x = ball.startX;
  ball.y = ball.startY;

  ball.targetX = aimX;
  ball.targetY = goal.lineY - 3;

  ball.radius = 16;
  ball.moving = true;

  shotProgress = 0;

  shotDuration = 0.82 - (power / 100) * 0.28;

  keeper.startX = keeper.x;

  const ballGoingLeft = aimX < W / 2;

  // Keeper sometimes guesses the wrong direction.
  const guessesCorrectSide = Math.random() < 0.58;

  if (guessesCorrectSide) {
    keeper.targetX = ballGoingLeft
      ? goal.x + 35
      : goal.x + goal.width - 35;
  } else {
    keeper.targetX = ballGoingLeft
      ? goal.x + goal.width - 35
      : goal.x + 35;
  }

  keeper.diving = true;
  keeper.diveProgress = 0;
}

/* BALL PHYSICS */

function updateBall(dt) {
  if (!ball.moving) return;

  shotProgress += dt / shotDuration;

  const t = Math.min(shotProgress, 1);

  // Smooth ball movement from penalty spot to goal line.
  const smooth = t * t * (3 - 2 * t);

  ball.x = ball.startX + (ball.targetX - ball.startX) * smooth;

  ball.y = ball.startY + (ball.targetY - ball.startY) * smooth;

  // Ball appears smaller as it moves into the goal.
  ball.radius = 16 - smooth * 7;

  // Small arc.
  ball.height = Math.sin(t * Math.PI) * (8 + power * 0.12);

  if (shotProgress >= 1) {
    ball.x = ball.targetX;
    ball.y = ball.targetY;
    ball.moving = false;

    resolveShot();
  }
}

/* GOAL / SAVE / POST DETECTION */

function resolveShot() {
  const x = ball.targetX;

  const leftPost = goal.x;
  const rightPost = goal.x + goal.width;

  const postMargin = 10;

  // Ball hits the left or right post.
  if (
    x <= leftPost + postMargin ||
    x >= rightPost - postMargin
  ) {
    shotResult = "POST";
    showMessage("POST! 🥅", "#facc15");

    // Rebound animation.
    ball.x += x <= W / 2 ? 25 : -25;
    ball.y += 12;

  } else {

    // Keeper must be close enough to physically reach the ball.
    const keeperDistance = Math.abs(x - keeper.x);

    const saveRadius = 39 + power * 0.06;

    if (keeperDistance < saveRadius) {
      shotResult = "SAVED";
      showMessage("SAVED! 🧤", "#f87171");
    } else {
      shotResult = "GOAL";

      score++;
      scoreEl.textContent = score;

      showMessage("GOAL! ⚽", "#4ade80");
    }
  }

  gameState = "result";
  resultTimer = 1.5;
}

/* GOALKEEPER MOVEMENT */

function updateKeeper(dt) {
  if (!keeper.diving) return;

  keeper.diveProgress = Math.min(
    1,
    keeper.diveProgress + dt * 2.5
  );

  const t = keeper.diveProgress;

  const smooth = t * t * (3 - 2 * t);

  keeper.x =
    keeper.startX +
    (keeper.targetX - keeper.startX) * smooth;
}

/* DRAW PITCH */

function drawPitch() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);

  gradient.addColorStop(0, "#0f172a");
  gradient.addColorStop(0.40, "#1e293b");
  gradient.addColorStop(0.41, "#166534");
  gradient.addColorStop(1, "#15803d");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // Grass stripes.
  ctx.fillStyle = "rgba(255,255,255,0.035)";

  for (let i = 0; i < 7; i++) {
    ctx.fillRect(0, H * 0.45 + i * 65, W, 32);
  }

  // Penalty box.
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 2;

  ctx.strokeRect(
    goal.x - 30,
    goal.lineY,
    goal.width + 60,
    100
  );

  // Penalty spot.
  ctx.beginPath();
  ctx.arc(W / 2, H * 0.79, 5, 0, Math.PI * 2);

  ctx.fillStyle = "white";
  ctx.fill();
}

/* DRAW GOAL */

function drawGoal() {
  // Goal net background.
  ctx.fillStyle = "rgba(255,255,255,0.07)";

  ctx.fillRect(
    goal.x,
    goal.y,
    goal.width,
    goal.height
  );

  // Net horizontal and vertical lines.
  ctx.strokeStyle = "rgba(255,255,255,0.28)";
  ctx.lineWidth = 1;

  for (let i = 1; i < 9; i++) {
    const x = goal.x + goal.width * i / 9;

    ctx.beginPath();
    ctx.moveTo(x, goal.y);
    ctx.lineTo(x, goal.lineY);
    ctx.stroke();
  }

  for (let i = 1; i < 5; i++) {
    const y = goal.y + goal.height * i / 5;

    ctx.beginPath();
    ctx.moveTo(goal.x, y);
    ctx.lineTo(goal.x + goal.width, y);
    ctx.stroke();
  }

  // Goal frame.
  ctx.strokeStyle = "#f8fafc";
  ctx.lineWidth = 6;
  ctx.lineJoin = "round";

  ctx.beginPath();

  ctx.moveTo(goal.x, goal.lineY);
  ctx.lineTo(goal.x, goal.y);
  ctx.lineTo(goal.x + goal.width, goal.y);
  ctx.lineTo(goal.x + goal.width, goal.lineY);

  ctx.stroke();

  // Posts.
  ctx.fillStyle = "#f8fafc";

  ctx.fillRect(goal.x - 3, goal.y - 2, 6, goal.height + 5);

  ctx.fillRect(
    goal.x + goal.width - 3,
    goal.y - 2,
    6,
    goal.height + 5
  );
}

/* DRAW GOALKEEPER */

function drawKeeper() {
  const x = keeper.x;
  const y = keeper.startY || keeper.y;

  const diving = keeper.diving;

  ctx.save();

  // Shadow.
  ctx.fillStyle = "rgba(0,0,0,0.25)";

  ctx.beginPath();
  ctx.ellipse(x, goal.lineY - 3, 35, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body.
  ctx.fillStyle = "#2563eb";

  ctx.beginPath();
  ctx.roundRect(x - 21, goal.lineY - 62, 42, 47, 9);
  ctx.fill();

  // Legs.
  ctx.strokeStyle = "#172554";
  ctx.lineWidth = 10;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(x - 10, goal.lineY - 17);
  ctx.lineTo(x - 15, goal.lineY - 3);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x + 10, goal.lineY - 17);
  ctx.lineTo(x + 15, goal.lineY - 3);
  ctx.stroke();

  // Arms.
  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 11;

  const diveAmount = diving ? keeper.diveProgress : 0;
  const direction = keeper.targetX >= keeper.startX ? 1 : -1;

  ctx.beginPath();
  ctx.moveTo(x - 15, goal.lineY - 48);
  ctx.lineTo(
    x - 37 + direction * diveAmount * 15,
    goal.lineY - 32
  );
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x + 15, goal.lineY - 48);
  ctx.lineTo(
    x + 37 + direction * diveAmount * 15,
    goal.lineY - 32
  );
  ctx.stroke();

  // Gloves.
  ctx.fillStyle = "#facc15";

  ctx.beginPath();
  ctx.arc(
    x - 37 + direction * diveAmount * 15,
    goal.lineY - 32,
    9,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    x + 37 + direction * diveAmount * 15,
    goal.lineY - 32,
    9,
    0,
    Math.PI * 2
  );
  ctx.fill();

  // Head.
  ctx.fillStyle = "#fcd34d";

  ctx.beginPath();
  ctx.arc(x, goal.lineY - 76, 15, 0, Math.PI * 2);
  ctx.fill();

  // Face.
  ctx.fillStyle = "#111827";

  ctx.beginPath();
  ctx.arc(x - 5, goal.lineY - 78, 2, 0, Math.PI * 2);
  ctx.arc(x + 5, goal.lineY - 78, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* DRAW BALL */

function drawBall() {
  if (!ball) return;

  const r = ball.radius;
  const y = ball.y - (ball.height || 0);

  // Shadow.
  ctx.fillStyle = "rgba(0,0,0,0.25)";

  ctx.beginPath();
  ctx.ellipse(
    ball.x,
    ball.y + 10,
    r * 0.9,
    5,
    0,
    0,
    Math.PI * 2
  );
  ctx.fill();

  // Ball.
  ctx.fillStyle = "#ffffff";

  ctx.beginPath();
  ctx.arc(ball.x, y, r, 0, Math.PI * 2);
  ctx.fill();

  // Ball pattern.
  ctx.fillStyle = "#111827";

  ctx.beginPath();
  ctx.arc(ball.x, y, r * 0.32, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#111827";
  ctx.lineWidth = 1.3;

  ctx.beginPath();
  ctx.arc(ball.x, y, r * 0.7, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(ball.x - r * 0.7, y);
  ctx.lineTo(ball.x + r * 0.7, y);
  ctx.stroke();
}

/* AIM GUIDE */

function drawAim() {
  if (gameState !== "aiming") return;

  ctx.save();

  ctx.strokeStyle = "rgba(56,189,248,0.75)";
  ctx.lineWidth = 2;

  ctx.setLineDash([7, 7]);

  ctx.beginPath();
  ctx.moveTo(W / 2, H * 0.79);
  ctx.lineTo(aimX, goal.lineY - 5);
  ctx.stroke();

  ctx.setLineDash([]);

  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.arc(aimX, goal.y + goal.height * 0.55, 11, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

/* GAME LOOP */

function update(dt) {
  if (gameState === "aiming" && holding) {
    power += powerDirection * 100 * dt;

    if (power >= 100) {
      power = 100;
      powerDirection = -1;
    }

    if (power <= 0) {
      power = 0;
      powerDirection = 1;
    }

    powerBar.style.width = power + "%";
  }

  if (gameState === "shooting") {
    updateKeeper(dt);
    updateBall(dt);
  }

  if (gameState === "result") {
    resultTimer -= dt;

    if (resultTimer <= 0) {
      messageEl.style.opacity = "0";
      startNextShot();
    }
  }
}

function draw() {
  drawPitch();
  drawGoal();
  drawKeeper();
  drawAim();
  drawBall();
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.04);

  lastTime = now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

/* BUTTONS */

document.getElementById("start-btn").addEventListener("click", startGame);

document.getElementById("restart-btn").addEventListener("click", startGame);

window.addEventListener("resize", resize);

resize();

requestAnimationFrame(loop);

</script>

</body>
</html>
