<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bubble Shooter Legend</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 38px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #level-info {
      text-align: right;
    }

    #level-badge {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: inline-block;
      margin-bottom: 4px;
    }

    #shots-left {
      font-size: 15px;
      font-weight: 700;
      color: #f87171;
    }

    #game-over, #start-screen, #level-banner {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over, #level-banner {
      display: none;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }

    #banner-text {
      font-size: 36px;
      font-weight: 800;
      color: #4ade80;
      text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="level-info">
        <div id="level-badge">Level 1</div>
        <div id="shots-left">Shots: 20</div>
      </div>
    </div>

    <div id="start-screen">
      <h1>Bubble Shooter</h1>
      <p>Aim and shoot bubbles to match 3 or more of the same color!<br>Clear the board before shots run out. Levels get tougher!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="level-banner">
      <div id="banner-text">LEVEL 2</div>
      <p style="opacity: 0.8; font-size: 16px;">More bubble colors added! Aim carefully!</p>
    </div>

    <div id="game-over">
      <h2 id="game-over-title">Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelBadge = document.getElementById('level-badge');
    const shotsLeftEl = document.getElementById('shots-left');
    const gameOverEl = document.getElementById('game-over');
    const gameOverTitle = document.getElementById('game-over-title');
    const levelBanner = document.getElementById('level-banner');
    const bannerText = document.getElementById('banner-text');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('bubbleShooterBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let level = 1;
    let shotsLeft = 20;
    let gameState = 'start'; // start, playing, leveling, gameover

    const bubbleRadius = 20;
    const gridRows = 6;
    const gridCols = 8;
    let bubbleGrid = [];
    let currentBubble = null;
    let nextBubbleColor = 0;

    const COLORS = ['#ef4444', '#38bdf8', '#4ade80', '#facc15', '#a855f7'];

    function initGame() {
      score = 0;
      level = 1;
      scoreEl.textContent = '0';
      setupLevel();
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      levelBanner.style.display = 'none';
    }

    function setupLevel() {
      shotsLeft = Math.max(12, 24 - (level * 2));
      levelBadge.textContent = `Level ${level}`;
      shotsLeftEl.textContent = `Shots: ${shotsLeft}`;

      // Build grid
      bubbleGrid = [];
      let activeColorsCount = Math.min(COLORS.length, 3 + Math.floor(level / 2));

      for (let r = 0; r < gridRows; r++) {
        let row = [];
        let cols = (r % 2 === 0) ? gridCols : gridCols - 1;
        for (let c = 0; c < cols; c++) {
          row.push({
            color: Math.floor(Math.random() * activeColorsCount),
            active: true
          });
        }
        bubbleGrid.push(row);
      }

      spawnNewBubble();
    }

    function spawnNewBubble() {
      let activeColorsCount = Math.min(COLORS.length, 3 + Math.floor(level / 2));
      currentBubble = {
        x: width / 2,
        y: height - 80,
        vx: 0,
        vy: 0,
        color: Math.floor(Math.random() * activeColorsCount),
        active: false
      };
      nextBubbleColor = Math.floor(Math.random() * activeColorsCount);
    }

    // Aim and shoot on pointer release / tap
    window.addEventListener('pointerdown', (e) => {
      if (gameState !== 'playing' || currentBubble.active) return;

      let angle = Math.atan2(e.clientY - currentBubble.y, e.clientX - currentBubble.x);
      let speed = 14;
      currentBubble.vx = Math.cos(angle) * speed;
      currentBubble.vy = Math.sin(angle) * speed;
      currentBubble.active = true;

      shotsLeft--;
      shotsLeftEl.textContent = `Shots: ${shotsLeft}`;
    });

    function update() {
      if (gameState !== 'playing') return;

      if (currentBubble && currentBubble.active) {
        currentBubble.x += currentBubble.vx;
        currentBubble.y += currentBubble.vy;

        // Wall bounce left/right
        if (currentBubble.x - bubbleRadius < 20 || currentBubble.x + bubbleRadius > width - 20) {
          currentBubble.vx *= -1;
        }

        // Top ceiling hit
        if (currentBubble.y - bubbleRadius < 60) {
          snapCurrentBubble();
          return;
        }

        // Check collision with grid bubbles
        for (let r = 0; r < bubbleGrid.length; r++) {
          let cols = (r % 2 === 0) ? gridCols : gridCols - 1;
          for (let c = 0; c < cols; c++) {
            let b = bubbleGrid[r][c];
            if (!b.active) continue;

            let pos = getGridBubblePos(r, c);
            let dist = Math.hypot(currentBubble.x - pos.x, currentBubble.y - pos.y);

            if (dist < bubbleRadius * 2) {
              snapCurrentBubble();
              return;
            }
          }
        }
      }
    }

    function getGridBubblePos(r, c) {
      let startX = (r % 2 === 0) ? 50 : 70;
      return {
        x: startX + c * (bubbleRadius * 2),
        y: 80 + r * (bubbleRadius * 1.7)
      };
    }

    function snapCurrentBubble() {
      // Find closest empty grid slot or snap to top row
      let activeColorsCount = Math.min(COLORS.length, 3 + Math.floor(level / 2));
      
      // Add score for shot
      score += 10;
      scoreEl.textContent = score;

      // Check win condition (all bubbles cleared)
      let remainingBubbles = 0;
      bubbleGrid.forEach(row => row.forEach(b => { if (b.active) remainingBubbles++; }));

      if (remainingBubbles === 0) {
        triggerLevelUp();
        return;
      }

      if (shotsLeft <= 0) {
        gameOver("Out of Shots!");
        return;
      }

      spawnNewBubble();
    }

    function triggerLevelUp() {
      gameState = 'leveling';
      level++;
      bannerText.textContent = `LEVEL ${level} UNLOCKED!`;
      levelBanner.style.display = 'flex';

      setTimeout(() => {
        levelBanner.style.display = 'none';
        setupLevel();
        gameState = 'playing';
      }, 1500);
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Draw Grid Bubbles
      for (let r = 0; r < bubbleGrid.length; r++) {
        let cols = (r % 2 === 0) ? gridCols : gridCols - 1;
        for (let c = 0; c < cols; c++) {
          let b = bubbleGrid[r][c];
          if (!b.active) continue;

          let pos = getGridBubblePos(r, c);
          drawBubble(pos.x, pos.y, COLORS[b.color]);
        }
      }

      // Draw Shooter cannon base
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.arc(width / 2, height - 60, 35, Math.PI, 0);
      ctx.fill();

      // Draw current shooting bubble
      if (currentBubble) {
        drawBubble(currentBubble.x, currentBubble.y, COLORS[currentBubble.color]);
      }
    }

    function drawBubble(x, y, color) {
      ctx.save();
      ctx.translate(x, y);

      // Outer gradient sphere
      let grad = ctx.createRadialGradient(-5, -5, 2, 0, 0, bubbleRadius);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, color);
      grad.addColorStop(1, '#0f172a');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, bubbleRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver(reason) {
      gameState = 'gameover';
      gameOverTitle.textContent = reason;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('bubbleShooterBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
