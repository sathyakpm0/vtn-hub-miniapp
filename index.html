<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Knife Hit Fruits - Level Up</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body {
      background: #090d16;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
      overscroll-behavior: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      left: 0;
      width: 100%;
      padding: 16px 20px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .badge-col {
      display: flex;
      flex-direction: column;
    }

    #score {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
    }

    #best {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      margin-top: 4px;
      letter-spacing: 0.6px;
    }

    #level-badge {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.75);
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3), 0 0 12px rgba(56, 189, 248, 0.2);
      letter-spacing: 0.5px;
    }

    #knife-magazine {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 24px);
      left: 20px;
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }

    .knife-icon {
      width: 12px;
      height: 28px;
      background: linear-gradient(180deg, #f8fafc 40%, #94a3b8 100%);
      clip-path: polygon(50% 0%, 100% 20%, 80% 70%, 80% 100%, 20% 100%, 20% 70%, 0% 20%);
      filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.6));
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
    }

    .knife-icon.used {
      opacity: 0.15;
      transform: scale(0.7) translateY(4px);
      filter: none;
    }

    #game-over, #start-screen, #level-banner {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.88) 0%, rgba(9, 13, 22, 0.98) 100%);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }

    #game-over, #level-banner {
      display: none;
    }

    h1 {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 38px;
      font-weight: 900;
      color: #f43f5e;
      text-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
    }

    #final-score {
      font-size: 58px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    #best-score-text {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .btn {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 16px 46px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.4), inset 0 1px 1px rgba(255,255,255,0.4);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .btn:active {
      transform: scale(0.94);
      filter: brightness(1.2);
    }

    .instructions {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 290px;
    }

    #banner-text {
      font-size: 40px;
      font-weight: 900;
      color: #4ade80;
      text-shadow: 0 0 25px rgba(74, 222, 128, 0.5);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div class="badge-col">
        <div id="score">0</div>
        <div id="best">BEST: 0</div>
      </div>
      <div id="level-badge">STAGE 1</div>
    </div>

    <div id="knife-magazine"></div>

    <div id="start-screen">
      <h1>KNIFE HIT</h1>
      <p class="instructions">Tap to launch blades into the rotating fruit.<br><span style="color:#f87171; font-weight:700;">Never hit another blade!</span></p>
      <button class="btn" id="start-btn">PLAY NOW</button>
    </div>

    <div id="level-banner">
      <div id="banner-text">STAGE 2</div>
      <p style="color:#94a3b8; font-size: 16px; font-weight:600;">Faster Spin & Unstable Turns!</p>
    </div>

    <div id="game-over">
      <h2>DEFEATED</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">BEST: 0</div>
      <button class="btn" id="restart-btn">RETRY</button>
    </div>
  </div>

  <script>
    // ========== Telegram Mini App Setup & Haptics ==========
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.disableVerticalSwipes?.();
      tg.setHeaderColor?.('#090d16');
      tg.setBackgroundColor?.('#090d16');
    }

    function haptic(type = 'light') {
      try {
        if (!tg?.HapticFeedback) return;
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      } catch (e) {}
    }

    // ========== Procedural Sound Engine (Web Audio API) ==========
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playThrow() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(540, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
      playThud() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Low impact punch
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.15);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);

        // Juicy squelch noise burst
        const bufferSize = this.ctx.sampleRate * 0.08;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(700, now);
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.2, now);
        nGain.gain.linearRampToValueAtTime(0, now + 0.08);
        noise.connect(filter);
        filter.connect(nGain);
        nGain.connect(this.ctx.destination);
        noise.start(now);
      }
      playClink() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [1600, 2400, 3200].forEach((freq) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        });
      }
      playShatter() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [329.63, 440, 554.37, 659.25].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);
          gain.gain.setValueAtTime(0, now);
          gain.gain.setValueAtTime(0.25, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.45);
        });
      }
    }
    const audio = new SoundEngine();

    // ========== Canvas Setup ==========
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelBadge = document.getElementById('level-badge');
    const magazineEl = document.getElementById('knife-magazine');
    const gameOverEl = document.getElementById('game-over');
    const levelBanner = document.getElementById('level-banner');
    const bannerText = document.getElementById('banner-text');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // ========== Game State ==========
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('knifeHitBest_v2') || '0');
    bestEl.textContent = `BEST: ${bestScore}`;

    let level = 1;
    let knivesTotal = 6;
    let knivesLeft = 6;
    let gameState = 'start';
    let logAngle = 0;
    let logBaseSpeed = 0.024;
    let logSpeedModifier = 1;
    let speedShiftTimer = 0;

    let stuckKnives = [];
    let activeKnife = null;
    let deflectedKnife = null;
    let fruitShatterPieces = [];
    let particles = [];
    let floatingTexts = [];

    // Screen and target motion dynamics
    let screenShake = 0;
    let targetRecoilY = 0;
    let standbyKnifeYOffset = 0;

    const TARGET = {
      x: () => width / 2,
      y: () => height * 0.32 + targetRecoilY,
      radius: 94
    };

    // ========== Magazine UI Generator ==========
    function updateMagazineUI() {
      magazineEl.innerHTML = '';
      for (let i = 0; i < knivesTotal; i++) {
        const div = document.createElement('div');
        div.className = 'knife-icon' + (i >= knivesLeft ? ' used' : '');
        magazineEl.appendChild(div);
      }
    }

    // ========== Level Initialization ==========
    function initLevel() {
      stuckKnives = [];
      deflectedKnife = null;
      fruitShatterPieces = [];

      // Pre-planted knives to ramp up challenge
      const preCount = Math.min(4, Math.floor((level - 1) / 2));
      let currentAngle = Math.random() * Math.PI * 2;
      for (let i = 0; i < preCount; i++) {
        currentAngle += 0.85 + Math.random() * 0.7;
        stuckKnives.push({
          angle: currentAngle,
          wobble: 0,
          wobbleSpeed: 0
        });
      }

      knivesTotal = Math.min(10, 5 + Math.floor(level * 0.8));
      knivesLeft = knivesTotal;
      levelBadge.textContent = `STAGE ${level}`;
      updateMagazineUI();

      // Progressive speed dynamics
      const dir = level % 2 === 0 ? -1 : 1;
      logBaseSpeed = (0.022 + Math.min(0.045, level * 0.005)) * dir;
      speedShiftTimer = 0;
    }

    // ========== Knife Throwing ==========
    function throwKnife() {
      if (gameState !== 'playing' || activeKnife || knivesLeft <= 0) return;

      audio.playThrow();
      haptic('light');

      knivesLeft--;
      updateMagazineUI();

      activeKnife = {
        x: width / 2,
        y: height * 0.80,
        vy: -32
      };

      // Animate next standby knife loading in
      standbyKnifeYOffset = 30;
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      audio.init();
      throwKnife();
    });

    // ========== Procedural Graphics: Realistic Knife Drawing ==========
    function drawKnifeMesh(ctx, length = 76, widthScale = 1) {
      ctx.save();
      const hw = 5 * widthScale;

      // Drop Shadow for 3D depth
      ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 4;

      // 1. Blade Body (Steel Gradient)
      const bladeGrad = ctx.createLinearGradient(-hw, -length, hw, 0);
      bladeGrad.addColorStop(0, '#ffffff');
      bladeGrad.addColorStop(0.3, '#e2e8f0');
      bladeGrad.addColorStop(0.7, '#94a3b8');
      bladeGrad.addColorStop(1, '#64748b');

      ctx.beginPath();
      ctx.moveTo(0, -length); // Razor sharp tip
      ctx.lineTo(hw, -length + 18);
      ctx.lineTo(hw * 0.85, 0);
      ctx.lineTo(-hw * 0.85, 0);
      ctx.lineTo(-hw, -length + 18);
      ctx.closePath();
      ctx.fillStyle = bladeGrad;
      ctx.fill();

      // Clear shadow for crisp inner bevel
      ctx.shadowColor = 'transparent';

      // 2. Blade Bevel Spine (Light Glint)
      ctx.beginPath();
      ctx.moveTo(0, -length + 4);
      ctx.lineTo(0, -2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 3. Brass / Gold Guard
      const guardGrad = ctx.createLinearGradient(-hw * 1.6, 0, hw * 1.6, 4);
      guardGrad.addColorStop(0, '#fef08a');
      guardGrad.addColorStop(0.5, '#eab308');
      guardGrad.addColorStop(1, '#a16207');
      ctx.fillStyle = guardGrad;
      ctx.beginPath();
      ctx.roundRect(-hw * 1.6, 0, hw * 3.2, 5, 2);
      ctx.fill();

      // 4. Textured Ebony Handle
      const handleGrad = ctx.createLinearGradient(-hw * 0.7, 5, hw * 0.7, 5);
      handleGrad.addColorStop(0, '#334155');
      handleGrad.addColorStop(0.5, '#0f172a');
      handleGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = handleGrad;
      ctx.beginPath();
      ctx.roundRect(-hw * 0.7, 5, hw * 1.4, 24, 2);
      ctx.fill();

      // Rivets
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.arc(0, 11, 1.2, 0, Math.PI * 2);
      ctx.arc(0, 21, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // 5. Pommel (Counterweight cap)
      ctx.fillStyle = guardGrad;
      ctx.beginPath();
      ctx.arc(0, 30, hw * 0.9, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ========== Procedural Graphics: Photorealistic Fruit Logs ==========
    function drawFruitLog(ctx, typeIndex, radius) {
      const type = typeIndex % 4;

      // 3D Rim Bevel Spherical Gradient
      const grad3D = ctx.createRadialGradient(-radius * 0.35, -radius * 0.35, 10, 0, 0, radius);

      if (type === 0) {
        // ========== 1. WATERMELON ==========
        // Dark rind
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#14532d';
        ctx.fill();

        // Rind zebra stripes
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 5;
        for (let a = 0; a < Math.PI * 2; a += 0.38) {
          ctx.beginPath();
          ctx.arc(0, 0, radius - 2, a, a + 0.2);
          ctx.stroke();
        }

        // Inner white/pale rind
        ctx.beginPath();
        ctx.arc(0, 0, radius - 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ecfccb';
        ctx.fill();

        // Ruby pulp
        grad3D.addColorStop(0, '#f87171');
        grad3D.addColorStop(0.85, '#ef4444');
        grad3D.addColorStop(1, '#b91c1c');
        ctx.beginPath();
        ctx.arc(0, 0, radius - 15, 0, Math.PI * 2);
        ctx.fillStyle = grad3D;
        ctx.fill();

        // Concentric Black Seeds
        ctx.fillStyle = '#0f172a';
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          const dist = radius * 0.58;
          ctx.beginPath();
          ctx.ellipse(Math.cos(a) * dist, Math.sin(a) * dist, 3, 5, a + Math.PI / 2, 0, Math.PI * 2);
          ctx.fill();
        }

      } else if (type === 1) {
        // ========== 2. BLOOD ORANGE ==========
        // Orange Zest
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ea580c';
        ctx.fill();

        // White Pith
        ctx.beginPath();
        ctx.arc(0, 0, radius - 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffedd5';
        ctx.fill();

        // 8 Translucent Segments
        const segCount = 8;
        for (let i = 0; i < segCount; i++) {
          const startA = (i / segCount) * Math.PI * 2 + 0.05;
          const endA = ((i + 1) / segCount) * Math.PI * 2 - 0.05;

          const sGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, radius - 12);
          sGrad.addColorStop(0, '#f97316');
          sGrad.addColorStop(1, '#dc2626');

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius - 13, startA, endA);
          ctx.closePath();
          ctx.fillStyle = sGrad;
          ctx.fill();
        }

        // Center pith core
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#ffedd5';
        ctx.fill();

      } else if (type === 2) {
        // ========== 3. KIWI ==========
        // Fuzzy Brown Skin
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#78350f';
        ctx.fill();

        // Lime Pulp
        grad3D.addColorStop(0, '#bef264');
        grad3D.addColorStop(0.7, '#84cc16');
        grad3D.addColorStop(1, '#4d7c0f');
        ctx.beginPath();
        ctx.arc(0, 0, radius - 7, 0, Math.PI * 2);
        ctx.fillStyle = grad3D;
        ctx.fill();

        // Creamy Core
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = '#f7fee7';
        ctx.fill();

        // Seed Ring & Sunburst Rays
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1.5;
        for (let a = 0; a < Math.PI * 2; a += 0.25) {
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * radius * 0.28, Math.sin(a) * radius * 0.28);
          ctx.lineTo(Math.cos(a) * radius * 0.62, Math.sin(a) * radius * 0.62);
          ctx.stroke();

          // Tiny black seeds
          ctx.fillStyle = '#1c1917';
          ctx.beginPath();
          ctx.arc(Math.cos(a + 0.1) * radius * 0.45, Math.sin(a + 0.1) * radius * 0.45, 2, 0, Math.PI * 2);
          ctx.fill();
        }

      } else {
        // ========== 4. DRAGONFRUIT (PITAYA) ==========
        // Jagged Hot Pink Skin
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#db2777';
        ctx.fill();

        // Green scale accents
        ctx.fillStyle = '#84cc16';
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          ctx.beginPath();
          ctx.ellipse(Math.cos(a) * radius, Math.sin(a) * radius, 6, 12, a + Math.PI / 2, 0, Math.PI * 2);
          ctx.fill();
        }

        // White speck pulp
        grad3D.addColorStop(0, '#ffffff');
        grad3D.addColorStop(0.85, '#f1f5f9');
        grad3D.addColorStop(1, '#cbd5e1');
        ctx.beginPath();
        ctx.arc(0, 0, radius - 8, 0, Math.PI * 2);
        ctx.fillStyle = grad3D;
        ctx.fill();

        // Multitude of small seeds
        ctx.fillStyle = '#0f172a';
        for (let i = 0; i < 36; i++) {
          const dist = 14 + (i * 2.1) % (radius - 20);
          const a = i * 2.4;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * dist, Math.sin(a) * dist, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Specular surface sheen
      ctx.beginPath();
      ctx.arc(-radius * 0.35, -radius * 0.35, radius * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.fill();
    }

    // ========== Fruit Shatter Chunks on Level Complete ==========
    function createFruitShatter(x, y, radius, typeIndex) {
      const pieceCount = 8;
      for (let i = 0; i < pieceCount; i++) {
        const startAngle = (i / pieceCount) * Math.PI * 2;
        const endAngle = ((i + 1) / pieceCount) * Math.PI * 2;
        const midAngle = (startAngle + endAngle) / 2;
        const speed = 4 + Math.random() * 6;

        fruitShatterPieces.push({
          x: x,
          y: y,
          vx: Math.cos(midAngle) * speed,
          vy: Math.sin(midAngle) * speed - 3,
          startAngle,
          endAngle,
          radius,
          typeIndex,
          rotation: 0,
          vRot: (Math.random() - 0.5) * 0.2,
          alpha: 1
        });
      }

      // Scatter attached knives flying outward
      stuckKnives.forEach(k => {
        const outAngle = logAngle + k.angle;
        fruitShatterPieces.push({
          isKnife: true,
          x: x + Math.cos(outAngle) * radius,
          y: y + Math.sin(outAngle) * radius,
          vx: Math.cos(outAngle) * 8,
          vy: Math.sin(outAngle) * 8 - 4,
          rotation: outAngle + Math.PI / 2,
          vRot: (Math.random() - 0.5) * 0.3,
          alpha: 1
        });
      });
      stuckKnives = [];
    }

    // ========== Splashes, Sparks, & Particles ==========
    function spawnJuiceBurst(x, y, typeIndex) {
      const colors = [
        ['#ef4444', '#f87171', '#b91c1c'], // Watermelon
        ['#f97316', '#fb923c', '#ea580c'], // Orange
        ['#84cc16', '#bef264', '#4d7c0f'], // Kiwi
        ['#db2777', '#f43f5e', '#cbd5e1']  // Dragonfruit
      ][typeIndex % 4];

      for (let i = 0; i < 22; i++) {
        const speed = 3 + Math.random() * 8;
        const a = Math.random() * Math.PI * 2;
        particles.push({
          x, y,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed - 1.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 3 + Math.random() * 5,
          alpha: 1,
          decay: 0.02 + Math.random() * 0.02
        });
      }
    }

    function spawnDeflectionSparks(x, y) {
      for (let i = 0; i < 28; i++) {
        const speed = 4 + Math.random() * 10;
        const a = Math.random() * Math.PI * 2;
        particles.push({
          x, y,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          color: ['#ffffff', '#fef08a', '#38bdf8', '#fbbf24'][Math.floor(Math.random() * 4)],
          size: 2 + Math.random() * 3,
          alpha: 1,
          decay: 0.035
        });
      }
    }

    // ========== Main Update Cycle ==========
    function update(dt) {
      // Standby knife reload animation
      if (standbyKnifeYOffset > 0) {
        standbyKnifeYOffset = Math.max(0, standbyKnifeYOffset - dt * 140);
      }

      // Log Recoil Recovery
      targetRecoilY *= 0.85;
      if (Math.abs(targetRecoilY) < 0.2) targetRecoilY = 0;

      // Screen Shake Decay
      screenShake *= 0.88;
      if (screenShake < 0.2) screenShake = 0;

      // Update Stuck Knives Vibration
      stuckKnives.forEach(k => {
        if (Math.abs(k.wobble) > 0.001 || Math.abs(k.wobbleSpeed) > 0.001) {
          k.wobbleSpeed += -k.wobble * 48 * dt; // spring force
          k.wobbleSpeed *= 0.85; // damping
          k.wobble += k.wobbleSpeed;
        }
      });

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      // Update Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.025;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }

      // Update Fruit Shatter Pieces
      for (let i = fruitShatterPieces.length - 1; i >= 0; i--) {
        const piece = fruitShatterPieces[i];
        piece.x += piece.vx;
        piece.y += piece.vy;
        piece.vy += 0.35;
        piece.rotation += piece.vRot;
        piece.alpha -= 0.012;
        if (piece.y > height + 100 || piece.alpha <= 0) {
          fruitShatterPieces.splice(i, 1);
        }
      }

      // Update Deflected Knife
      if (deflectedKnife) {
        deflectedKnife.x += deflectedKnife.vx;
        deflectedKnife.y += deflectedKnife.vy;
        deflectedKnife.vy += 0.6;
        deflectedKnife.rotation += deflectedKnife.vRot;
        if (deflectedKnife.y > height + 120) deflectedKnife = null;
      }

      if (gameState !== 'playing') return;

      // Target erratic speed & reversal dynamics
      speedShiftTimer += dt;
      if (level >= 2 && speedShiftTimer > 2.2) {
        logSpeedModifier = Math.sin(Date.now() * 0.003) * 1.5;
      } else {
        logSpeedModifier = 1;
      }
      logAngle += logBaseSpeed * logSpeedModifier;

      // Active Knife Fly Physics
      if (activeKnife) {
        activeKnife.y += activeKnife.vy;

        const lx = TARGET.x();
        const ly = TARGET.y();
        const dist = Math.hypot(activeKnife.x - lx, activeKnife.y - ly);

        // Check Target Penetration
        if (dist <= TARGET.radius + 12) {
          const hitAngle = Math.atan2(activeKnife.y - ly, activeKnife.x - lx) - logAngle;

          // Knife-to-Knife Collision Precision (in radians)
          const clearance = Math.max(0.18, 0.28 - level * 0.008);
          let collidedKnife = null;

          for (let k of stuckKnives) {
            let diff = Math.abs(k.angle - hitAngle);
            while (diff > Math.PI * 2) diff -= Math.PI * 2;
            if (Math.min(diff, Math.PI * 2 - diff) < clearance) {
              collidedKnife = k;
              break;
            }
          }

          if (collidedKnife) {
            // Deflection / Failure!
            audio.playClink();
            haptic('error');
            screenShake = 16;
            spawnDeflectionSparks(activeKnife.x, activeKnife.y);

            deflectedKnife = {
              x: activeKnife.x,
              y: activeKnife.y,
              vx: (Math.random() - 0.5) * 8 - 4,
              vy: 7,
              rotation: 0,
              vRot: 0.25
            };

            activeKnife = null;
            setTimeout(gameOver, 450);
            return;
          }

          // Successful Hit!
          audio.playThud();
          haptic('medium');
          screenShake = 4.5;
          targetRecoilY = -7;

          spawnJuiceBurst(activeKnife.x, activeKnife.y, level - 1);

          stuckKnives.push({
            angle: hitAngle,
            wobble: 0.16,
            wobbleSpeed: 0
          });

          const earned = 10 * level;
          score += earned;
          scoreEl.textContent = score;

          floatingTexts.push({
            x: activeKnife.x + 20,
            y: activeKnife.y,
            text: `+${earned}`,
            color: '#38bdf8',
            alpha: 1,
            vy: -2
          });

          activeKnife = null;

          // Check Stage Victory
          if (stuckKnives.length >= knivesTotal) {
            triggerLevelUp();
          } else if (knivesLeft <= 0) {
            setTimeout(gameOver, 400);
          }
        }
      }
    }

    function triggerLevelUp() {
      gameState = 'leveling';
      audio.playShatter();
      haptic('success');
      screenShake = 14;

      createFruitShatter(TARGET.x(), TARGET.y(), TARGET.radius, level - 1);

      level++;
      score += 100 * (level - 1);
      scoreEl.textContent = score;

      bannerText.textContent = `STAGE ${level}`;
      levelBanner.style.display = 'flex';

      setTimeout(() => {
        levelBanner.style.display = 'none';
        initLevel();
        gameState = 'playing';
      }, 1300);
    }

    // ========== Render Cycle ==========
    function render() {
      ctx.save();

      // Screen Shake
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake * 2, (Math.random() - 0.5) * screenShake * 2);
      }

      // Background Radial Atmosphere
      const bgGrad = ctx.createRadialGradient(width / 2, height * 0.45, 50, width / 2, height * 0.5, width * 0.85);
      bgGrad.addColorStop(0, '#1e293b');
      bgGrad.addColorStop(0.65, '#0f172a');
      bgGrad.addColorStop(1, '#090d16');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      const lx = TARGET.x();
      const ly = TARGET.y();

      // Draw Rotating Fruit Log (if alive)
      if (gameState !== 'leveling') {
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(logAngle);

        // Fruit Core
        drawFruitLog(ctx, level - 1, TARGET.radius);

        // Stuck Knives with Realistic Wobble
        stuckKnives.forEach(k => {
          ctx.save();
          ctx.rotate(k.angle + k.wobble);
          ctx.translate(0, TARGET.radius - 8);
          ctx.rotate(Math.PI);
          drawKnifeMesh(ctx, 72, 0.95);
          ctx.restore();
        });

        ctx.restore();
      }

      // Draw Exploding Shatter Pieces (Level Clear)
      fruitShatterPieces.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = Math.max(0, p.alpha);

        if (p.isKnife) {
          drawKnifeMesh(ctx, 72, 0.95);
        } else {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, p.radius, p.startAngle, p.endAngle);
          ctx.closePath();
          ctx.clip();
          drawFruitLog(ctx, p.typeIndex, p.radius);
        }
        ctx.restore();
      });
      ctx.globalAlpha = 1;

      // Draw Airborne Active Knife
      if (activeKnife) {
        ctx.save();
        ctx.translate(activeKnife.x, activeKnife.y);
        drawKnifeMesh(ctx, 76, 1);
        ctx.restore();
      }

      // Draw Deflected Spinning Knife (Game Over Impact)
      if (deflectedKnife) {
        ctx.save();
        ctx.translate(deflectedKnife.x, deflectedKnife.y);
        ctx.rotate(deflectedKnife.rotation);
        drawKnifeMesh(ctx, 76, 1);
        ctx.restore();
      }

      // Draw Standby Knife at Launcher (Springs up)
      if (!activeKnife && gameState === 'playing' && knivesLeft > 0) {
        ctx.save();
        ctx.translate(width / 2, height * 0.80 + standbyKnifeYOffset);
        drawKnifeMesh(ctx, 76, 1);
        ctx.restore();
      }

      // Draw Juice & Sparks
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Draw Floating Score Numbers
      floatingTexts.forEach(ft => {
        ctx.font = '900 24px system-ui';
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 8;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.shadowBlur = 0;
      });
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    // ========== Engine Loop ==========
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    // ========== State Management ==========
    function startGame() {
      score = 0;
      scoreEl.textContent = '0';
      level = 1;
      initLevel();
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      levelBanner.style.display = 'none';
    }

    function gameOver() {
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('knifeHitBest_v2', bestScore);
        bestEl.textContent = `BEST: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `BEST: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    requestAnimationFrame(loop);
  </script>
</body>
