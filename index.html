<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Penalty Shootout V2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

body {
  background: #071525;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#game-container {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

#ui {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  z-index: 5;
  pointer-events: none;
}

#score {
  font-size: 36px;
  font-weight: 900;
}

#best {
  font-size: 13px;
  opacity: .7;
}

#shots {
  background: #0008;
  padding: 9px 14px;
  border-radius: 20px;
  font-weight: bold;
}

#message {
  position: absolute;
  top: 42%;
  width: 100%;
  text-align: center;
  font-size: 34px;
  font-weight: 900;
  opacity: 0;
  z-index: 10;
  text-shadow: 0 3px 12px black;
  pointer-events: none;
}

#instruction {
  position: absolute;
  bottom: 65px;
  width: 100%;
  text-align: center;
  font-size: 14px;
  color: white;
  text-shadow: 0 2px 5px black;
  pointer-events: none;
}

#power-box {
  position: absolute;
  bottom: 30px;
  left: 15%;
  width: 70%;
  height: 13px;
  background: #ffffff35;
  border-radius: 20px;
  overflow: hidden;
  display: none;
}

#power {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg,#22c55e,#eab308,#ef4444);
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(5,15,30,.96);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  z-index: 20;
  text-align: center;
  padding: 25px;
}

#start-screen {
  display: flex;
}

h1 {
  font-size: 32px;
}

.overlay p {
  line-height: 1.7;
  opacity: .8;
  font-size: 15px;
}

button {
  background: #ef4444;
  color: white;
  border: none;
  border-radius: 40px;
  padding: 15px 45px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 10px;
}

button:active {
  transform: scale(.95);
}

#final-score {
  font-size: 52px;
  font-weight: 900;
  color: #facc15;
}
</style>
</head>

<body>

<div id="game-container">

<canvas id="game"></canvas>

<div id="ui">
  <div>
    <div id="score">0</div>
    <div id="best">BEST: 0</div>
  </div>
  <div id="shots">SHOT 1 / 5</div>
</div>

<div id="message"></div>

<div id="instruction">
  DRAG TO AIM • HOLD TO CHARGE • RELEASE TO SHOOT
</div>

<div id="power-box">
  <div id="power"></div>
</div>

<div id="start-screen" class="overlay">
  <h1>⚽ PENALTY SHOOTOUT</h1>
  <p>
    Beat the goalkeeper!<br>
    Aim for the corners and score 5 goals.<br>
    You have five attempts.
  </p>
  <button id="start-btn">PLAY NOW</button>
</div>

<div id="game-over" class="overlay">
  <h1>🏆 GAME OVER</h1>
  <div id="final-score">0 / 5</div>
  <p id="best-score-text"></p>
  <button id="restart-btn">PLAY AGAIN</button>
</div>

</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor("#071525");
  tg.setBackgroundColor("#071525");
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

let W = 0, H = 0, DPR = 1;

let score = 0;
let best = 0;
let shot = 1;
const MAX_SHOTS = 5;

try {
  best = Number(localStorage.getItem("penaltyBest") || 0);
} catch(e) {}

$("best").textContent = "BEST: " + best;

let state = "start";
let goal = {};
let ball = {};
let keeper = {};

let pointerDown = false;
let pointerId = null;

let aimX = 0;
let aimY = 0;
let powerValue = 0;
let chargeDirection = 1;

let shotTime = 0;
let shotDuration = 0.75;
let resultTime = 0;
let resultText = "";

let particles = [];
let lastTime = performance.now();

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;

  DPR = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  setupGoal();

  if (state !== "shooting") resetBall();
}

function setupGoal() {
  const gw = Math.min(W * .78, 370);
  const gh = Math.min(H * .19, 135);

  goal = {
    x: (W - gw) / 2,
    y: H * .19,
    w: gw,
    h: gh,
    line: H * .19 + gh
  };

  keeper = {
    x: W / 2,
    startX: W / 2,
    targetX: W / 2,
    dive: false,
    diveTime: 0,
    reach: 0
  };
}

function resetBall() {
  ball = {
    x: W / 2,
    y: H * .79,
    startX: W / 2,
    startY: H * .79,
    radius: 16,
    vx: 0,
    vy: 0,
    z: 0,
    moving: false,
    rotation: 0,
    targetX: W / 2,
    targetY: goal.line - 40,
    previousX: W / 2,
    previousY: H * .79
  };

  aimX = W / 2;
  aimY = goal.line - 40;

  powerValue = 0;
  chargeDirection = 1;

  keeper.x = W / 2;
  keeper.startX = W / 2;
  keeper.targetX = W / 2;
  keeper.dive = false;
  keeper.diveTime = 0;
  keeper.reach = 0;

  pointerDown = false;

  $("power-box").style.display = "none";
  $("power").style.width = "0%";
  $("instruction").style.opacity = "1";
}

function startGame() {
  score = 0;
  shot = 1;

  $("score").textContent = "0";
  $("start-screen").style.display = "none";
  $("game-over").style.display = "none";

  setupGoal();
  resetBall();

  state = "aiming";
  updateShotUI();
}

function updateShotUI() {
  $("shots").textContent = `SHOT ${shot} / ${MAX_SHOTS}`;
}

function showMessage(text, color) {
  $("message").textContent = text;
  $("message").style.color = color;
  $("message").style.opacity = "1";
}

function endGame() {
  state = "gameover";

  if (score > best) {
    best = score;

    try {
      localStorage.setItem("penaltyBest", String(best));
    } catch(e) {}

    $("best").textContent = "BEST: " + best;
  }

  $("final-score").textContent = score + " / 5";
  $("best-score-text").textContent = "Your best score: " + best;

  $("game-over").style.display = "flex";
}

function nextShot() {
  shot++;

  if (shot > MAX_SHOTS) {
    endGame();
    return;
  }

  resetBall();
  updateShotUI();
  state = "aiming";
}

/* INPUT */

function getPosition(e) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

function setAim(x, y) {
  aimX = clamp(x, goal.x + 15, goal.x + goal.w - 15);
  aimY = clamp(y, goal.y + 15, goal.line - 12);
}

function pointerStart(e) {
  if (state !== "aiming") return;

  e.preventDefault();

  pointerDown = true;
  pointerId = e.pointerId;

  try {
    canvas.setPointerCapture(pointerId);
  } catch(err) {}

  const p = getPosition(e);
  setAim(p.x, p.y);

  $("power-box").style.display = "block";
}

function pointerMove(e) {
  if (!pointerDown || state !== "aiming") return;

  e.preventDefault();

  const p = getPosition(e);
  setAim(p.x, p.y);
}

function pointerEnd(e) {
  if (!pointerDown || state !== "aiming") return;

  e.preventDefault();

  pointerDown = false;
  pointerId = null;

  shoot();
}

canvas.addEventListener("pointerdown", pointerStart);
canvas.addEventListener("pointermove", pointerMove);
canvas.addEventListener("pointerup", pointerEnd);
canvas.addEventListener("pointercancel", pointerEnd);

/* SHOOT */

function shoot() {
  if (state !== "aiming") return;

  state = "shooting";

  $("power-box").style.display = "none";
  $("instruction").style.opacity = "0";

  ball.startX = W / 2;
  ball.startY = H * .79;

  ball.x = ball.startX;
  ball.y = ball.startY;

  ball.targetX = aimX;
  ball.targetY = aimY;

  ball.previousX = ball.x;
  ball.previousY = ball.y;

  // Charge affects shot speed and height.
  shotDuration = .95 - powerValue * .0035;

  // Keeper makes a directional guess.
  const correctGuess = Math.random() < .57;

  const direction = aimX < W / 2 ? -1 : 1;

  if (correctGuess) {
    keeper.targetX = aimX + direction * 25;
  } else {
    keeper.targetX = aimX - direction * 75;
  }

  keeper.targetX = clamp(
    keeper.targetX,
    goal.x + 22,
    goal.x + goal.w - 22
  );

  keeper.startX = keeper.x;
  keeper.dive = true;
  keeper.diveTime = 0;
}

/* PHYSICS */

function updateKeeper(dt) {
  if (!keeper.dive) return;

  keeper.diveTime = Math.min(1, keeper.diveTime + dt * 2.7);

  const t = keeper.diveTime;
  const smooth = 1 - Math.pow(1 - t, 3);

  keeper.x = keeper.startX +
    (keeper.targetX - keeper.startX) * smooth;

  keeper.reach = Math.sin(Math.min(t * 1.3, 1) * Math.PI / 2);
}

function updateBall(dt) {
  if (!ball.moving) return;

  const oldT = shotTime;

  shotTime += dt / shotDuration;

  const t = clamp(shotTime, 0, 1);

  // Continuous curved trajectory.
  const smooth = t * t * (3 - 2 * t);

  ball.previousX = ball.x;
  ball.previousY = ball.y;

  ball.x = ball.startX +
    (ball.targetX - ball.startX) * smooth;

  ball.y = ball.startY +
    (ball.targetY - ball.startY) * smooth;

  ball.z = Math.sin(t * Math.PI) *
    (12 + powerValue * .25);

  ball.radius = 16 - t * 7;
  ball.rotation += dt * 8;

  ball.vx = (ball.x - ball.previousX) / Math.max(dt, .001);
  ball.vy = (ball.y - ball.previousY) / Math.max(dt, .001);

  // Check keeper collision as the ball enters the keeper zone.
  if (oldT < .88 && t >= .88) {
    checkKeeperCollision();
  }

  if (t >= 1) {
    ball.moving = false;

    if (state === "shooting") {
      resolveShot();
    }
  }
}

function checkKeeperCollision() {
  const keeperY = goal.line - 45;

  const ballAtKeeperX =
    ball.startX +
    (ball.targetX - ball.startX) * .88;

  const ballAtKeeperY =
    ball.startY +
    (ball.targetY - ball.startY) * .88;

  const dx = ballAtKeeperX - keeper.x;
  const dy = ballAtKeeperY - keeperY;

  const reach = 38 + keeper.reach * 18;

  // Keeper collision uses an elliptical reachable area.
  const collision =
    (dx * dx) / (reach * reach) +
    (dy * dy) / (43 * 43) < 1;

  if (collision) {
    ball.moving = false;
    state = "result";

    resultText = "SAVED";
    showMessage("SAVED! 🧤", "#f87171");

    resultTime = 1.5;

    createParticles(ball.x, ball.y, "#ffffff", 12);
  }
}

function resolveShot() {
  if (state !== "shooting") return;

  const left = goal.x;
  const right = goal.x + goal.w;

  const x = ball.x;
  const y = ball.y;

  if (x <= left + 8 || x >= right - 8) {
    resultText = "POST";
    showMessage("POST! 🥅", "#facc15");

    ball.vx = x < W / 2 ? 170 : -170;
    ball.vy = 100;

    createParticles(x, y, "#facc15", 14);

  } else if (y < goal.y + 8 || y > goal.line - 5) {
    resultText = "MISS";
    showMessage("MISS!", "#f87171");

  } else {
    resultText = "GOAL";

    score++;
    $("score").textContent = score;

    showMessage("GOAL! ⚽", "#4ade80");

    createParticles(x, y, "#4ade80", 22);
  }

  state = "result";
  resultTime = 1.5;
}

function updateResult(dt) {
  if (state !== "result") return;

  resultTime -= dt;

  if (resultTime <= 0) {
    $("message").style.opacity = "0";
    nextShot();
  }
}

/* PARTICLES */

function createParticles(x, y, color, amount) {
  for (let i = 0; i < amount; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 150;

    particles.push({
      x,
      y,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      life: .7 + Math.random() * .5,
      color
    });
  }
}

function updateParticles(dt) {
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt;
    p.life -= dt;
  });

  particles = particles.filter(p => p.life > 0);
}

/* DRAWING */

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);

  g.addColorStop(0, "#071525");
  g.addColorStop(.38, "#172d43");
  g.addColorStop(.39, "#14532d");
  g.addColorStop(1, "#15803d");

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Stadium lights.
  for (let i = 0; i < 4; i++) {
    const x = W * (.1 + i * .27);

    ctx.fillStyle = "#ffffff15";
    ctx.beginPath();
    ctx.arc(x, H * .09, 35, 0, Math.PI * 2);
    ctx.fill();
  }

  // Pitch stripes.
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 ? "#ffffff08" : "#00000008";
    ctx.fillRect(0, H * .44 + i * 55, W, 55);
  }

  // Penalty area.
  ctx.strokeStyle = "#ffffff55";
  ctx.lineWidth = 2;

  ctx.strokeRect(
    goal.x - 35,
    goal.line,
    goal.w + 70,
    115
  );

  ctx.beginPath();
  ctx.arc(W / 2, H * .79, 5, 0, Math.PI * 2);
  ctx.fillStyle = "#fff";
  ctx.fill();
}

function drawGoal() {
  // Net background.
  ctx.fillStyle = "#ffffff10";
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

  ctx.strokeStyle = "#ffffff45";
  ctx.lineWidth = 1;

  for (let i = 1; i < 10; i++) {
    const x = goal.x + goal.w * i / 10;

    ctx.beginPath();
    ctx.moveTo(x, goal.y);
    ctx.lineTo(x, goal.line);
    ctx.stroke();
  }

  for (let i = 1; i < 5; i++) {
    const y = goal.y + goal.h * i / 5;

    ctx.beginPath();
    ctx.moveTo(goal.x, y);
    ctx.lineTo(goal.x + goal.w, y);
    ctx.stroke();
  }

  // Goal frame.
  ctx.strokeStyle = "#f8fafc";
  ctx.lineWidth = 7;
  ctx.lineJoin = "round";

  ctx.beginPath();
  ctx.moveTo(goal.x, goal.line);
  ctx.lineTo(goal.x, goal.y);
  ctx.lineTo(goal.x + goal.w, goal.y);
  ctx.lineTo(goal.x + goal.w, goal.line);
  ctx.stroke();
}

function drawKeeper() {
  const x = keeper.x;
  const y = goal.line;

  const direction = keeper.targetX >= keeper.startX ? 1 : -1;
  const dive = keeper.dive ? keeper.reach : 0;

  ctx.save();

  // Shadow.
  ctx.fillStyle = "#0005";
  ctx.beginPath();
  ctx.ellipse(x, y - 2, 36, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body.
  ctx.fillStyle = "#2563eb";
  ctx.beginPath();
  ctx.roundRect(x - 22, y - 66, 44, 49, 9);
  ctx.fill();

  // Shirt design.
  ctx.fillStyle = "#93c5fd";
  ctx.fillRect(x - 5, y - 62, 10, 38);

  // Legs.
  ctx.strokeStyle = "#172554";
  ctx.lineWidth = 11;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(x - 10, y - 19);
  ctx.lineTo(x - 15, y - 4);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x + 10, y - 19);
  ctx.lineTo(x + 15, y - 4);
  ctx.stroke();

  // Arms.
  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 11;

  const armReach = 20 + dive * 17;

  ctx.beginPath();
  ctx.moveTo(x - 17, y - 52);
  ctx.lineTo(x - 17 - armReach, y - 42);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x + 17, y - 52);
  ctx.lineTo(x + 17 + armReach, y - 42);
  ctx.stroke();

  // Gloves.
  ctx.fillStyle = "#facc15";

  ctx.beginPath();
  ctx.arc(x - 17 - armReach, y - 42, 10, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x + 17 + armReach, y - 42, 10, 0, Math.PI * 2);
  ctx.fill();

  // Head.
  ctx.fillStyle = "#fcd34d";

  ctx.beginPath();
  ctx.arc(x, y - 82, 15, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#111827";

  ctx.beginPath();
  ctx.arc(x - 5, y - 84, 2, 0, Math.PI * 2);
  ctx.arc(x + 5, y - 84, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBall() {
  if (!ball) return;

  const x = ball.x;
  const y = ball.y - ball.z;
  const r = ball.radius;

  // Shadow.
  ctx.fillStyle = "#0005";

  ctx.beginPath();
  ctx.ellipse(x, ball.y + 10, r, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();

  ctx.translate(x, y);
  ctx.rotate(ball.rotation);

  // Ball.
  ctx.fillStyle = "#ffffff";

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#111827";
  ctx.lineWidth = 1.5;

  ctx.beginPath();
  ctx.arc(0, 0, r * .65, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = "#111827";

  ctx.beginPath();
  ctx.arc(0, 0, r * .28, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawAim() {
  if (state !== "aiming") return;

  ctx.save();

  ctx.strokeStyle = "#38bdf8bb";
  ctx.lineWidth = 2;
  ctx.setLineDash([7, 7]);

  ctx.beginPath();
  ctx.moveTo(W / 2, H * .79);
  ctx.lineTo(aimX, aimY);
  ctx.stroke();

  ctx.setLineDash([]);

  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.arc(aimX, aimY, 12, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalAlpha = 1;
}

/* MAIN LOOP */

function update(dt) {
  if (state === "aiming" && pointerDown) {
    powerValue += chargeDirection * 115 * dt;

    if (powerValue >= 100) {
      powerValue = 100;
      chargeDirection = -1;
    }

    if (powerValue <= 0) {
      powerValue = 0;
      chargeDirection = 1;
    }

    $("power").style.width = powerValue + "%";
  }

  if (state === "shooting") {
    updateKeeper(dt);
    updateBall(dt);
  }

  updateResult(dt);
  updateParticles(dt);
}

function draw() {
  drawBackground();
  drawGoal();
  drawKeeper();
  drawAim();
  drawBall();
  drawParticles();
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, .035);

  lastTime = now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

/* BUTTONS */

$("start-btn").addEventListener("click", startGame);
$("restart-btn").addEventListener("click", startGame);

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(loop);

</script>
</body>
  </html>
