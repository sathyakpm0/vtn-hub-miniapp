<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Knife Hit Fruits - Level Up</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 38px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #level-info {
      text-align: right;
    }

    #level-badge {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: inline-block;
      margin-bottom: 4px;
    }

    #knives-left {
      font-size: 13px;
      opacity: 0.8;
    }

    #game-over, #start-screen, #level-banner {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over, #level-banner {
      display: none;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }

    #banner-text {
      font-size: 36px;
      font-weight: 800;
      color: #4ade80;
      text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="level-info">
        <div id="level-badge">Level 1</div>
        <div id="knives-left">Knives: 6</div>
      </div>
    </div>

    <div id="start-screen">
      <h1>Knife Hit Fruits</h1>
      <p>Hit the rotating fruit log with knives!<br>Each level gets faster and harder with reverse spins!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="level-banner">
      <div id="banner-text">LEVEL 2</div>
      <p style="opacity: 0.8; font-size: 16px;">Get Ready for Faster Spin!</p>
    </div>

    <div id="game-over">
      <h2>Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelBadge = document.getElementById('level-badge');
    const knivesLeftEl = document.getElementById('knives-left');
    const gameOverEl = document.getElementById('game-over');
    const levelBanner = document.getElementById('level-banner');
    const bannerText = document.getElementById('banner-text');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('knifeHitLevelBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let level = 1;
    let knivesTotal = 6;
    let knivesLeft = 6;
    let gameState = 'start'; // start, playing, leveling, gameover
    let logAngle = 0;
    let logSpeed = 0.02;
    let stuckKnives = [];
    let activeKnife = null;
    let fruitType = 0; // 0: Watermelon, 1: Orange, 2: Kiwi, 3: Dragonfruit

    const log = {
      x: () => width / 2,
      y: () => height * 0.3,
      radius: 85
    };

    function initLevel() {
      stuckKnives = [];
      // Pre-plant 1 to 3 knives in higher levels to make it significantly tougher!
      let preStuckCount = Math.min(3, Math.floor((level - 1) / 2));
      let lastAngle = 0;
      for (let i = 0; i < preStuckCount; i++) {
        let angle = lastAngle + 0.8 + Math.random() * 0.5;
        stuckKnives.push({ angle: angle });
        lastAngle = angle;
      }

      knivesTotal = 5 + Math.min(6, level);
      knivesLeft = knivesTotal;
      knivesLeftEl.textContent = `Knives: ${knivesLeft}`;
      levelBadge.textContent = `Level ${level}`;

      // Progressive difficulty: Faster speeds and occasional unpredictable direction shifts
      let baseSpeed = 0.022 + (level * 0.007);
      let dir = (level % 2 === 0) ? -1 : 1;
      logSpeed = baseSpeed * dir;
      fruitType = (level - 1) % 4;
    }

    function throwKnife() {
      if (gameState !== 'playing' || activeKnife || knivesLeft <= 0) return;

      knivesLeft--;
      knivesLeftEl.textContent = `Knives: ${knivesLeft}`;

      activeKnife = {
        x: width / 2,
        y: height * 0.78,
        vy: -24
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      throwKnife();
    });

    function update() {
      if (gameState !== 'playing') return;

      // Make higher levels feature erratic speed pulsations or sudden reverse swings!
      let currentSpeed = logSpeed;
      if (level >= 3) {
        // Pulsating speed variation
        currentSpeed += Math.sin(Date.now() * 0.003) * (level * 0.003);
      }
      logAngle += currentSpeed;

      if (activeKnife) {
        activeKnife.y += activeKnife.vy;

        const lx = log.x();
        const ly = log.y();
        const dist = Math.hypot(activeKnife.x - lx, activeKnife.y - ly);

        if (dist <= log.radius + 10) {
          const hitAngle = Math.atan2(activeKnife.y - ly, activeKnife.x - lx) - logAngle;

          // Check knife-to-knife collision (Stricter clearance angle on higher levels)
          let clearance = Math.max(0.22, 0.32 - (level * 0.012));
          let collided = false;
          for (let k of stuckKnives) {
            let diff = Math.abs(k.angle - hitAngle);
            while (diff > Math.PI * 2) diff -= Math.PI * 2;
            if (Math.min(diff, Math.PI * 2 - diff) < clearance) {
              collided = true;
              break;
            }
          }

          if (collided) {
            activeKnife = null;
            setTimeout(gameOver, 300);
            return;
          }

          // Successfully stuck!
          stuckKnives.push({ angle: hitAngle });
          score += 10 * level;
          scoreEl.textContent = score;
          activeKnife = null;

          // Check if current stage/level is cleared
          if (stuckKnives.length >= knivesTotal) {
            triggerLevelUp();
          } else if (knivesLeft <= 0) {
            setTimeout(gameOver, 400);
          }
        }
      }
    }

    function triggerLevelUp() {
      gameState = 'leveling';
      score += 100 * level; // Level completion bonus!
      scoreEl.textContent = score;

      level++;
      bannerText.textContent = `LEVEL ${level} UNLOCKED!`;
      levelBanner.style.display = 'flex';

      setTimeout(() => {
        levelBanner.style.display = 'none';
        initLevel();
        gameState = 'playing';
      }, 1400);
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      const lx = log.x();
      const ly = log.y();

      // Draw Rotating Fruit Log with unique skins per level cycle
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(logAngle);

      if (fruitType === 0) {
        // Watermelon Style
        ctx.beginPath();
        ctx.arc(0, 0, log.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#16a34a';
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#15803d';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, log.radius - 12, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();
      } else if (fruitType === 1) {
        // Orange Style
        ctx.beginPath();
        ctx.arc(0, 0, log.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#f97316';
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#c2410c';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, log.radius - 12, 0, Math.PI * 2);
        ctx.fillStyle = '#fb923c';
        ctx.fill();
      } else if (fruitType === 2) {
        // Kiwi Style
        ctx.beginPath();
        ctx.arc(0, 0, log.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#78350f';
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#451a03';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, log.radius - 12, 0, Math.PI * 2);
        ctx.fillStyle = '#84cc16';
        ctx.fill();
      } else {
        // Dragonfruit Style
        ctx.beginPath();
        ctx.arc(0, 0, log.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#db2777';
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#9d174d';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, log.radius - 12, 0, Math.PI * 2);
        ctx.fillStyle = '#f43f5e';
        ctx.fill();
      }

      // Center core details
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#fef08a';
      ctx.fill();

      // Draw stuck knives
      stuckKnives.forEach(k => {
        ctx.save();
        ctx.rotate(k.angle);
        ctx.translate(log.radius - 2, 0);
        ctx.rotate(Math.PI / 2);

        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(-3, -32, 6, 32);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-4, 0, 8, 18);

        ctx.restore();
      });

      ctx.restore();

      // Draw active flying knife
      if (activeKnife) {
        ctx.save();
        ctx.translate(activeKnife.x, activeKnife.y);
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-3, -26, 6, 32);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-4, 6, 8, 18);
        ctx.restore();
      }

      // Draw standby knife at bottom
      if (!activeKnife && gameState === 'playing') {
        ctx.save();
        ctx.translate(width / 2, height * 0.78);
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-3, -26, 6, 32);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-4, 6, 8, 18);
        ctx.restore();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      score = 0;
      scoreEl.textContent = '0';
      level = 1;
      initLevel();
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      levelBanner.style.display = 'none';
    }

    function gameOver() {
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('knifeHitLevelBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
