<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Penalty Shootout</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #0f172a 0%, #1e293b 60%, #166534 60%, #15803d 100%);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 36px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #shots {
      font-size: 16px;
      opacity: 0.9;
      text-align: right;
    }

    #message {
      position: absolute;
      top: 45%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    #power-bar-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      max-width: 280px;
      height: 14px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      overflow: hidden;
      z-index: 10;
      display: none;
    }

    #power-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #22c55e, #eab308, #ef4444);
      border-radius: 20px;
      transition: none;
    }

    #instruction {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 15px;
      opacity: 0.8;
      z-index: 10;
      pointer-events: none;
    }

    #game-over, #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #start-screen {
      display: flex;
    }

    h1, h2 {
      font-size: 32px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="shots">Shot 1/5</div>
    </div>

    <div id="message"></div>
    <div id="instruction">Hold & drag to aim, release to shoot</div>

    <div id="power-bar-container">
      <div id="power-bar"></div>
    </div>

    <div id="start-screen">
      <h1>Penalty Shootout</h1>
      <p>Drag to aim left/right and set power.<br>Beat the goalkeeper!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="game-over">
      <h2>Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const shotsEl = document.getElementById('shots');
    const messageEl = document.getElementById('message');
    const instructionEl = document.getElementById('instruction');
    const powerBarContainer = document.getElementById('power-bar-container');
    const powerBar = document.getElementById('power-bar');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('penaltyBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let shotNumber = 1;
    let maxShots = 5;
    let gameState = 'start'; // start | aiming | shooting | result | gameover
    let ball = null;
    let keeper = { x: 0, y: 0, targetX: 0, width: 70, height: 90, diving: false };
    let aimX = 0;
    let power = 0;
    let powerDirection = 1;
    let isHolding = false;
    let resultTimer = 0;

    // Goal dimensions
    let goal = {};

    function setupGoal() {
      const goalWidth = Math.min(width * 0.75, 340);
      const goalHeight = 130;
      goal = {
        x: (width - goalWidth) / 2,
        y: height * 0.22,
        width: goalWidth,
        height: goalHeight
      };
      keeper.x = width / 2;
      keeper.y = goal.y + goal.height - 20;
    }

    function resetBall() {
      ball = {
        x: width / 2,
        y: height * 0.78,
        radius: 16,
        vx: 0,
        vy: 0,
        moving: false
      };
      aimX = width / 2;
      power = 0;
      powerDirection = 1;
      keeper.diving = false;
      keeper.targetX = width / 2;
      isHolding = false;
      powerBarContainer.style.display = 'none';
      instructionEl.style.opacity = '0.8';
      messageEl.style.opacity = '0';
    }

    // ========== Drawing ==========
    function drawPitch() {
      // Grass already in background

      // Penalty area lines
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;

      // Goal box
      ctx.strokeRect(goal.x - 30, goal.y + goal.height, goal.width + 60, 70);

      // Penalty spot
      ctx.beginPath();
      ctx.arc(width / 2, height * 0.78, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fill();
    }

    function drawGoal() {
      // Goal frame
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(goal.x, goal.y + goal.height);
      ctx.lineTo(goal.x, goal.y);
      ctx.lineTo(goal.x + goal.width, goal.y);
      ctx.lineTo(goal.x + goal.width, goal.y + goal.height);
      ctx.stroke();

      // Net
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1.5;
      for (let i = 1; i < 8; i++) {
        const x = goal.x + (goal.width / 8) * i;
        ctx.beginPath();
        ctx.moveTo(x, goal.y);
        ctx.lineTo(x, goal.y + goal.height);
        ctx.stroke();
      }
      for (let i = 1; i < 5; i++) {
        const y = goal.y + (goal.height / 5) * i;
        ctx.beginPath();
        ctx.moveTo(goal.x, y);
        ctx.lineTo(goal.x + goal.width, y);
        ctx.stroke();
      }
    }

    function drawKeeper() {
      const kx = keeper.x;
      const ky = keeper.y;

      // Body
      ctx.fillStyle = '#1e40af';
      ctx.beginPath();
      ctx.roundRect(kx - 22, ky - 55, 44, 50, 8);
      ctx.fill();

      // Head
      ctx.beginPath();
      ctx.arc(kx, ky - 68, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#fcd34d';
      ctx.fill();

      // Arms
      ctx.strokeStyle = '#1e40af';
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';

      if (keeper.diving) {
        // Diving pose
        const dir = keeper.targetX > width / 2 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(kx - 15, ky - 40);
        ctx.lineTo(kx - 40 * dir, ky - 25);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(kx + 15, ky - 40);
        ctx.lineTo(kx + 35 * dir, ky - 15);
        ctx.stroke();
      } else {
        // Ready pose
        ctx.beginPath();
        ctx.moveTo(kx - 18, ky - 40);
        ctx.lineTo(kx - 35, ky - 20);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(kx + 18, ky - 40);
        ctx.lineTo(kx + 35, ky - 20);
        ctx.stroke();
      }

      // Gloves
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(kx - (keeper.diving ? 40 * (keeper.targetX > width/2 ? 1 : -1) : 35), 
              ky - (keeper.diving ? 25 : 20), 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(kx + (keeper.diving ? 35 * (keeper.targetX > width/2 ? 1 : -1) : 35), 
              ky - (keeper.diving ? 15 : 20), 9, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBall() {
      if (!ball) return;

      // Shadow
      ctx.beginPath();
      ctx.ellipse(ball.x, ball.y + 12, ball.radius * 0.9, 6, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fill();

      // Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();

      // Ball pattern
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius * 0.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ball.x, ball.y - ball.radius);
      ctx.lineTo(ball.x, ball.y + ball.radius);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ball.x - ball.radius, ball.y);
      ctx.lineTo(ball.x + ball.radius, ball.y);
      ctx.stroke();
    }

    function drawAim() {
      if (gameState !== 'aiming' && gameState !== 'shooting') return;

      // Aim line
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(width / 2, height * 0.78);
      ctx.lineTo(aimX, goal.y + goal.height * 0.6);
      ctx.stroke();
      ctx.setLineDash([]);

      // Aim target
      ctx.beginPath();
      ctx.arc(aimX, goal.y + goal.height * 0.55, 12, 0, Math.PI * 2);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // ========== Game Logic ==========
    function startAiming() {
      gameState = 'aiming';
      resetBall();
      shotsEl.textContent = `Shot \( {shotNumber}/ \){maxShots}`;
      powerBarContainer.style.display = 'block';
    }

    function shoot() {
      if (gameState !== 'aiming') return;
      gameState = 'shooting';
      isHolding = false;
      powerBarContainer.style.display = 'none';
      instructionEl.style.opacity = '0';

      // Calculate direction & power
      const targetX = aimX;
      const targetY = goal.y + goal.height * 0.5;
      const dx = targetX - ball.x;
      const dy = targetY - ball.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      const speed = 9 + (power / 100) * 11;
      ball.vx = (dx / dist) * speed;
      ball.vy = (dy / dist) * speed;
      ball.moving = true;

      // Goalkeeper decides where to dive
      setTimeout(() => {
        const diveChance = 0.65; // 65% chance to dive correct side
        const ballGoingLeft = targetX < width / 2;
        const correctDive = Math.random() < diveChance;

        if (correctDive) {
          keeper.targetX = ballGoingLeft ? goal.x + 40 : goal.x + goal.width - 40;
        } else {
          keeper.targetX = ballGoingLeft ? goal.x + goal.width - 40 : goal.x + 40;
        }
        keeper.diving = true;
      }, 80);
    }

    function checkGoal() {
      if (!ball.moving) return;

      // Move ball
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.vy += 0.12; // slight gravity

      // Move keeper toward target
      if (keeper.diving) {
        keeper.x += (keeper.targetX - keeper.x) * 0.14;
      }

      // Check if ball reached goal area
      if (ball.y < goal.y + goal.height + 10) {
        ball.moving = false;

        // Did it go in?
        const inGoalX = ball.x > goal.x + 8 && ball.x < goal.x + goal.width - 8;
        const saved = Math.abs(ball.x - keeper.x) < 48 && ball.y > goal.y + 20;

        if (inGoalX && !saved) {
          // GOAL!
          score++;
          scoreEl.textContent = score;
          showMessage('GOAL!', '#4ade80');
        } else if (saved) {
          showMessage('SAVED!', '#f87171');
        } else {
          showMessage('MISS!', '#f87171');
        }

        gameState = 'result';
        resultTimer = 1.3;
      }
    }

    function showMessage(text, color) {
      messageEl.textContent = text;
      messageEl.style.color = color;
      messageEl.style.opacity = '1';
    }

    function nextShot() {
      shotNumber++;
      if (shotNumber > maxShots) {
        endGame();
      } else {
        startAiming();
      }
    }

    function endGame() {
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('penaltyBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score + ' / 5';
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    // ========== Input ==========
    function getPos(e) {
      if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function startHold(e) {
      e.preventDefault();
      if (gameState !== 'aiming') return;
      isHolding = true;
    }

    function moveHold(e) {
      e.preventDefault();
      if (!isHolding || gameState !== 'aiming') return;
      const pos = getPos(e);

      // Aim left-right based on horizontal position
      const minX = goal.x + 20;
      const maxX = goal.x + goal.width - 20;
      aimX = Math.max(minX, Math.min(maxX, pos.x));
    }

    function endHold(e) {
      e.preventDefault();
      if (!isHolding || gameState !== 'aiming') return;
      shoot();
    }

    canvas.addEventListener('mousedown', startHold);
    canvas.addEventListener('mousemove', moveHold);
    canvas.addEventListener('mouseup', endHold);
    canvas.addEventListener('mouseleave', endHold);

    canvas.addEventListener('touchstart', startHold, { passive: false });
    canvas.addEventListener('touchmove', moveHold, { passive: false });
    canvas.addEventListener('touchend', endHold);

    // ========== Loop ==========
    function update(dt) {
      if (gameState === 'aiming' && isHolding) {
        // Power bar oscillates
        power += powerDirection * 1.8;
        if (power >= 100) { power = 100; powerDirection = -1; }
        if (power <= 0) { power = 0; powerDirection = 1; }
        powerBar.style.width = power + '%';
      }

      if (gameState === 'shooting') {
        checkGoal();
      }

      if (gameState === 'result') {
        resultTimer -= dt;
        if (resultTimer <= 0) {
          messageEl.style.opacity = '0';
          nextShot();
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      drawPitch();
      drawGoal();
      drawKeeper();
      drawAim();
      drawBall();
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      score = 0;
      scoreEl.textContent = '0';
      shotNumber = 1;
      setupGoal();
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      startAiming();
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    setupGoal();
    requestAnimationFrame(loop);
  </script>
</body>
  </html>
