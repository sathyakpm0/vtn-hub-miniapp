<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stack Tower</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #0f172a, #1e293b);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
    }

    #score {
      font-size: 42px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 14px;
      text-align: center;
      opacity: 0.7;
      margin-top: 4px;
    }

    #instruction {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 16px;
      opacity: 0.8;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #game-over {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 16px;
      opacity: 0.8;
      margin-bottom: 24px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    .perfect {
      position: absolute;
      color: #4ade80;
      font-weight: 700;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 15;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div id="score">0</div>
      <div id="best">Best: 0</div>
    </div>

    <div id="instruction">Tap to drop the block</div>

    <div id="game-over">
      <h2>Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    // ========== Telegram Mini App ==========
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    // ========== Canvas Setup ==========
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const instructionEl = document.getElementById('instruction');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // ========== Game Variables ==========
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('stackTowerBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let blocks = [];
    let currentBlock = null;
    let gameState = 'playing'; // playing | gameover
    let speed = 2.2;
    let direction = 1;
    let cameraY = 0;

    const BLOCK_HEIGHT = 28;
    const COLORS = [
      '#38bdf8', '#818cf8', '#c084fc', '#f472b6',
      '#fb7185', '#fb923c', '#facc15', '#4ade80'
    ];

    // ========== Init ==========
    function init() {
      score = 0;
      scoreEl.textContent = '0';
      blocks = [];
      cameraY = 0;
      gameState = 'playing';
      gameOverEl.style.display = 'none';
      instructionEl.style.opacity = '1';
      speed = 2.2;

      // Base block
      const baseWidth = Math.min(width * 0.55, 220);
      blocks.push({
        x: (width - baseWidth) / 2,
        y: height - 120,
        width: baseWidth,
        color: COLORS[0]
      });

      spawnBlock();
    }

    function spawnBlock() {
      const last = blocks[blocks.length - 1];
      const newWidth = last.width;
      currentBlock = {
        x: direction > 0 ? -newWidth : width,
        y: last.y - BLOCK_HEIGHT - 8,
        width: newWidth,
        color: COLORS[blocks.length % COLORS.length],
        moving: true
      };
    }

    // ========== Game Loop ==========
    function update() {
      if (gameState !== 'playing' || !currentBlock) return;

      // Move current block
      currentBlock.x += speed * direction;

      // Bounce
      if (currentBlock.x + currentBlock.width > width + 40) direction = -1;
      if (currentBlock.x < -40) direction = 1;

      // Camera follow (smooth)
      const targetCamera = Math.max(0, (height - 180) - currentBlock.y);
      cameraY += (targetCamera - cameraY) * 0.08;
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Draw all placed blocks
      blocks.forEach(block => {
        drawBlock(block.x, block.y + cameraY, block.width, BLOCK_HEIGHT, block.color);
      });

      // Draw current moving block
      if (currentBlock) {
        drawBlock(currentBlock.x, currentBlock.y + cameraY, currentBlock.width, BLOCK_HEIGHT, currentBlock.color);
      }
    }

    function drawBlock(x, y, w, h, color) {
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x + 4, y + 6, w, h);

      // Main block
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 6);
      ctx.fill();

      // Top highlight
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(x, y, w, 6);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // ========== Drop Logic ==========
    function dropBlock() {
      if (gameState !== 'playing' || !currentBlock || !currentBlock.moving) return;

      currentBlock.moving = false;
      instructionEl.style.opacity = '0';

      const last = blocks[blocks.length - 1];

      // Calculate overlap
      const left = Math.max(currentBlock.x, last.x);
      const right = Math.min(currentBlock.x + currentBlock.width, last.x + last.width);
      const overlap = right - left;

      if (overlap <= 0) {
        // Completely missed
        gameOver();
        return;
      }

      // Perfect check (within 6px)
      const isPerfect = Math.abs(currentBlock.x - last.x) < 6 && 
                       Math.abs((currentBlock.x + currentBlock.width) - (last.x + last.width)) < 6;

      if (isPerfect) {
        // Perfect placement
        currentBlock.x = last.x;
        currentBlock.width = last.width;
        showPerfect();
        score += 2; // bonus
      } else {
        // Cut the block
        currentBlock.x = left;
        currentBlock.width = overlap;
        score += 1;
      }

      scoreEl.textContent = score;
      blocks.push({ ...currentBlock });

      // Increase speed slightly
      speed = Math.min(speed + 0.08, 4.5);

      // Next block
      setTimeout(() => {
        if (gameState === 'playing') spawnBlock();
      }, 180);
    }

    function showPerfect() {
      const el = document.createElement('div');
      el.className = 'perfect';
      el.textContent = 'PERFECT!';
      el.style.left = (width / 2 - 40) + 'px';
      el.style.top = (height / 2 - 40) + 'px';
      document.getElementById('game-container').appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function gameOver() {
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('stackTowerBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    // ========== Controls ==========
    function handleInput(e) {
      e.preventDefault();
      if (gameState === 'playing') {
        dropBlock();
      }
    }

    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', handleInput, { passive: false });
    restartBtn.addEventListener('click', init);

    // Start
    init();
    loop();
  </script>
</body>
</html>
