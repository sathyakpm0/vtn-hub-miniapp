<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Car Race - Timed Levels</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: #1e293b;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 38px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #level-info {
      text-align: right;
    }

    #level-badge {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: inline-block;
      margin-bottom: 4px;
    }

    #level-timer {
      font-size: 15px;
      font-weight: 700;
      color: #f87171;
    }

    #game-over, #start-screen, #level-banner {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over, #level-banner {
      display: none;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }

    #banner-text {
      font-size: 36px;
      font-weight: 800;
      color: #4ade80;
      text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="level-info">
        <div id="level-badge">Level 1</div>
        <div id="level-timer">Time: 25s</div>
      </div>
    </div>

    <div id="start-screen">
      <h1>Car Race</h1>
      <p>Tap left or right side to steer!<br>Survive and beat the timer on increasingly fast highway traffic!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="level-banner">
      <div id="banner-text">LEVEL 2</div>
      <p style="opacity: 0.8; font-size: 16px;">Traffic speeds up! Beat the timer!</p>
    </div>

    <div id="game-over">
      <h2 id="game-over-title">Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelBadge = document.getElementById('level-badge');
    const levelTimerEl = document.getElementById('level-timer');
    const gameOverEl = document.getElementById('game-over');
    const gameOverTitle = document.getElementById('game-over-title');
    const levelBanner = document.getElementById('level-banner');
    const bannerText = document.getElementById('banner-text');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('carRaceBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let level = 1;
    let timeLeft = 25;
    let levelDistance = 0;
    let targetDistance = 300; // Target distance to clear level
    let gameState = 'start';
    let roadAnim = 0;

    let player = {
      x: width / 2,
      y: height - 140,
      width: 44,
      height: 80,
      speed: 0
    };

    let obstacles = [];
    let spawnTimer = 0;
    let steering = 0; // -1 left, 1 right, 0 straight

    function initGame() {
      score = 0;
      level = 1;
      scoreEl.textContent = '0';
      setupLevel();
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      levelBanner.style.display = 'none';
    }

    function setupLevel() {
      levelDistance = 0;
      timeLeft = Math.max(15, 28 - (level * 2));
      targetDistance = 250 + (level * 70);
      levelBadge.textContent = `Level ${level}`;
      obstacles = [];
      player.x = width / 2;
    }

    // Touch controls: left vs right side steering
    window.addEventListener('pointerdown', (e) => {
      if (gameState !== 'playing') return;
      if (e.clientX < width / 2) {
        steering = -1;
      } else {
        steering = 1;
      }
    });

    window.addEventListener('pointerup', () => {
      steering = 0;
    });

    // Timer interval
    setInterval(() => {
      if (gameState === 'playing') {
        timeLeft--;
        levelTimerEl.textContent = `Time: ${timeLeft}s`;
        if (timeLeft <= 0) {
          gameOver("Time's Up!");
        }
      }
    }, 1000);

    function update() {
      if (gameState !== 'playing') return;

      // Road boundaries (3-lane highway simulation)
      let roadLeft = width / 2 - 130;
      let roadRight = width / 2 + 130;

      // Steer player car
      player.x += steering * (6 + level * 0.8);
      if (player.x < roadLeft + 25) player.x = roadLeft + 25;
      if (player.x > roadRight - 25) player.x = roadRight - 25;

      // Road lines animation
      let roadSpeed = 7 + (level * 2);
      roadAnim = (roadAnim + roadSpeed) % 40;

      // Distance progress
      levelDistance += roadSpeed * 0.1;
      score = (level - 1) * 300 + Math.floor(levelDistance * 10);
      scoreEl.textContent = score;

      if (levelDistance >= targetDistance) {
        triggerLevelUp();
      }

      // Spawn traffic obstacles
      spawnTimer++;
      let spawnInterval = Math.max(35, 75 - (level * 8));
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        let lanes = [roadLeft + 45, width / 2, roadRight - 45];
        let laneX = lanes[Math.floor(Math.random() * lanes.length)];
        obstacles.push({
          x: laneX,
          y: -100,
          width: 44,
          height: 80,
          speed: roadSpeed * 0.55 + Math.random() * 2,
          color: ['#ef4444', '#38bdf8', '#eab308', '#a855f7'][Math.floor(Math.random() * 4)]
        });
      }

      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += roadSpeed + obs.speed;

        // Collision check
        if (
          player.x - player.width / 2 < obs.x + obs.width / 2 &&
          player.x + player.width / 2 > obs.x - obs.width / 2 &&
          player.y - player.height / 2 < obs.y + obs.height / 2 &&
          player.y + player.height / 2 > obs.y - obs.height / 2
        ) {
          gameOver("Crash!");
        }

        if (obs.y > height + 100) {
          obstacles.splice(i, 1);
        }
      }
    }

    function triggerLevelUp() {
      gameState = 'leveling';
      level++;
      bannerText.textContent = `LEVEL ${level} UNLOCKED!`;
      levelBanner.style.display = 'flex';

      setTimeout(() => {
        levelBanner.style.display = 'none';
        setupLevel();
        gameState = 'playing';
      }, 1500);
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      let roadLeft = width / 2 - 130;
      let roadRight = width / 2 + 130;

      // Grass background
      ctx.fillStyle = '#065f46';
      ctx.fillRect(0, 0, width, height);

      // Asphalt Road
      ctx.fillStyle = '#334155';
      ctx.fillRect(roadLeft, 0, roadRight - roadLeft, height);

      // Road side borders
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(roadLeft, 0, 8, height);
      ctx.fillRect(roadRight - 8, 0, 8, height);

      // Center dashed lines
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 6;
      ctx.setLineDash([25, 25]);
      ctx.lineDashOffset = -roadAnim;
      ctx.beginPath();
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw obstacles (traffic cars)
      obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        ctx.fillStyle = obs.color;
        ctx.beginPath();
        ctx.roundRect(-obs.width / 2, -obs.height / 2, obs.width, obs.height, 10);
        ctx.fill();
        // Windshield
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-obs.width / 2 + 6, -obs.height / 2 + 12, obs.width - 12, 16);
        ctx.restore();
      });

      // Draw Player Car
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(-player.width / 2, -player.height / 2, player.width, player.height, 10);
      ctx.fill();
      // Windshield
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-player.width / 2 + 6, -player.height / 2 + 12, player.width - 12, 16);
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver(reason) {
      gameState = 'gameover';
      gameOverTitle.textContent = reason === "Time's Up!" ? "Time's Up!" : "Car Crashed!";
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('carRaceBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
