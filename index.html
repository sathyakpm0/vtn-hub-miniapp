<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Master Fruit Blade - Deluxe</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0d0705;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #fff;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD UI */
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 20px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
    }

    #score {
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
      color: #facc15;
      text-shadow: 0 0 16px rgba(250, 204, 21, 0.5);
    }

    #best {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Center Timer & Strikes */
    #center-hud {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      z-index: 10;
    }

    #timer-badge {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 18px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #timer-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94a3b8;
    }

    #timer {
      font-size: 28px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #38bdf8;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
      transition: color 0.3s;
    }

    #timer.warning {
      color: #ef4444 !important;
      animation: pulseAlert 1s infinite alternate;
    }

    /* Strikes Indicator */
    #strikes-container {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .strike-slot {
      width: 32px;
      height: 32px;
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid rgba(239, 68, 68, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      filter: grayscale(1) opacity(0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .strike-slot.active {
      filter: grayscale(0) opacity(1);
      background: rgba(239, 68, 68, 0.35);
      border-color: #ef4444;
      box-shadow: 0 0 14px #ef4444;
      transform: scale(1.15);
      animation: strikePop 0.4s ease-out;
    }

    @keyframes strikePop {
      0% { transform: scale(0.5); }
      60% { transform: scale(1.35); }
      100% { transform: scale(1.15); }
    }

    @keyframes pulseAlert {
      from { transform: scale(1); filter: drop-shadow(0 0 4px #ef4444); }
      to { transform: scale(1.08); filter: drop-shadow(0 0 16px #ef4444); }
    }

    #combo-box {
      font-size: 26px;
      font-weight: 900;
      font-style: italic;
      color: #4ade80;
      text-shadow: 0 0 18px rgba(74, 222, 128, 0.9), 0 2px 6px #000;
      opacity: 0;
      transform: scale(0.8) rotate(-6deg);
      transition: opacity 0.2s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      padding: 6px 12px;
    }

    #combo-box.show {
      opacity: 1;
      transform: scale(1.15) rotate(-6deg);
    }

    /* Screen Modals */
    .screen-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(35, 17, 10, 0.94) 0%, rgba(10, 5, 3, 0.98) 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      gap: 14px;
      backdrop-filter: blur(10px);
    }

    #start-screen {
      display: flex;
    }

    h1 {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fef08a 0%, #f97316 45%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.9));
      text-align: center;
      line-height: 1.1;
    }

    h2 {
      font-size: 38px;
      font-weight: 900;
      color: #f87171;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(248, 113, 113, 0.6);
    }

    #game-over-reason {
      font-size: 16px;
      font-weight: 700;
      color: #fca5a5;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .badge {
      display: inline-block;
      padding: 6px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #38bdf8;
      font-weight: 700;
    }

    .rules-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 22px;
      border-radius: 16px;
      font-size: 14px;
      color: #e2e8f0;
      text-align: center;
      line-height: 1.7;
      max-width: 320px;
      margin: 8px 0;
    }

    .rules-card b {
      color: #facc15;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 40px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 6px;
    }

    #final-score {
      font-size: 54px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 25px rgba(250, 204, 21, 0.6);
    }

    #best-score-text {
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .btn {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #fff;
      border: none;
      padding: 16px 50px;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 10px 25px rgba(234, 88, 12, 0.45), inset 0 2px 4px rgba(255,255,255,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div class="score-box">
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="combo-box">Combo x3</div>
    </div>

    <div id="center-hud">
      <div id="timer-badge">
        <div id="timer-label">Time Remaining</div>
        <div id="timer">03:00</div>
      </div>
      <div id="strikes-container">
        <div class="strike-slot" id="strike-1">💣</div>
        <div class="strike-slot" id="strike-2">💣</div>
        <div class="strike-slot" id="strike-3">💣</div>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-overlay">
      <div class="badge">Arcade 3-Minute Challenge</div>
      <h1>Fruit Ninja</h1>
      <div class="rules-card">
        • Swipe blade to slice flying fruit.<br>
        • Multiple fruit in 1 cut triggers <b>Combos</b>!<br>
        • ⚠️ <b>BOMBS:</b> High Danger! Slice <b>3 Bombs</b> and you are <b>OUT</b>!
      </div>
      <button id="start-btn" class="btn">Play 3 Mins</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="screen-overlay">
      <h2>Game Over</h2>
      <div id="game-over-reason">3 Bombs Sliced!</div>
      <div class="stat-card">
        <div id="final-score">0</div>
        <div id="best-score-text">Best: 0</div>
      </div>
      <button id="restart-btn" class="btn">Try Again</button>
    </div>
  </div>

  <script>
    // --- Telegram WebApp Integration & Haptics ---
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0d0705');
      tg.setBackgroundColor('#0d0705');
    }

    function triggerHaptic(type = 'medium') {
      try {
        if (tg?.HapticFeedback) {
          if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
          else if (type === 'light') tg.HapticFeedback.impactOccurred('light');
          else tg.HapticFeedback.impactOccurred('medium');
        } else if (navigator.vibrate) {
          navigator.vibrate(type === 'heavy' ? [40, 60, 40] : 18);
        }
      } catch (e) {}
    }

    // --- Procedural Web Audio Engine ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playSwoosh() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.11);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      },
      playSlice(comboLevel = 1) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.12;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1500 + comboLevel * 180, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);

        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'triangle';
        const baseFreq = 540 + (comboLevel * 110);
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.09);
        oscGain.gain.setValueAtTime(0.2, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      },
      playBomb() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(22, now + 0.65);
        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.7);
      }
    };

    // --- Canvas & DOM ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const comboEl = document.getElementById('combo-box');
    const timerEl = document.getElementById('timer');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const gameOverReasonEl = document.getElementById('game-over-reason');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Game Settings ---
    const ROUND_TIME = 180; // 3 minutes = 180s
    const MAX_STRIKES = 3;  // Game over after 3 bombs
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('ninjaBladeBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let fruits = [];
    let fruitHalves = [];
    let splatters = [];
    let particles = [];
    let fuseSparks = [];
    let floatTexts = [];
    let bladePath = [];
    let gameState = 'start';
    let timeLeft = ROUND_TIME;
    let bombStrikes = 0;
    let combo = 0;
    let lastSliceTime = 0;
    let spawnTimer = 0;
    let gameTime = 0;
    let screenShake = 0;
    let flashScreenAlpha = 0;

    // --- Fruit Definitions ---
    const FRUIT_PRESETS = [
      { name: 'watermelon', radius: 46, points: 1, skinColor: '#22c55e', fleshColor: '#ef4444' },
      { name: 'orange', radius: 40, points: 1, skinColor: '#f97316', fleshColor: '#fb923c' },
      { name: 'apple', radius: 38, points: 1, skinColor: '#dc2626', fleshColor: '#fef08a' },
      { name: 'banana', radius: 36, points: 2, skinColor: '#eab308', fleshColor: '#fef9c3' },
      { name: 'coconut', radius: 42, points: 2, skinColor: '#78350f', fleshColor: '#f8fafc' },
      { name: 'dragonfruit', radius: 44, points: 3, skinColor: '#db2777', fleshColor: '#fdf2f8' },
      { name: 'bomb', radius: 42, points: 0, isBomb: true }
    ];

    // --- Warm Polished Wooden Dojo Background ---
    function drawBackground() {
      // Wood Floor Boards
      const slatHeight = 72;
      const totalSlats = Math.ceil(height / slatHeight);

      for (let i = 0; i < totalSlats; i++) {
        const y = i * slatHeight;
        const grad = ctx.createLinearGradient(0, y, 0, y + slatHeight);
        grad.addColorStop(0, i % 2 === 0 ? '#26160d' : '#1f110a');
        grad.addColorStop(0.5, i % 2 === 0 ? '#2c1a10' : '#24140c');
        grad.addColorStop(1, '#150a06');
        ctx.fillStyle = grad;
        ctx.fillRect(0, y, width, slatHeight);

        // Wood seam
        ctx.strokeStyle = '#0a0402';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(0, y, width, slatHeight);
      }

      // Overhead warm lantern spotlight
      const lanternGlow = ctx.createRadialGradient(width / 2, height * 0.15, 30, width / 2, height * 0.4, width * 0.75);
      lanternGlow.addColorStop(0, 'rgba(251, 146, 60, 0.15)');
      lanternGlow.addColorStop(0.6, 'rgba(0, 0, 0, 0.35)');
      lanternGlow.addColorStop(1, 'rgba(0, 0, 0, 0.85)');
      ctx.fillStyle = lanternGlow;
      ctx.fillRect(0, 0, width, height);

      // Splatters on floor
      splatters.forEach(s => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rotation);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, s.rx, s.ry, 0, 0, Math.PI * 2);
        ctx.fill();

        s.drops.forEach(d => {
          ctx.beginPath();
          ctx.arc(d.dx, d.dy, d.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      });
      ctx.globalAlpha = 1;
    }

    // --- HIGH-VISIBILITY BOMB DRAWING ---
    function drawBomb(f) {
      ctx.save();
      ctx.translate(f.x, f.y);

      const t = performance.now() * 0.008;
      const pulse = 0.5 + 0.5 * Math.sin(t * 5);

      // 1. Bright Pulsing Danger Aura (Very easy to spot)
      ctx.beginPath();
      ctx.arc(0, 0, f.radius + 16 + pulse * 6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(239, 68, 68, ${0.25 + pulse * 0.25})`;
      ctx.fill();

      // Warning glowing ring
      ctx.strokeStyle = `rgba(251, 191, 36, ${0.5 + pulse * 0.5})`;
      ctx.lineWidth = 3;
      ctx.stroke();

      // 2. High-contrast Metallic Bomb Sphere
      ctx.rotate(f.rotation);
      ctx.beginPath();
      ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
      const bombGrad = ctx.createRadialGradient(-12, -12, 4, 0, 0, f.radius);
      bombGrad.addColorStop(0, '#64748b');
      bombGrad.addColorStop(0.5, '#1e293b');
      bombGrad.addColorStop(1, '#020617');
      ctx.fillStyle = bombGrad;
      ctx.fill();

      // Bright danger rim-light
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#ef4444';
      ctx.stroke();

      // 3. Metallic Neck/Cap
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(-9, -f.radius - 7, 18, 8);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-9, -f.radius - 7, 18, 8);

      // 4. Burning Fuse
      ctx.beginPath();
      ctx.moveTo(0, -f.radius - 7);
      ctx.quadraticCurveTo(16, -f.radius - 24, 12, -f.radius - 34);
      ctx.strokeStyle = '#ea580c';
      ctx.lineWidth = 4.5;
      ctx.stroke();

      // 5. Bright Burning Fuse Head
      const sparkX = 12;
      const sparkY = -f.radius - 34;
      ctx.beginPath();
      ctx.arc(sparkX, sparkY, 7 + pulse * 3, 0, Math.PI * 2);
      ctx.fillStyle = '#fde047';
      ctx.shadowColor = '#f97316';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;

      // 6. Glowing Hazard / Skull Symbol
      ctx.fillStyle = '#facc15';
      ctx.shadowColor = '#f97316';
      ctx.shadowBlur = 10;
      ctx.font = '900 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('☠', 0, 3);
      ctx.shadowBlur = 0;

      ctx.restore();
    }

    // --- DRAW WHOLE GLOSSY FRUITS ---
    function drawFruit(f) {
      if (f.isBomb) {
        drawBomb(f);
        return;
      }

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rotation);

      const rad = f.radius;

      // Outer Fruit Body
      ctx.beginPath();
      ctx.arc(0, 0, rad, 0, Math.PI * 2);
      const skinGrad = ctx.createRadialGradient(-rad * 0.35, -rad * 0.35, rad * 0.08, 0, 0, rad);
      skinGrad.addColorStop(0, '#ffffff40');
      skinGrad.addColorStop(0.35, f.skinColor);
      skinGrad.addColorStop(1, '#00000045');
      ctx.fillStyle = skinGrad;
      ctx.fill();

      // Fruit Details
      if (f.name === 'watermelon') {
        ctx.strokeStyle = '#14532d';
        ctx.lineWidth = 6;
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.moveTo(i * 14, -rad + 3);
          ctx.quadraticCurveTo(i * 18 + 5, 0, i * 14, rad - 3);
          ctx.stroke();
        }
      } else if (f.name === 'apple') {
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-2.5, -rad - 10, 5, 12);
        ctx.beginPath();
        ctx.ellipse(8, -rad - 8, 10, 5, 0.4, 0, Math.PI * 2);
        ctx.fillStyle = '#4ade80';
        ctx.fill();
      } else if (f.name === 'banana') {
        ctx.strokeStyle = '#ca8a04';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, rad * 0.65, -0.6, 1.4);
        ctx.stroke();
      }

      // Realistic 3D Specular Sheen
      ctx.beginPath();
      ctx.ellipse(-rad * 0.35, -rad * 0.35, rad * 0.32, rad * 0.18, -0.6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fill();

      ctx.restore();
    }

    // --- DRAW SLICED FRUIT HALF ---
    function drawFruitHalf(h) {
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rotation);

      const r = h.radius;
      // Outer peel semi-circle
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI, false);
      ctx.closePath();
      ctx.fillStyle = h.skinColor;
      ctx.fill();

      // Inner juicy flesh
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.88, 0, Math.PI, false);
      ctx.closePath();
      ctx.fillStyle = h.fleshColor;
      ctx.fill();

      // Sliced inner seeds & pulp
      if (h.name === 'watermelon') {
        ctx.fillStyle = '#1e293b';
        [[-r * 0.45, 10], [0, 16], [r * 0.45, 10], [-r * 0.22, 22], [r * 0.22, 22]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.ellipse(sx, sy, 2.5, 4.5, 0.2, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (h.name === 'orange') {
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1.5;
        for (let a = 1; a < 6; a++) {
          const ang = (Math.PI / 6) * a;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ang) * (r * 0.85), Math.sin(ang) * (r * 0.85));
          ctx.stroke();
        }
      } else if (h.name === 'apple') {
        ctx.fillStyle = '#ca8a04';
        ctx.beginPath();
        ctx.ellipse(0, 8, 8, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#451a03';
        ctx.beginPath();
        ctx.arc(2, 8, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // --- Floating Text Popups ---
    function addFloatText(text, x, y, color = '#facc15', size = 26) {
      floatTexts.push({ text, x, y, color, size, alpha: 1, vy: -2.6 });
    }

    // --- Splatter Generation ---
    function createSplatter(x, y, color) {
      const drops = [];
      const numDrops = 6 + Math.floor(Math.random() * 8);
      for (let i = 0; i < numDrops; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 18 + Math.random() * 55;
        drops.push({
          dx: Math.cos(angle) * dist,
          dy: Math.sin(angle) * dist,
          r: 2.5 + Math.random() * 4.5
        });
      }

      splatters.push({
        x, y,
        rx: 26 + Math.random() * 22,
        ry: 18 + Math.random() * 16,
        rotation: Math.random() * Math.PI * 2,
        color: color + '55',
        drops,
        alpha: 0.95
      });

      if (splatters.length > 25) splatters.shift();
    }

    // --- Update Strike Indicators on HUD ---
    function updateStrikesUI() {
      for (let i = 1; i <= MAX_STRIKES; i++) {
        const el = document.getElementById(`strike-${i}`);
        if (i <= bombStrikes) {
          el.classList.add('active');
          el.textContent = '❌';
        } else {
          el.classList.remove('active');
          el.textContent = '💣';
        }
      }
    }

    // --- Slice Processing ---
    function sliceFruit(f, bladeAngle) {
      if (f.sliced) return;
      f.sliced = true;

      // --- BOMB HIT LOGIC (3 STRIKES) ---
      if (f.isBomb) {
        bombStrikes++;
        updateStrikesUI();

        AudioEngine.playBomb();
        triggerHaptic('heavy');
        screenShake = 28;
        flashScreenAlpha = 0.9;

        addFloatText(`BOMB STRIKE ${bombStrikes}/${MAX_STRIKES}!`, f.x, f.y - 20, '#ef4444', 32);

        // Huge explosion particles
        for (let i = 0; i < 50; i++) {
          particles.push({
            x: f.x, y: f.y,
            vx: (Math.random() - 0.5) * 20,
            vy: (Math.random() - 0.5) * 20,
            radius: 3 + Math.random() * 8,
            color: ['#ef4444', '#f97316', '#fbbf24', '#0f172a'][Math.floor(Math.random() * 4)],
            alpha: 1,
            gravity: 0.35
          });
        }

        fruits = fruits.filter(item => item !== f);

        // Check 3 strikes rule
        if (bombStrikes >= MAX_STRIKES) {
          setTimeout(() => {
            endGame('3 Bombs Sliced!');
          }, 350);
        }
        return;
      }

      // --- REGULAR FRUIT CUT ---
      const now = Date.now();
      if (now - lastSliceTime < 420) combo++;
      else combo = 1;
      lastSliceTime = now;

      const earnedPoints = f.points * (combo > 1 ? combo : 1);
      score += earnedPoints;
      scoreEl.textContent = score;

      AudioEngine.playSlice(combo);
      triggerHaptic(combo > 2 ? 'heavy' : 'light');

      if (combo > 1) {
        addFloatText(`+${earnedPoints} (Combo x${combo})`, f.x, f.y - 12, '#4ade80', 30);
        comboEl.textContent = `Combo x${combo}!`;
        comboEl.classList.add('show');
      } else {
        addFloatText(`+${earnedPoints}`, f.x, f.y - 10, '#fef08a', 24);
      }

      createSplatter(f.x, f.y, f.fleshColor);

      // Spray juice
      for (let i = 0; i < 22; i++) {
        const spd = 4 + Math.random() * 12;
        const ang = Math.random() * Math.PI * 2;
        particles.push({
          x: f.x, y: f.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          radius: 2 + Math.random() * 4,
          color: Math.random() > 0.4 ? f.fleshColor : f.skinColor,
          alpha: 1,
          gravity: 0.4
        });
      }

      // Split halves
      const perpAngle = bladeAngle + Math.PI / 2;
      const pushSpeed = 4.5 + Math.random() * 2.5;

      fruitHalves.push({
        x: f.x, y: f.y,
        vx: f.vx + Math.cos(perpAngle) * pushSpeed,
        vy: f.vy + Math.sin(perpAngle) * pushSpeed - 1.5,
        rotation: bladeAngle,
        rotSpeed: -0.1 - Math.random() * 0.15,
        radius: f.radius,
        name: f.name,
        skinColor: f.skinColor,
        fleshColor: f.fleshColor,
        alpha: 1
      });

      fruitHalves.push({
        x: f.x, y: f.y,
        vx: f.vx - Math.cos(perpAngle) * pushSpeed,
        vy: f.vy - Math.sin(perpAngle) * pushSpeed - 1.5,
        rotation: bladeAngle + Math.PI,
        rotSpeed: 0.1 + Math.random() * 0.15,
        radius: f.radius,
        name: f.name,
        skinColor: f.skinColor,
        fleshColor: f.fleshColor,
        alpha: 1
      });

      fruits = fruits.filter(item => item !== f);
    }

    // --- Fruit Spawner (Parabolic throws) ---
    function spawnWave() {
      const isMulti = Math.random() < 0.65;
      const waveSize = isMulti ? 2 + Math.floor(Math.random() * 3) : 1;

      for (let i = 0; i < waveSize; i++) {
        setTimeout(() => {
          if (gameState !== 'playing') return;
          const isBomb = Math.random() < 0.20; // 20% bomb probability
          const template = isBomb 
            ? FRUIT_PRESETS.find(p => p.isBomb) 
            : FRUIT_PRESETS[Math.floor(Math.random() * (FRUIT_PRESETS.length - 1))];

          const startX = width * 0.15 + Math.random() * (width * 0.7);
          const startY = height + 40;
          const targetX = width * 0.25 + Math.random() * (width * 0.5);
          const launchVx = (targetX - startX) * 0.022;
          const launchVy = -(13.5 + Math.random() * 4.5);

          fruits.push({
            ...template,
            x: startX,
            y: startY,
            vx: launchVx,
            vy: launchVy,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.08,
            sliced: false
          });
        }, i * 160);
      }
    }

    // --- Pointer & Katana Blade ---
    let isMouseDown = false;
    let prevPoint = null;

    function handlePointerDown(e) {
      AudioEngine.init();
      isMouseDown = true;
      const p = getEventPos(e);
      prevPoint = p;
      bladePath = [{ x: p.x, y: p.y, time: performance.now() }];
    }

    function handlePointerMove(e) {
      if (!isMouseDown || gameState !== 'playing') return;
      const p = getEventPos(e);
      const now = performance.now();

      bladePath.push({ x: p.x, y: p.y, time: now });
      if (bladePath.length > 20) bladePath.shift();

      if (prevPoint) {
        const dx = p.x - prevPoint.x;
        const dy = p.y - prevPoint.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 15) {
          AudioEngine.playSwoosh();
          const bladeAngle = Math.atan2(dy, dx);

          for (let i = fruits.length - 1; i >= 0; i--) {
            const f = fruits[i];
            const d = pointToSegmentDistance(f.x, f.y, prevPoint.x, prevPoint.y, p.x, p.y);
            if (d < f.radius + 12) {
              sliceFruit(f, bladeAngle);
            }
          }
        }
      }
      prevPoint = p;
    }

    function handlePointerUp() {
      isMouseDown = false;
      prevPoint = null;
    }

    function getEventPos(e) {
      if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
    canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerUp);

    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    // --- Katana Blade Render ---
    function drawBladeTrail() {
      const now = performance.now();
      bladePath = bladePath.filter(pt => now - pt.time < 160);
      if (bladePath.length < 2) return;

      // Cyan / Ice-Blue Outer Glow
      ctx.beginPath();
      ctx.moveTo(bladePath[0].x, bladePath[0].y);
      for (let i = 1; i < bladePath.length; i++) ctx.lineTo(bladePath[i].x, bladePath[i].y);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      // Sharp Razor Core
      ctx.beginPath();
      ctx.moveTo(bladePath[0].x, bladePath[0].y);
      for (let i = 1; i < bladePath.length; i++) ctx.lineTo(bladePath[i].x, bladePath[i].y);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    // --- Game Loop Update ---
    function update(dt) {
      if (gameState !== 'playing') return;

      gameTime += dt;
      spawnTimer += dt;

      const currentInterval = Math.max(0.9, 2.1 - (gameTime / ROUND_TIME) * 1.0);
