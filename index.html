<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VTN Hub Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #fdf6f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4">

  <div class="bg-red-600 text-white text-center py-4 rounded-xl mb-4">
    <h1 class="text-xl font-bold">👑 VTN Hub Bot - Debug</h1>
  </div>

  <div id="debug" class="bg-white rounded-xl p-4 shadow text-sm space-y-2">
    <p>Status: <span id="status">Starting...</span></p>
    <p>Telegram User: <span id="tg-user">Checking...</span></p>
    <p>Supabase: <span id="sb-status">Checking...</span></p>
    <p id="error" class="text-red-600 font-medium"></p>
  </div>

  <div id="result" class="mt-4 hidden bg-green-100 text-green-800 p-4 rounded-xl">
    <p class="font-bold">Success!</p>
    <p>Name: <span id="res-name"></span></p>
    <p>ID: <span id="res-id"></span></p>
    <p>Balance: <span id="res-balance"></span></p>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const tgUserEl = document.getElementById('tg-user');
    const sbStatusEl = document.getElementById('sb-status');
    const errorEl = document.getElementById('error');

    function log(msg) {
      statusEl.innerText = msg;
      console.log(msg);
    }

    async function start() {
      try {
        log('1. Checking Telegram...');

        const tg = window.Telegram?.WebApp;
        if (!tg) {
          errorEl.innerText = 'Telegram WebApp not found. Open inside Telegram.';
          return;
        }

        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (!user) {
          tgUserEl.innerText = 'No user data';
          errorEl.innerText = 'No Telegram user found. Make sure you opened from the bot.';
          return;
        }

        tgUserEl.innerText = user.first_name + ' (' + user.id + ')';
        log('2. Telegram OK. Connecting to Supabase...');

        const SUPABASE_URL = 'https://dkservnassatehmhgojm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aKGo5rp3nOEQnh054P-WtA_exkxy3mv';

        if (!window.supabase) {
          errorEl.innerText = 'Supabase library failed to load';
          return;
        }

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        sbStatusEl.innerText = 'Client created';

        log('3. Checking if user exists in database...');

        let { data: existingUser, error: selectError } = await supabase
          .from('users')
          .select('*')
          .eq('telegram_id', user.id)
          .maybeSingle();

        if (selectError) {
          errorEl.innerText = 'Select Error: ' + selectError.message + ' | Code: ' + selectError.code;
          sbStatusEl.innerText = 'Error on select';
          return;
        }

        if (existingUser) {
          log('4. User already exists');
          showSuccess(existingUser);
          return;
        }

        log('5. Creating new user...');

        const { data: newUser, error: insertError } = await supabase
          .from('users')
          .insert({
            telegram_id: user.id,
            first_name: user.first_name || 'User',
            username: user.username || null,
            balance: 0,
            is_vip: false
          })
          .select()
          .single();

        if (insertError) {
          errorEl.innerText = 'Insert Error: ' + insertError.message + ' | Code: ' + insertError.code;
          sbStatusEl.innerText = 'Error on insert';
          return;
        }

        log('6. User created successfully');
        showSuccess(newUser);

      } catch (err) {
        errorEl.innerText = 'JS Error: ' + err.message;
        log('Crashed');
      }
    }

    function showSuccess(user) {
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('res-name').innerText = user.first_name;
      document.getElementById('res-id').innerText = user.telegram_id;
      document.getElementById('res-balance').innerText = user.balance;
      statusEl.innerText = 'Completed successfully';
      sbStatusEl.innerText = 'Connected';
    }

    start();
  </script>
</body>
</html>
