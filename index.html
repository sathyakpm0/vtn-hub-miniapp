<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Fruit Slice Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body {
      background: #080c16;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      height: 100vh;
      width: 100vw;
      overscroll-behavior: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: absolute;
      top: env(safe-area-inset-top, 12px);
      left: 0;
      width: 100%;
      padding: 12px 18px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .stat-badge {
      display: flex;
      flex-direction: column;
    }

    #score {
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 4px 16px rgba(0,0,0,0.6);
      background: linear-gradient(180deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #best {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    #timer-container {
      text-align: right;
    }

    #timer {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56,189,248,0.4);
      font-variant-numeric: tabular-nums;
    }

    #combo-popup {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%) scale(0.7);
      font-size: 26px;
      font-weight: 900;
      font-style: italic;
      color: #facc15;
      text-shadow: 0 0 16px rgba(250, 204, 21, 0.7);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.15s ease;
      z-index: 12;
    }

    #game-over, #start-screen {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.88) 0%, rgba(8, 12, 22, 0.98) 100%);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      gap: 14px;
      padding: 24px;
      text-align: center;
    }

    #start-screen {
      display: flex;
    }

    h1 {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 34px;
      font-weight: 800;
      color: #f43f5e;
    }

    #final-score {
      font-size: 56px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
    }

    #best-score-text {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .btn {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4), inset 0 1px 1px rgba(255,255,255,0.4);
      outline: none;
      transition: transform 0.1s ease, filter 0.1s ease;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.95);
      filter: brightness(1.15);
    }

    .instructions {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 280px;
    }

    .instructions span {
      color: #f87171;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div class="stat-badge">
        <div id="score">0</div>
        <div id="best">BEST: 0</div>
      </div>
      <div id="timer-container">
        <div id="timer">40s</div>
      </div>
    </div>

    <div id="combo-popup">COMBO x2!</div>

    <div id="start-screen">
      <h1>FRUIT SLICE</h1>
      <p class="instructions">Swipe like a ninja to slice fruits.<br><span>AVOID THE BOMBS!</span></p>
      <button class="btn" id="start-btn">PLAY NOW</button>
    </div>

    <div id="game-over">
      <h2>TIME'S UP</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">BEST: 0</div>
      <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    // ========== Telegram Mini App Setup & Haptics ==========
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.disableVerticalSwipes?.();
      tg.setHeaderColor?.('#080c16');
      tg.setBackgroundColor?.('#080c16');
    }

    function haptic(type = 'light') {
      try {
        if (!tg?.HapticFeedback) return;
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
      } catch (e) {}
    }

    // ========== Procedural Sound Synthesizer (Web Audio API) ==========
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playSwoosh() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, now);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.12);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.12);
      }
      playSlice(comboCount = 1) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // Juice squelch (FM synthesis)
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        const baseFreq = 520 + Math.min(comboCount * 70, 600);
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.16);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }
      playExplosion() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // White noise burst
        const bufferSize = this.ctx.sampleRate * 0.4;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(400, now);
        filter.frequency.exponentialRampToValueAtTime(40, now + 0.4);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start(now);
      }
    }
    const audio = new SoundEngine();

    // ========== Canvas & Dimensions ==========
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const comboEl = document.getElementById('combo-popup');
    const timerEl = document.getElementById('timer');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // ========== Game State ==========
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('fruitSliceBest_v2') || '0');
    bestEl.textContent = `BEST: ${bestScore}`;

    let fruits = [];
    let slicedHalves = [];
    let splatters = [];
    let particles = [];
    let floatingTexts = [];
    let slashPoints = [];
    let gameState = 'start';
    let timeLeft = 40;
    let combo = 0;
    let comboTimer = 0;
    let spawnTimer = 0;
    let screenShake = 0;

    // Fruit definitions
    const FRUIT_PROFILES = {
      apple: { radius: 32, points: 1, skinColor: '#ef4444', innerColor: '#fef08a', seedColor: '#78350f' },
      orange: { radius: 30, points: 1, skinColor: '#f97316', innerColor: '#ffedd5', seedColor: '#ea580c' },
      watermelon: { radius: 36, points: 2, skinColor: '#16a34a', innerColor: '#ef4444', seedColor: '#1e293b' },
      banana: { radius: 28, points: 1, skinColor: '#eab308', innerColor: '#fef9c3', seedColor: '#854d0e' },
      grape: { radius: 30, points: 2, skinColor: '#a855f7', innerColor: '#f3e8ff', seedColor: '#6b21a8' },
      bomb: { radius: 30, isBomb: true }
    };
    const FRUIT_NAMES = ['apple', 'orange', 'watermelon', 'banana', 'grape'];

    // ========== Drawing Logic ==========
    function drawFruitBody(name, r) {
      if (name === 'apple') {
        ctx.beginPath();
        ctx.arc(0, 2, r, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 0.3, r * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fill();

        // Stem & Leaf
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.85);
        ctx.lineTo(2, -r * 1.3);
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 3.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(r * 0.45, -r * 1.15, r * 0.45, r * 0.22, 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#22c55e';
        ctx.fill();
      } else if (name === 'orange') {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = '#f97316';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 0.35, r * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        for (let i = 0; i < 7; i++) {
          const a = (i / 7) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (name === 'watermelon') {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = '#16a34a';
        ctx.fill();

        // Dark Stripes
        ctx.strokeStyle = '#14532d';
        ctx.lineWidth = 4;
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.arc(i * 12, 0, r * 0.95, -Math.PI / 2, Math.PI / 2);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 0.35, r * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fill();
      } else if (name === 'banana') {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = '#eab308';
        ctx.fill();

        ctx.strokeStyle = '#a16207';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, -6, r * 0.75, 0.2, Math.PI - 0.2);
        ctx.stroke();
      } else if (name === 'grape') {
        const cluster = [
          [0, -10], [-12, -2], [12, -2],
          [-7, 10], [7, 10], [0, 18]
        ];
        cluster.forEach(([gx, gy]) => {
          ctx.beginPath();
          ctx.arc(gx, gy, 11, 0, Math.PI * 2);
          ctx.fillStyle = '#a855f7';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(gx - 3, gy - 3, 3, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.3)';
          ctx.fill();
        });
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(0, -26);
        ctx.strokeStyle = '#4d7c0f';
        ctx.lineWidth = 3;
        ctx.stroke();
      } else if (name === 'bomb') {
        // Bomb Body
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = '#1e293b';
        ctx.fill();
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 3.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 0.35, r * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fill();

        // Bomb Cap
        ctx.fillStyle = '#64748b';
        ctx.fillRect(-6, -r - 4, 12, 6);

        // Burning Fuse
        ctx.beginPath();
        ctx.moveTo(0, -r - 4);
        ctx.quadraticCurveTo(12, -r - 18, 6, -r - 28);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Fuse Spark
        const sparkX = 6 + (Math.random() - 0.5) * 4;
        const sparkY = -r - 28 + (Math.random() - 0.5) * 4;
        ctx.beginPath();
        ctx.arc(sparkX, sparkY, 4.5 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fillStyle = Math.random() > 0.5 ? '#fef08a' : '#ef4444';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // ========== Splitting Cut Half Renderer ==========
    function drawSlicedHalf(half) {
      ctx.save();
      ctx.translate(half.x, half.y);
      ctx.rotate(half.rotation);

      // Clip along the cut line (semi-circle)
      ctx.save();
      ctx.beginPath();
      if (half.side === 1) {
        ctx.rect(-half.radius * 1.5, -half.radius * 1.5, half.radius * 3, half.radius * 1.5);
      } else {
        ctx.rect(-half.radius * 1.5, 0, half.radius * 3, half.radius * 1.5);
      }
      ctx.clip();

      drawFruitBody(half.name, half.radius);
      ctx.restore();

      // Draw juicy fleshy cut plane
      ctx.beginPath();
      ctx.moveTo(-half.radius, 0);
      ctx.lineTo(half.radius, 0);
      ctx.strokeStyle = half.profile.innerColor || '#ffffff';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.restore();
    }

    // ========== Input Handling ==========
    let isTouching = false;
    let lastPos = null;

    function getCanvasCoordinates(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }

    function onPointerDown(e) {
      if (gameState !== 'playing') return;
      audio.init();
      isTouching = true;
      lastPos = getCanvasCoordinates(e);
      slashPoints = [{ x: lastPos.x, y: lastPos.y, age: 0 }];
    }

    function onPointerMove(e) {
      if (!isTouching || gameState !== 'playing') return;
      const currentPos = getCanvasCoordinates(e);
      slashPoints.push({ x: currentPos.x, y: currentPos.y, age: 0 });

      const dist = Math.hypot(currentPos.x - lastPos.x, currentPos.y - lastPos.y);
      if (dist > 16) {
        audio.playSwoosh();
        // Emit slicing sparks along blade
        particles.push({
          x: currentPos.x,
          y: currentPos.y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          color: '#ffffff',
          size: 2.5,
          alpha: 1,
          decay: 0.08
        });
      }

      checkSliceCollisions(lastPos.x, lastPos.y, currentPos.x, currentPos.y);
      lastPos = currentPos;
    }

    function onPointerUp() {
      isTouching = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp, { passive: false });

    // ========== Collision & Slicing ==========
    function checkSliceCollisions(x1, y1, x2, y2) {
      let slicedThisStroke = 0;

      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        if (f.sliced) continue;

        const d = distToSegment(f.x, f.y, x1, y1, x2, y2);
        if (d < f.radius + 6) {
          f.sliced = true;
          const sliceAngle = Math.atan2(y2 - y1, x2 - x1);

          if (f.isBomb) {
            triggerBombExplosion(f.x, f.y);
            return;
          }

          slicedThisStroke++;
          sliceFruit(f, sliceAngle);
        }
      }

      if (slicedThisStroke > 0) {
        combo += slicedThisStroke;
        comboTimer = 0.35; // Combo window in seconds
        if (combo >= 2) {
          showComboText(combo);
          haptic('heavy');
        } else {
          haptic('medium');
        }
      }
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    function sliceFruit(f, cutAngle) {
      audio.playSlice(combo);

      // Score increment
      const pointsEarned = f.profile.points * (combo > 1 ? combo : 1);
      score += pointsEarned;
      scoreEl.textContent = score;

      floatingTexts.push({
        x: f.x,
        y: f.y - 10,
        text: `+${pointsEarned}`,
        color: '#facc15',
        alpha: 1,
        vy: -2
      });

      // Split into 2 halves pushed perpendicularly to slice
      const perpAngle = cutAngle + Math.PI / 2;
      const pushSpeed = 3.5 + Math.random() * 2;

      slicedHalves.push({
        x: f.x,
        y: f.y,
        vx: f.vx + Math.cos(perpAngle) * pushSpeed,
        vy: f.vy + Math.sin(perpAngle) * pushSpeed,
        rotation: cutAngle,
        vRot: -0.1 - Math.random() * 0.15,
        radius: f.radius,
        name: f.name,
        profile: f.profile,
        side: 1
      });

      slicedHalves.push({
        x: f.x,
        y: f.y,
        vx: f.vx - Math.cos(perpAngle) * pushSpeed,
        vy: f.vy - Math.sin(perpAngle) * pushSpeed,
        rotation: cutAngle,
        vRot: 0.1 + Math.random() * 0.15,
        radius: f.radius,
        name: f.name,
        profile: f.profile,
        side: -1
      });

      // Splatter on background
      splatters.push({
        x: f.x,
        y: f.y,
        radius: 26 + Math.random() * 18,
        color: f.profile.skinColor,
        alpha: 0.38
      });

      // Juicy Droplets
      for (let i = 0; i < 18; i++) {
        const speed = 3 + Math.random() * 7;
        const ang = Math.random() * Math.PI * 2;
        particles.push({
          x: f.x,
          y: f.y,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed - 1.5,
          color: Math.random() > 0.4 ? f.profile.skinColor : f.profile.innerColor,
          size: 3 + Math.random() * 4,
          alpha: 1,
          decay: 0.02 + Math.random() * 0.02
        });
      }

      screenShake = Math.max(screenShake, 5);
      fruits = fruits.filter(item => item !== f);
    }

    function triggerBombExplosion(x, y) {
      audio.playExplosion();
      haptic('error');
      screenShake = 22;

      // Heavy explosion particles
      for (let i = 0; i < 45; i++) {
        const speed = 2 + Math.random() * 14;
        const ang = Math.random() * Math.PI * 2;
        particles.push({
          x, y,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed,
          color: ['#ef4444', '#f97316', '#fbbf24', '#ffffff'][Math.floor(Math.random() * 4)],
          size: 4 + Math.random() * 6,
          alpha: 1,
          decay: 0.015
        });
      }

      gameOver();
    }

    function showComboText(count) {
      comboEl.textContent = `COMBO x${count}!`;
      comboEl.style.opacity = '1';
      comboEl.style.transform = 'translateX(-50%) scale(1.15)';
      setTimeout(() => {
        comboEl.style.transform = 'translateX(-50%) scale(1.0)';
      }, 100);
    }

    // ========== Fruit Spawner (Upward Fountain) ==========
    function spawnWave() {
      const count = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          if (gameState !== 'playing') return;
          const isBomb = Math.random() < 0.16;
          const name = isBomb ? 'bomb' : FRUIT_NAMES[Math.floor(Math.random() * FRUIT_NAMES.length)];
          const profile = FRUIT_PROFILES[name];

          const startX = width * 0.15 + Math.random() * (width * 0.7);
          const startY = height + 40;

          // Target arc towards center
          const targetX = width * 0.2 + Math.random() * (width * 0.6);
          const gravity = 0.32;
          const peakY = height * 0.2 + Math.random() * (height * 0.25);

          const vy = -Math.sqrt(2 * gravity * (startY - peakY));
          const timeToPeak = -vy / gravity;
          const vx = (targetX - startX) / (timeToPeak * 1.8);

          fruits.push({
            x: startX,
            y: startY,
            vx,
            vy,
            gravity,
            radius: profile.radius,
            name,
            profile,
            isBomb: !!profile.isBomb,
            sliced: false,
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.08
          });
        }, i * 160);
      }
    }

    // ========== Main Loop ==========
    let lastTimestamp = performance.now();

    function update(dt) {
      if (gameState !== 'playing') return;

      timeLeft -= dt;
      timerEl.textContent = `${Math.max(0, Math.ceil(timeLeft))}s`;
      if (timeLeft <= 0) {
        gameOver();
        return;
      }

      // Combo cooldown
      if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) {
          combo = 0;
          comboEl.style.opacity = '0';
        }
      }

      // Fruit Spawner
      spawnTimer += dt;
      if (spawnTimer > 1.25) {
        spawnWave();
        spawnTimer = 0;
      }

      // Update whole fruits
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.x += f.vx;
        f.y += f.vy;
        f.vy += f.gravity;
        f.rotation += f.vRot;

        if (f.y > height + 80 && f.vy > 0) {
          fruits.splice(i, 1);
        }
      }

      // Update sliced halves
      for (let i = slicedHalves.length - 1; i >= 0; i--) {
        const h = slicedHalves[i];
        h.x += h.vx;
        h.y += h.vy;
        h.vy += 0.38; // heavier fall
        h.rotation += h.vRot;

        if (h.y > height + 80) {
          slicedHalves.splice(i, 1);
        }
      }

      // Update juice particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      // Fade background splatters
      for (let i = splatters.length - 1; i >= 0; i--) {
        const s = splatters[i];
        s.alpha -= 0.0006;
        s.y += 0.05; // slow drip
        if (s.alpha <= 0) splatters.splice(i, 1);
      }

      // Update floating score numbers
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }

      // Update Blade Trail
      for (let i = slashPoints.length - 1; i >= 0; i--) {
        slashPoints[i].age += dt;
        if (slashPoints[i].age > 0.16) {
          slashPoints.splice(i, 1);
        }
      }

      // Shake dampening
      if (screenShake > 0) {
        screenShake *= 0.88;
        if (screenShake < 0.2) screenShake = 0;
      }
    }

    function render() {
      ctx.save();

      // Screen Shake
      if (screenShake > 0) {
        const rx = (Math.random() - 0.5) * screenShake * 2;
        const ry = (Math.random() - 0.5) * screenShake * 2;
        ctx.translate(rx, ry);
      }

      // Clear Screen with Rich Radial Dojo Vibe
      const bgGrad = ctx.createRadialGradient(width / 2, height * 0.4, 40, width / 2, height * 0.5, width);
      bgGrad.addColorStop(0, '#1e293b');
      bgGrad.addColorStop(1, '#080c16');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Background Splatters
      splatters.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.globalAlpha = s.alpha;
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Draw Sliced Halves
      slicedHalves.forEach(h => drawSlicedHalf(h));

      // Draw Airborne Whole Fruits
      fruits.forEach(f => {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rotation);
        drawFruitBody(f.name, f.radius);
        ctx.restore();
      });

      // Draw Splatter Particles
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Draw Floating Texts
      floatingTexts.forEach(ft => {
        ctx.font = 'bold 22px system-ui';
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillText(ft.text, ft.x, ft.y);
      });
      ctx.globalAlpha = 1;

      // Render Blade Slash Ribbon
      if (slashPoints.length > 2) {
        for (let i = 1; i < slashPoints.length; i++) {
          const prev = slashPoints[i - 1];
          const curr = slashPoints[i];
          const factor = i / slashPoints.length;

          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(curr.x, curr.y);
          ctx.strokeStyle = `rgba(56, 189, 248, ${factor * 0.8})`;
          ctx.lineWidth = factor * 14;
          ctx.lineCap = 'round';
          ctx.stroke();

          // White glowing core
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(curr.x, curr.y);
          ctx.strokeStyle = `rgba(255, 255, 255, ${factor * 0.95})`;
          ctx.lineWidth = factor * 5;
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function gameLoop(now) {
      const dt = Math.min((now - lastTimestamp) / 1000, 0.05);
      lastTimestamp = now;

      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    // ========== Flow Controls ==========
    function startGame() {
      audio.init();
      haptic('medium');
      score = 0;
      scoreEl.textContent = '0';
      timeLeft = 40;
      combo = 0;
      fruits = [];
      slicedHalves = [];
      particles = [];
      splatters = [];
      floatingTexts = [];
      slashPoints = [];
      spawnTimer = 0;
      gameState = 'playing';

      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      comboEl.style.opacity = '0';
    }

    function gameOver() {
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('fruitSliceBest_v2', bestScore);
        bestEl.textContent = `BEST: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `BEST: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
