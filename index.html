<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fruit Slice</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #0f172a 0%, #1e293b 100%);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score-box {
      text-align: left;
    }

    #score {
      font-size: 36px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #combo {
      font-size: 22px;
      font-weight: 700;
      color: #4ade80;
      text-align: right;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #timer {
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 18px;
      opacity: 0.85;
      z-index: 10;
      pointer-events: none;
    }

    #game-over {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 10px;
    }

    #game-over h2 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 22px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 25;
      gap: 16px;
    }

    #start-screen h1 {
      font-size: 36px;
      font-weight: 700;
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div id="score-box">
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="combo">Combo x2</div>
    </div>

    <div id="timer">Time: 40</div>

    <div id="start-screen">
      <h1>Fruit Slice</h1>
      <p>Swipe to slice fruits.<br>Avoid the bombs!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="game-over">
      <h2>Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    // ========== Telegram ==========
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    // ========== Canvas ==========
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const comboEl = document.getElementById('combo');
    const timerEl = document.getElementById('timer');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // ========== Game State ==========
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('fruitSliceBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let fruits = [];
    let particles = [];
    let slashPoints = [];
    let gameState = 'start'; // start | playing | gameover
    let timeLeft = 40;
    let combo = 0;
    let lastSliceTime = 0;
    let spawnTimer = 0;
    let gameTime = 0;

    // Fruit types
    const FRUIT_TYPES = [
      { name: 'apple', color: '#ef4444', radius: 22, points: 1 },
      { name: 'orange', color: '#f97316', radius: 24, points: 1 },
      { name: 'watermelon', color: '#22c55e', radius: 28, points: 2 },
      { name: 'banana', color: '#eab308', radius: 20, points: 1 },
      { name: 'grape', color: '#a855f7', radius: 18, points: 1 },
      { name: 'bomb', color: '#1e293b', radius: 23, points: 0, isBomb: true }
    ];

    // ========== Input (Swipe) ==========
    let isDrawing = false;
    let lastX = 0, lastY = 0;

    function getPos(e) {
      if (e.touches) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function startDraw(e) {
      e.preventDefault();
      if (gameState !== 'playing') return;
      isDrawing = true;
      const pos = getPos(e);
      lastX = pos.x;
      lastY = pos.y;
      slashPoints = [{ x: pos.x, y: pos.y, life: 8 }];
    }

    function moveDraw(e) {
      e.preventDefault();
      if (!isDrawing || gameState !== 'playing') return;
      const pos = getPos(e);

      // Add slash trail
      slashPoints.push({ x: pos.x, y: pos.y, life: 8 });
      if (slashPoints.length > 12) slashPoints.shift();

      // Check collision with fruits
      checkSlice(lastX, lastY, pos.x, pos.y);

      lastX = pos.x;
      lastY = pos.y;
    }

    function endDraw(e) {
      e.preventDefault();
      isDrawing = false;
      slashPoints = [];
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    // ========== Slice Detection ==========
    function checkSlice(x1, y1, x2, y2) {
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        if (f.sliced) continue;

        // Simple line-circle intersection
        const dist = pointToSegmentDistance(f.x, f.y, x1, y1, x2, y2);
        if (dist < f.radius + 8) {
          sliceFruit(f, i);
        }
      }
    }

    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const A = px - x1;
      const B = py - y1;
      const C = x2 - x1;
      const D = y2 - y1;
      const dot = A * C + B * D;
      const lenSq = C * C + D * D;
      let param = lenSq !== 0 ? dot / lenSq : -1;
      let xx, yy;
      if (param < 0) { xx = x1; yy = y1; }
      else if (param > 1) { xx = x2; yy = y2; }
      else { xx = x1 + param * C; yy = y1 + param * D; }
      const dx = px - xx;
      const dy = py - yy;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function sliceFruit(fruit, index) {
      fruit.sliced = true;

      if (fruit.isBomb) {
        // Bomb → Game Over
        createExplosion(fruit.x, fruit.y, '#ef4444');
        gameOver();
        return;
      }

      // Normal fruit
      score += fruit.points * (combo > 0 ? combo : 1);
      scoreEl.textContent = score;

      // Combo
      const now = Date.now();
      if (now - lastSliceTime < 900) {
        combo++;
      } else {
        combo = 1;
      }
      lastSliceTime = now;

      if (combo > 1) {
        comboEl.textContent = `Combo x${combo}`;
        comboEl.style.opacity = '1';
      }

      // Particles
      createParticles(fruit.x, fruit.y, fruit.color);

      // Remove after short delay
      setTimeout(() => {
        fruits = fruits.filter(f => f !== fruit);
      }, 120);
    }

    // ========== Particles ==========
    function createParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8 - 2,
          life: 30 + Math.random() * 20,
          color,
          size: 3 + Math.random() * 4
        });
      }
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 25; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14,
          life: 40 + Math.random() * 20,
          color,
          size: 4 + Math.random() * 5
        });
      }
    }

    // ========== Spawn Fruits ==========
    function spawnFruit() {
      const isBomb = Math.random() < 0.13; // 13% chance of bomb
      const type = isBomb ? FRUIT_TYPES[5] : FRUIT_TYPES[Math.floor(Math.random() * 5)];

      const fromLeft = Math.random() > 0.5;
      const x = fromLeft ? -30 : width + 30;
      const y = height * 0.55 + Math.random() * (height * 0.25);

      const speed = 4.5 + Math.random() * 2.5;
      const angle = fromLeft ? (-0.6 - Math.random() * 0.5) : (Math.PI + 0.6 + Math.random() * 0.5);

      fruits.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3.5,
        radius: type.radius,
        color: type.color,
        points: type.points,
        isBomb: type.isBomb || false,
        sliced: false,
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.2
      });
    }

    // ========== Game Loop ==========
    function update(dt) {
      if (gameState !== 'playing') return;

      gameTime += dt;
      spawnTimer += dt;

      // Spawn rate increases over time
      const spawnInterval = Math.max(0.55, 1.1 - gameTime * 0.012);
      if (spawnTimer > spawnInterval) {
        spawnFruit();
        if (Math.random() < 0.35) spawnFruit(); // sometimes double
        spawnTimer = 0;
      }

      // Update fruits
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.x += f.vx;
        f.y += f.vy;
        f.vy += 0.18; // gravity
        f.rotation += f.rotSpeed;

        // Remove if off screen
        if (f.y > height + 60 || f.x < -80 || f.x > width + 80) {
          fruits.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Slash trail fade
      for (let i = slashPoints.length - 1; i >= 0; i--) {
        slashPoints[i].life--;
        if (slashPoints[i].life <= 0) slashPoints.splice(i, 1);
      }

      // Combo fade
      if (Date.now() - lastSliceTime > 1000) {
        combo = 0;
        comboEl.style.opacity = '0';
      }

      // Timer
      timeLeft -= dt;
      timerEl.textContent = `Time: ${Math.max(0, Math.ceil(timeLeft))}`;
      if (timeLeft <= 0) {
        gameOver();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Draw fruits
      fruits.forEach(f => {
        if (f.sliced) return;

        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rotation);

        // Shadow
        ctx.beginPath();
        ctx.arc(3, 4, f.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fill();

        // Fruit body
        ctx.beginPath();
        ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();

        // Highlight
        ctx.beginPath();
        ctx.arc(-f.radius * 0.3, -f.radius * 0.3, f.radius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fill();

        // Bomb fuse
        if (f.isBomb) {
          ctx.beginPath();
          ctx.moveTo(0, -f.radius);
          ctx.lineTo(0, -f.radius - 10);
          ctx.strokeStyle = '#f87171';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        ctx.restore();
      });

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Slash trail
      if (slashPoints.length > 1) {
        ctx.beginPath();
        ctx.moveTo(slashPoints[0].x, slashPoints[0].y);
        for (let i = 1; i < slashPoints.length; i++) {
          ctx.lineTo(slashPoints[i].x, slashPoints[i].y);
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        // Glow
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.lineWidth = 10;
        ctx.stroke();
      }
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // ========== Game Control ==========
    function startGame() {
      score = 0;
      scoreEl.textContent = '0';
      timeLeft = 40;
      combo = 0;
      fruits = [];
      particles = [];
      slashPoints = [];
      spawnTimer = 0;
      gameTime = 0;
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      comboEl.style.opacity = '0';
    }

    function gameOver() {
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('fruitSliceBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Start loop
    requestAnimationFrame(loop);
  </script>
</body>
</html>
