<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Realistic Car Race - Timed Levels</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: #0f172a;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 38px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #level-info {
      text-align: right;
    }

    #level-badge {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: inline-block;
      margin-bottom: 4px;
    }

    #level-timer {
      font-size: 15px;
      font-weight: 700;
      color: #f87171;
    }

    #game-over, #start-screen, #level-banner {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over, #level-banner {
      display: none;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }

    #banner-text {
      font-size: 36px;
      font-weight: 800;
      color: #4ade80;
      text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="level-info">
        <div id="level-badge">Level 1</div>
        <div id="level-timer">Time: 25s</div>
      </div>
    </div>

    <div id="start-screen">
      <h1>Realistic Car Race</h1>
      <p>Tap left or right side to steer!<br>Evade realistic traffic cars and reach the goal before time runs out!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="level-banner">
      <div id="banner-text">LEVEL 2</div>
      <p style="opacity: 0.8; font-size: 16px;">Traffic speeds up! Beat the timer!</p>
    </div>

    <div id="game-over">
      <h2 id="game-over-title">Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelBadge = document.getElementById('level-badge');
    const levelTimerEl = document.getElementById('level-timer');
    const gameOverEl = document.getElementById('game-over');
    const gameOverTitle = document.getElementById('game-over-title');
    const levelBanner = document.getElementById('level-banner');
    const bannerText = document.getElementById('banner-text');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('realisticCarBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let level = 1;
    let timeLeft = 25;
    let levelDistance = 0;
    let targetDistance = 300;
    let gameState = 'start';
    let roadAnim = 0;

    let player = {
      x: width / 2,
      y: height - 150,
      width: 52,
      height: 105,
      color: '#0284c7'
    };

    let obstacles = [];
    let spawnTimer = 0;
    let steering = 0;

    function initGame() {
      score = 0;
      level = 1;
      scoreEl.textContent = '0';
      setupLevel();
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
      levelBanner.style.display = 'none';
    }

    function setupLevel() {
      levelDistance = 0;
      timeLeft = Math.max(15, 28 - (level * 2));
      targetDistance = 250 + (level * 70);
      levelBadge.textContent = `Level ${level}`;
      obstacles = [];
      player.x = width / 2;
    }

    window.addEventListener('pointerdown', (e) => {
      if (gameState !== 'playing') return;
      if (e.clientX < width / 2) {
        steering = -1;
      } else {
        steering = 1;
      }
    });

    window.addEventListener('pointerup', () => {
      steering = 0;
    });

    setInterval(() => {
      if (gameState === 'playing') {
        timeLeft--;
        levelTimerEl.textContent = `Time: ${timeLeft}s`;
        if (timeLeft <= 0) {
          gameOver("Time's Up!");
        }
      }
    }, 1000);

    function update() {
      if (gameState !== 'playing') return;

      let roadLeft = width / 2 - 145;
      let roadRight = width / 2 + 145;

      player.x += steering * (6.5 + level * 0.8);
      if (player.x < roadLeft + 30) player.x = roadLeft + 30;
      if (player.x > roadRight - 30) player.x = roadRight - 30;

      let roadSpeed = 8 + (level * 2);
      roadAnim = (roadAnim + roadSpeed) % 40;

      levelDistance += roadSpeed * 0.1;
      score = (level - 1) * 300 + Math.floor(levelDistance * 10);
      scoreEl.textContent = score;

      if (levelDistance >= targetDistance) {
        triggerLevelUp();
      }

      spawnTimer++;
      let spawnInterval = Math.max(30, 68 - (level * 7));
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        let lanes = [roadLeft + 48, width / 2, roadRight - 48];
        let laneX = lanes[Math.floor(Math.random() * lanes.length)];
        obstacles.push({
          x: laneX,
          y: -130,
          width: 52,
          height: 105,
          speed: roadSpeed * 0.52 + Math.random() * 2,
          color: ['#dc2626', '#16a34a', '#ca8a04', '#7c3aed', '#b91c1c', '#0284c7'][Math.floor(Math.random() * 6)]
        });
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += roadSpeed + obs.speed;

        if (
          player.x - player.width / 2 < obs.x + obs.width / 2 &&
          player.x + player.width / 2 > obs.x - obs.width / 2 &&
          player.y - player.height / 2 < obs.y + obs.height / 2 &&
          player.y + player.height / 2 > obs.y - obs.height / 2
        ) {
          gameOver("Crash!");
        }

        if (obs.y > height + 130) {
          obstacles.splice(i, 1);
        }
      }
    }

    function triggerLevelUp() {
      gameState = 'leveling';
      level++;
      bannerText.textContent = `LEVEL ${level} UNLOCKED!`;
      levelBanner.style.display = 'flex';

      setTimeout(() => {
        levelBanner.style.display = 'none';
        setupLevel();
        gameState = 'playing';
      }, 1500);
    }

    // Advanced realistic top-down car renderer
    function drawDetailedSportsCar(x, y, w, h, bodyColor, isPlayer) {
      ctx.save();
      ctx.translate(x, y);

      const halfW = w / 2;
      const halfH = h / 2;

      // Realistic Ambient Drop Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.beginPath();
      ctx.roundRect(-halfW - 5, -halfH + 8, w + 10, h + 4, 18);
      ctx.fill();

      // Detailed Treaded Rubber Wheels
      const tireW = 9;
      const tireH = 22;
      const tirePositions = [
        [-halfW - 4, -halfH + 16], // Front Left
        [halfW - 5, -halfH + 16],  // Front Right
        [-halfW - 4, halfH - 36],  // Rear Left
        [halfW - 5, halfH - 36]    // Rear Right
      ];

      tirePositions.forEach(([tx, ty]) => {
        ctx.fillStyle = '#111827';
        ctx.beginPath();
        ctx.roundRect(tx, ty, tireW, tireH, 4);
        ctx.fill();
        // Alloy Rims Inner Line
        ctx.fillStyle = '#9ca3af';
        ctx.fillRect(tx + 3, ty + 4, 3, tireH - 8);
      });

      // Car Body Silhouette Path
      ctx.beginPath();
      ctx.moveTo(-halfW + 12, -halfH); // Nose center-left
      ctx.quadraticCurveTo(0, -halfH - 5, halfW - 12, -halfH); // Aerodynamic front nose curve
      ctx.quadraticCurveTo(halfW, -halfH + 15, halfW - 2, -halfH + 35); // Front fender
      ctx.lineTo(halfW - 4, halfH - 35); // Side skirt
      ctx.quadraticCurveTo(halfW + 2, halfH - 15, halfW - 8, halfH); // Rear quarter panel
      ctx.lineTo(-halfW + 8, halfH); // Rear bumper
      ctx.quadraticCurveTo(-halfW - 2, halfH - 15, -halfW + 4, halfH - 35); // Left skirt
      ctx.lineTo(-halfW + 2, -halfH + 35);
      ctx.quadraticCurveTo(-halfW, -halfH + 15, -halfW + 12, -halfH);
      ctx.closePath();

      // Main metallic body linear gradient
      let bodyGrad = ctx.createLinearGradient(-halfW, 0, halfW, 0);
      bodyGrad.addColorStop(0, '#090d16');
      bodyGrad.addColorStop(0.25, bodyColor);
      bodyGrad.addColorStop(0.75, bodyColor);
      bodyGrad.addColorStop(1, '#090d16');
      ctx.fillStyle = bodyGrad;
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Side Mirrors
      ctx.fillStyle = bodyColor;
      ctx.fillRect(-halfW - 7, -halfH + 34, 7, 10);
      ctx.fillRect(halfW, -halfH + 34, 7, 10);

      // Hood Vents / Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-10, -halfH + 12);
      ctx.lineTo(-6, -halfH + 34);
      ctx.moveTo(10, -halfH + 12);
      ctx.lineTo(6, -halfH + 34);
      ctx.stroke();

      // Curved Windshield Front
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.moveTo(-halfW + 10, -halfH + 35);
      ctx.quadraticCurveTo(0, -halfH + 28, halfW - 10, -halfH + 35);
      ctx.lineTo(halfW - 12, -halfH + 54);
      ctx.lineTo(-halfW + 12, -halfH + 54);
      ctx.closePath();
      ctx.fill();

      // Windshield Glass Highlight Reflection
      ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.beginPath();
      ctx.moveTo(-halfW + 12, -halfH + 37);
      ctx.lineTo(-4, -halfH + 32);
      ctx.lineTo(-8, -halfH + 52);
      ctx.lineTo(-halfW + 13, -halfH + 52);
      ctx.closePath();
      ctx.fill();

      // Cabin Roof Pillar Contour
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(-halfW + 10, -halfH + 52, w - 20, 24, 4);
      ctx.fill();

      // Rear Glass
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.moveTo(-halfW + 12, -halfH + 76);
      ctx.lineTo(halfW - 12, -halfH + 76);
      ctx.lineTo(halfW - 10, -halfH + 90);
      ctx.lineTo(-halfW + 10, -halfH + 90);
      ctx.closePath();
      ctx.fill();

      // Headlights with dynamic glow beam
      ctx.fillStyle = '#fef08a';
      ctx.shadowColor = '#facc15';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(-halfW + 12, -halfH + 4, 4, 0, Math.PI * 2);
      ctx.arc(halfW - 12, -halfH + 4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Tail Lights / Brake Glow
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.fillRect(-halfW + 6, halfH - 4, 12, 4);
      ctx.fillRect(halfW - 18, halfH - 4, 12, 4);
      ctx.shadowBlur = 0;

      // Dual Exhaust Pipes
      ctx.fillStyle = '#9ca3af';
      ctx.fillRect(-8, halfH - 2, 4, 4);
      ctx.fillRect(4, halfH - 2, 4, 4);

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      let roadLeft = width / 2 - 145;
      let roadRight = width / 2 + 145;

      // Realistic Grass Terrain
      ctx.fillStyle = '#044e38';
      ctx.fillRect(0, 0, width, height);

      // Asphalt Road Texture Gradient
      let roadGrad = ctx.createLinearGradient(roadLeft, 0, roadRight, 0);
      roadGrad.addColorStop(0, '#1e293b');
      roadGrad.addColorStop(0.5, '#334155');
      roadGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = roadGrad;
      ctx.fillRect(roadLeft, 0, roadRight - roadLeft, height);

      // Red/White Racing Kerb Shoulders
      const kerbHeight = 20;
      for (let y = -40 + (roadAnim % 40); y < height + 40; y += kerbHeight) {
        ctx.fillStyle = Math.floor(y / kerbHeight) % 2 === 0 ? '#ef4444' : '#f8fafc';
        ctx.fillRect(roadLeft - 8, y, 8, kerbHeight);
        ctx.fillRect(roadRight, y, 8, kerbHeight);
      }

      // Highway Dashed Lanes
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 5;
      ctx.setLineDash([24, 24]);
      ctx.lineDashOffset = -roadAnim;
      ctx.beginPath();
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Detailed Traffic Cars
      obstacles.forEach(obs => {
        drawDetailedSportsCar(obs.x, obs.y, obs.width, obs.height, obs.color, false);
      });

      // Draw Player Sports Car
      drawDetailedSportsCar(player.x, player.y, player.width, player.height, player.color, true);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver(reason) {
      gameState = 'gameover';
      gameOverTitle.textContent = reason === "Time's Up!" ? "Time's Up!" : "Car Crashed!";
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('realisticCarBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
