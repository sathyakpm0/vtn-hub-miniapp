<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tower Climb</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #0f172a, #1e293b);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    #score {
      font-size: 38px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #best {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #height-indicator {
      font-size: 18px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    #instruction {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 15px;
      opacity: 0.8;
      z-index: 10;
      pointer-events: none;
    }

    #game-over, #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    #game-over {
      display: none;
    }

    h1, h2 {
      font-size: 34px;
      font-weight: 700;
    }

    #final-score {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
    }

    #best-score-text {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-screen p {
      font-size: 15px;
      opacity: 0.75;
      text-align: center;
      padding: 0 30px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div>
        <div id="score">0</div>
        <div id="best">Best: 0</div>
      </div>
      <div id="height-indicator">Height: 0m</div>
    </div>

    <div id="instruction">Tap left or right side of screen to jump platforms!</div>

    <div id="start-screen">
      <h1>Tower Climb</h1>
      <p>Jump higher and higher across platforms!<br>Don't fall down or miss your landing.</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="game-over">
      <h2>Game Over</h2>
      <div id="final-score">0</div>
      <div id="best-score-text">Best: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0f172a');
      tg.setBackgroundColor('#0f172a');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const heightIndicator = document.getElementById('height-indicator');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreTextEl = document.getElementById('best-score-text');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('towerClimbBest') || '0');
    bestEl.textContent = `Best: ${bestScore}`;

    let gameState = 'start';
    let cameraY = 0;
    let maxHeight = 0;

    let player = {
      x: width / 2,
      y: 0,
      vx: 0,
      vy: 0,
      radius: 16,
      jumping: false
    };

    let platforms = [];

    function initGame() {
      score = 0;
      maxHeight = 0;
      scoreEl.textContent = '0';
      heightIndicator.textContent = 'Height: 0m';
      cameraY = 0;

      player.x = width / 2;
      player.y = height - 160;
      player.vx = 0;
      player.vy = -12;

      platforms = [];
      // Generate starting platforms
      platforms.push({ x: width / 2 - 50, y: height - 100, width: 100, height: 16 });

      let currentY = height - 180;
      while (currentY > -2000) {
        let pWidth = Math.max(70, 130 - (maxHeight * 0.05));
        let pX = Math.random() * (width - pWidth);
        platforms.push({ x: pX, y: currentY, width: pWidth, height: 16 });
        currentY -= 75 + Math.random() * 35;
      }

      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverEl.style.display = 'none';
    }

    // Touch controls: left side vs right side of screen
    window.addEventListener('pointerdown', (e) => {
      if (gameState !== 'playing') return;
      if (e.clientX < width / 2) {
        player.vx = -6; // Move left
      } else {
        player.vx = 6;  // Move right
      }
    });

    window.addEventListener('pointerup', () => {
      player.vx = 0;
    });

    function update() {
      if (gameState !== 'playing') return;

      // Physics
      player.vy += 0.45; // Gravity
      player.x += player.vx;
      player.y += player.vy;

      // Screen wrapping horizontal
      if (player.x < 0) player.x = width;
      if (player.x > width) player.x = 0;

      // Platform collisions (only when falling down)
      if (player.vy > 0) {
        platforms.forEach(p => {
          if (
            player.x + player.radius > p.x &&
            player.x - player.radius < p.x + p.width &&
            player.y + player.radius >= p.y &&
            player.y + player.radius <= p.y + p.height + 6
          ) {
            player.vy = -13.5; // Bounce / Jump up!
          }
        });
      }

      // Camera follow upward
      let targetCameraY = player.y - height * 0.45;
      if (targetCameraY < cameraY) {
        cameraY += (targetCameraY - cameraY) * 0.1;
      }

      // Calculate score based on height climbed
      let currentHeight = Math.max(0, Math.floor((height - 100 - player.y) / 10));
      if (currentHeight > maxHeight) {
        maxHeight = currentHeight;
        score = maxHeight * 10;
        scoreEl.textContent = score;
        heightIndicator.textContent = `Height: ${maxHeight}m`;
      }

      // Generate new platforms above as player climbs
      let highestPlatform = platforms[platforms.length - 1];
      if (highestPlatform.y > cameraY - 200) {
        let pWidth = Math.max(65, 120 - (maxHeight * 0.03));
        let pX = Math.random() * (width - pWidth);
        platforms.push({ x: pX, y: highestPlatform.y - (70 + Math.random() * 40), width: pWidth, height: 16 });
      }

      // Remove platforms far below screen
      platforms = platforms.filter(p => p.y < cameraY + height + 100);

      // Game over if player falls below screen view
      if (player.y > cameraY + height + 50) {
        gameOver();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(0, -cameraY);

      // Draw platforms
      platforms.forEach(p => {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.width, p.height, 8);
        ctx.fill();

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(p.x, p.y, p.width, 4);
      });

      // Draw player character ball
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Inner shine
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(player.x - 4, player.y - 4, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      gameState = 'gameover';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('towerClimbBest', bestScore);
        bestEl.textContent = `Best: ${bestScore}`;
      }
      finalScoreEl.textContent = score;
      bestScoreTextEl.textContent = `Best: ${bestScore}`;
      gameOverEl.style.display = 'flex';
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);

    requestAnimationFrame(loop);
  </script>
</body>
</html>
