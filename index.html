<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Real 3D Cricket - Telegram Mini App</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Three.js 3D WebGL Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; font-family: 'Segoe UI', Roboto, sans-serif;
    }
    #game-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    
    /* Broadcast HUD */
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
    }
    .broadcast-banner {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(5,15,30,0.85) 0%, rgba(5,15,30,0) 100%);
    }
    .score-board {
      display: flex; gap: 15px; align-items: center;
      background: rgba(10, 25, 47, 0.85); border-left: 4px solid #f59e0b;
      padding: 6px 14px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .team { font-weight: 800; font-size: 16px; color: #fff; letter-spacing: 1px; }
    .score { font-size: 22px; font-weight: 900; color: #38ef7d; }
    .overs { font-size: 13px; color: #94a3b8; }
    
    .radar-box {
      background: rgba(10, 25, 47, 0.85); border-right: 4px solid #3b82f6;
      padding: 6px 14px; border-radius: 6px; text-align: right;
    }
    .speed { font-size: 16px; font-weight: 800; color: #fbbf24; }
    .delivery-type { font-size: 10px; color: #94a3b8; text-transform: uppercase; }

    /* Action Message Overlay */
    #action-msg {
      position: absolute; top: 32%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 44px; font-weight: 900; font-style: italic;
      color: #fff; text-shadow: 0 0 20px #ff0055, 3px 3px 0 #000;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center; white-space: nowrap;
    }
    #action-msg.show { transform: translate(-50%, -50%) scale(1.1); }
    #shot-type {
      font-size: 16px; color: #38ef7d; text-shadow: 1px 1px 2px #000; font-style: normal;
    }

    /* Swipe Guide Controls */
    .controls-overlay {
      text-align: center; padding-bottom: 25px;
      color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <div id="hud">
    <div class="broadcast-banner">
      <div class="score-board">
        <span class="team">IND</span>
        <span class="score" id="score">0/0</span>
        <span class="overs" id="overs">BALLS: 6</span>
      </div>
      <div class="radar-box">
        <div class="speed" id="speed">142.5 KM/H</div>
        <div class="delivery-type" id="delivery">GOOD LENGTH</div>
      </div>
    </div>

    <div id="action-msg">
      <div id="primary-text">SIX!</div>
      <div id="shot-type">COVER DRIVE</div>
    </div>

    <div class="controls-overlay" id="guide">
      SWIPE TOWARD SHOT DIRECTION AS BALL ARRIVES
    </div>
  </div>

<script>
// --- TELEGRAM SDK & HAPTICS ---
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
}

function triggerHaptic(type) {
  if (tg?.HapticFeedback) {
    if (type === 'six') tg.HapticFeedback.impactOccurred('heavy');
    else if (type === 'four') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'out') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred('light');
  }
}

// --- SYNTHESIZED CRICKET AUDIO ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playCrispBatSound(isMiddled = true) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  // Crisp Willow bat strike (High frequency transient + low wooden resonance)
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = isMiddled ? 'triangle' : 'square';
  osc.frequency.setValueAtTime(isMiddled ? 450 : 220, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);
  gain.gain.setValueAtTime(1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.13);
}

function playCheerCrowd() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const bufferSize = audioCtx.sampleRate * 1.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.setValueAtTime(850, audioCtx.currentTime);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start();
}

// --- THREE.JS 3D SCENE SETUP ---
const container = document.getElementById('game-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a111c);
scene.fog = new THREE.FogExp2(0x0a111c, 0.015);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting: Night Cricket Floodlights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

function createFloodlight(x, y, z) {
  const light = new THREE.SpotLight(0xfff7e6, 2.2, 120, Math.PI / 4, 0.5, 1);
  light.position.set(x, y, z);
  light.castShadow = true;
  light.target.position.set(0, 0, 0);
  scene.add(light);
  scene.add(light.target);
}
createFloodlight(20, 25, 20);
createFloodlight(-20, 25, 20);
createFloodlight(20, 25, -20);
createFloodlight(-20, 25, -20);

// 3D Stadium Field & Grass Turf
const outfieldGeo = new THREE.CylinderGeometry(55, 55, 1, 48);
const outfieldMat = new THREE.MeshLambertMaterial({ color: 0x196f3d });
const outfield = new THREE.Mesh(outfieldGeo, outfieldMat);
outfield.position.y = -0.5;
outfield.receiveShadow = true;
scene.add(outfield);

// Boundary Ropes
const ropeGeo = new THREE.TorusGeometry(52, 0.35, 8, 48);
const ropeMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
const boundaryRope = new THREE.Mesh(ropeGeo, ropeMat);
boundaryRope.rotation.x = Math.PI / 2;
boundaryRope.position.y = 0.1;
scene.add(boundaryRope);

// Cricket Pitch (Clay/Tan Earth)
const pitchGeo = new THREE.BoxGeometry(3.6, 0.05, 22);
const pitchMat = new THREE.MeshLambertMaterial({ color: 0xc4a475 });
const pitch = new THREE.Mesh(pitchGeo, pitchMat);
pitch.position.set(0, 0, 0);
pitch.receiveShadow = true;
scene.add(pitch);

// Pitch Crease Lines
function createCrease(z) {
  const creaseGeo = new THREE.BoxGeometry(3.0, 0.06, 0.1);
  const creaseMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const crease = new THREE.Mesh(creaseGeo, creaseMat);
  crease.position.set(0, 0, z);
  scene.add(crease);
}
createCrease(8.5);  // Batting Crease
createCrease(-8.5); // Bowling Crease

// 3D Stumps & Bails Generator
function buildWickets(zPos) {
  const wicketGroup = new THREE.Group();
  const stumpMat = new THREE.MeshLambertMaterial({ color: 0xd97706 });
  const bailsMat = new THREE.MeshLambertMaterial({ color: 0xca8a04 });

  for (let i = -1; i <= 1; i++) {
    const stumpGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.85, 8);
    const stump = new THREE.Mesh(stumpGeo, stumpMat);
    stump.position.set(i * 0.14, 0.425, 0);
    stump.castShadow = true;
    wicketGroup.add(stump);
  }
  // Bail
  const bailGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.34, 6);
  const bail = new THREE.Mesh(bailGeo, bailsMat);
  bail.rotation.z = Math.PI / 2;
  bail.position.set(0, 0.86, 0);
  wicketGroup.add(bail);

  wicketGroup.position.set(0, 0, zPos);
  scene.add(wicketGroup);
  return wicketGroup;
}
const batterWickets = buildWickets(9.5);
buildWickets(-9.5);

// 3D Pitch Landing Marker
const markerGeo = new THREE.RingGeometry(0.2, 0.35, 24);
const markerMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide });
const pitchMarker = new THREE.Mesh(markerGeo, markerMat);
pitchMarker.rotation.x = -Math.PI / 2;
pitchMarker.position.set(0, 0.04, 0);
scene.add(pitchMarker);

// 3D Cricket Ball
const ballGeo = new THREE.SphereGeometry(0.12, 16, 16);
const ballMat = new THREE.MeshLambertMaterial({ color: 0xb91c1c });
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.castShadow = true;
scene.add(ball);

// 3D Realistic Batsman Rig
const batsman = new THREE.Group();
// Batsman Pads
const padMat = new THREE.MeshLambertMaterial({ color: 0xf8fafc });
const leftPad = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.22), padMat);
leftPad.position.set(-0.16, 0.3, 0);
leftPad.castShadow = true;
const rightPad = leftPad.clone();
rightPad.position.set(0.16, 0.3, 0);
batsman.add(leftPad, rightPad);

// Jersey Body
const jerseyMat = new THREE.MeshLambertMaterial({ color: 0x1d4ed8 }); // Team India Blue
const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), jerseyMat);
body.position.set(0, 0.85, 0);
body.castShadow = true;
batsman.add(body);

// Helmet with Visor Grill
const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), new THREE.MeshLambertMaterial({ color: 0x1e3a8a }));
helmet.position.set(0, 1.35, 0);
helmet.castShadow = true;
batsman.add(helmet);

// Bat & Arms Pivot
const batPivot = new THREE.Group();
batPivot.position.set(0.25, 0.85, 0);

const batBlade = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.8, 0.05), new THREE.MeshLambertMaterial({ color: 0xd97706 }));
batBlade.position.set(0, -0.4, 0);
batBlade.castShadow = true;

const batHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 8), new THREE.MeshLambertMaterial({ color: 0xffffff }));
batHandle.position.set(0, 0.1, 0);

batPivot.add(batBlade, batHandle);
batsman.add(batPivot);

batsman.position.set(0.3, 0, 8.8);
batsman.rotation.y = -Math.PI / 2; // Classic batting side-on stance
scene.add(batsman);

// --- GAME LOGIC & PHYSICS ---
let runs = 0, wickets = 0, ballsLeft = 6;
let gameState = 'READY'; // READY, RUNNING, BOWLED, HIT, OUT, INNINGS_OVER
let ballVelocity = new THREE.Vector3();
let bouncePoint = new THREE.Vector3();
let hasBounced = false;
let deliverySpeedKmh = 142;

// Standard Batting Camera Pose
const defaultCamPos = new THREE.Vector3(0, 2.5, 13.5);
const defaultCamLook = new THREE.Vector3(0, 1.2, 0);
camera.position.copy(defaultCamPos);
camera.lookAt(defaultCamLook);

function resetDelivery() {
  if (ballsLeft <= 0) {
    gameState = 'INNINGS_OVER';
    showOverlayMsg("INNINGS FINISHED!", `FINAL SCORE: ${runs}/${wickets}`);
    if (tg?.MainButton) {
      tg.MainButton.setText("PLAY NEXT OVER");
      tg.MainButton.show();
      tg.MainButton.onClick(() => {
        runs = 0; wickets = 0; ballsLeft = 6;
        document.getElementById('score').innerText = "0/0";
        document.getElementById('overs').innerText = "BALLS: 6";
        tg.MainButton.hide();
        resetDelivery();
      });
    }
    return;
  }

  gameState = 'READY';
  hasBounced = false;
  camera.position.copy(defaultCamPos);
  camera.lookAt(defaultCamLook);

  // Randomize bowling line & length
  deliverySpeedKmh = (135 + Math.random() * 15).toFixed(1);
  document.getElementById('speed').innerText = `${deliverySpeedKmh} KM/H`;

  const lateralLine = (Math.random() - 0.5) * 1.6; // Off-stump to Leg-stump line
  const bounceZ = 1 + (Math.random() - 0.5) * 4;   // Length variation (Good length / Short)
  bouncePoint.set(lateralLine, 0, bounceZ);

  // Position Pitch Indicator
  pitchMarker.position.x = bouncePoint.x;
  pitchMarker.position.z = bouncePoint.z;
  pitchMarker.visible = true;

  if (bounceZ > 2) document.getElementById('delivery').innerText = "FULL LENGTH";
  else if (bounceZ < 0) document.getElementById('delivery').innerText = "SHORT PITCH";
  else document.getElementById('delivery').innerText = "GOOD LENGTH";

  // Ball initial state at bowler's hand
  ball.position.set(0.4, 2.3, -9.5);
  ballVelocity.set(0, 0, 0);

  // Batsman reset backlift
  batPivot.rotation.set(0.3, 0, 0.4);

  setTimeout(bowlBall, 1200);
}

function bowlBall() {
  gameState = 'BOWLED';
  const timeToBounce = 0.55; // Speed multiplier
  ballVelocity.x = (bouncePoint.x - ball.position.x) / (timeToBounce * 60);
  ballVelocity.z = (bouncePoint.z - ball.position.z) / (timeToBounce * 60);
  ballVelocity.y = (0.1 - ball.position.y) / (timeToBounce * 60);
}

// User Directional Swipe Controls
let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  if (audioCtx.state === 'suspended') audioCtx.resume();
});

window.addEventListener('touchend', (e) => {
  if (gameState !== 'BOWLED') return;
  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;
  const deltaX = touchEndX - touchStartX;
  const deltaY = -(touchEndY - touchStartY); // Invert for upwards swipe

  attemptBatHit(deltaX, deltaY);
});

function attemptBatHit(swipeX, swipeY) {
  // Check timing window relative to batting crease (ball.z ~ 8.0 to 9.2)
  const distToCrease = ball.position.z;

  if (distToCrease >= 7.6 && distToCrease <= 9.4) {
    // Shot Executed!
    gameState = 'HIT';
    pitchMarker.visible = false;

    // Normalize swipe direction
    const length = Math.hypot(swipeX, swipeY) || 1;
    const dirX = swipeX / length;
    const dirY = Math.max(0.3, swipeY / length);

    // Calculate Bat Swing Animation
    batPivot.rotation.set(-1.2, dirX * 1.2, 0);

    // Accuracy & Sweetspot check
    const timingPrecision = Math.abs(distToCrease - 8.6); // 8.6 is sweet spot
    const isMiddled = timingPrecision < 0.38;

    playCrispBatSound(isMiddled);

    if (isMiddled && dirY > 0.6) {
      // MASSIVE SIX OVER THE ROPES
      runs += 6;
      triggerHaptic('six');
      playCheerCrowd();
      showOverlayMsg("SIX!", getShotName(dirX, true));

      ballVelocity.set(dirX * 0.9, 0.75, -(0.8 + dirY * 0.5));
    } else {
      // 4 RUNS / GROUND BOUNDARY
      runs += 4;
      triggerHaptic('four');
      showOverlayMsg("FOUR!", getShotName(dirX, false));

      ballVelocity.set(dirX * 0.8, 0.18, -(0.7 + dirY * 0.4));
    }

    ballsLeft--;
    updateScoreUI();
    setTimeout(resetDelivery, 3200);
  }
}

function getShotName(dirX, isLofted) {
  if (dirX < -0.4) return isLofted ? "LOFTED COVER DRIVE" : "CRACKING COVER DRIVE";
  if (dirX > 0.4) return isLofted ? "PULL SHOT OVER MID-WICKET" : "SQUARE LEG GLANCE";
  return isLofted ? "STRAIGHT LOFT DOWN THE GROUND" : "CRISP STRAIGHT DRIVE";
}

function showOverlayMsg(title, sub) {
  const box = document.getElementById('action-msg');
  document.getElementById('primary-text').innerText = title;
  document.getElementById('shot-type').innerText = sub;
  box.classList.add('show');
  setTimeout(() => box.classList.remove('show'), 1600);
}

function updateScoreUI() {
  document.getElementById('score').innerText = `${runs}/${wickets}`;
  document.getElementById('overs').innerText = `BALLS: ${ballsLeft}`;
}

// --- PHYSICS & ANIMATION LOOP ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (gameState === 'BOWLED') {
    ball.position.add(ballVelocity);
    ball.rotation.x += 0.2;

    // Pitch Bounce Physics
    if (ball.position.y <= 0.12 && !hasBounced) {
      hasBounced = true;
      ballVelocity.y = -ballVelocity.y * 0.65; // Coefficient of restitution
      ballVelocity.z *= 0.94; // Pitch friction
    } else if (hasBounced) {
      ballVelocity.y -= 0.015; // Gravity
    }

    // Wicket Castled / Clean Bowled check
    if (ball.position.z >= 9.6 && !ball.hit) {
      if (Math.abs(ball.position.x) < 0.45 && ball.position.y < 0.9) {
        gameState = 'OUT';
        wickets++;
        ballsLeft--;
        triggerHaptic('out');
        showOverlayMsg("BOWLED!", "MIDDLE STUMP SHATTERED!");
        // Dislodge Stumps
        batterWickets.children[1].rotation.x = -1.2;
        batterWickets.children[3].position.y = 1.3;
        updateScoreUI();
        setTimeout(resetDelivery, 2500);
      } else {
        // Dot Ball / Beaten
        gameState = 'READY';
        ballsLeft--;
        updateScoreUI();
        showOverlayMsg("BEATEN!", "GREAT DELIVERY");
        setTimeout(resetDelivery, 1500);
      }
    }
  } else if (gameState === 'HIT') {
    // Ball flying through the air
    ball.position.add(ballVelocity);
    ballVelocity.y -= 0.016; // Real gravity
    if (ball.position.y <= 0.12) {
      ball.position.y = 0.12;
      ballVelocity.y = -ballVelocity.y * 0.4;
      ballVelocity.multiplyScalar(0.97);
    }

    // Dynamic TV Broadcast Camera following the shot
    camera.position.lerp(new THREE.Vector3(ball.position.x * 0.3, 4, ball.position.z + 10), 0.05);
    camera.lookAt(ball.position);
  }

  renderer.render(scene, camera);
}

// Resize Handling
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start Match
resetDelivery();
animate();
</script>
</body>
</html>
