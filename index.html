<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Over: Telegram Cricket</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d131a;
      font-family: 'Impact', 'Segoe UI Black', Arial, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* UI Overlay */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hud-top {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-card {
      background: rgba(13, 27, 42, 0.85);
      border: 2px solid #00f2fe;
      border-radius: 14px;
      padding: 8px 16px;
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }
    .score-title {
      font-size: 11px;
      letter-spacing: 1px;
      color: #38ef7d;
      text-transform: uppercase;
    }
    .score-val {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
    }
    /* Action Prompt */
    #prompt-msg {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 42px;
      color: #ffeb3b;
      text-shadow: 0 0 20px #ff0055, 3px 3px 0 #000;
      font-weight: 900;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
    }
    #prompt-msg.show {
      transform: translate(-50%, -50%) scale(1.1);
    }
    .controls-hint {
      text-align: center;
      padding-bottom: 24px;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      font-size: 14px;
      letter-spacing: 1px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-container">
    <div class="hud-top">
      <div class="score-card">
        <div class="score-title">SCORE</div>
        <div class="score-val" id="scoreDisplay">0 / 0</div>
      </div>
      <div class="score-card">
        <div class="score-title">BALLS LEFT</div>
        <div class="score-val" id="ballsDisplay">6</div>
      </div>
    </div>
    <div id="prompt-msg">SIX!</div>
    <div class="controls-hint" id="controlsHint">TAP ANYWHERE TO HIT!</div>
  </div>

<script>
// --- TELEGRAM WEB APP INTEGRATION ---
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
}

function triggerHaptic(type) {
  if (tg?.HapticFeedback) {
    if (type === 'hit') tg.HapticFeedback.impactOccurred('heavy');
    else if (type === 'four') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'out') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred('light');
  }
}

// --- SYNTHESIZED AUDIO (NO EXTERNAL ASSETS REQUIRED) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBatHitSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(320, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
  gain.gain.setValueAtTime(1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.16);
}

function playCheerSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  // Filtered white noise for stadium cheer
  const bufferSize = audioCtx.sampleRate * 1.2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(800, audioCtx.currentTime);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

// --- GAME LOGIC & CANVAS ENGINE ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const ballsDisplay = document.getElementById('ballsDisplay');
const promptMsg = document.getElementById('prompt-msg');

let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Game State
let runs = 0;
let wickets = 0;
let ballsRemaining = 6;
let gameState = 'RUN_UP'; // RUN_UP, BOWLED, HIT, OVER
let screenShake = 0;

// Character & Ball Entities
const pitch = { topWidth: 70, bottomWidth: 260, topY: 0, bottomY: 0 };
const ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, radius: 10, active: false, hit: false };
const bowler = { x: 0, y: 0, step: 0 };
const batsman = {
  x: 0,
  y: 0,
  swingProgress: 0, // 0 to 1
  isSwinging: false,
  swingDir: 1
};
let particles = [];

function spawnParticles(x, y, color, count = 25) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.8) * 14,
      size: Math.random() * 6 + 3,
      color: color,
      life: 1.0,
      decay: Math.random() * 0.03 + 0.02
    });
  }
}

function showPrompt(text, color = '#ffeb3b') {
  promptMsg.textContent = text;
  promptMsg.style.color = color;
  promptMsg.classList.add('show');
  setTimeout(() => promptMsg.classList.remove('show'), 900);
}

// Reset / Delivery Cycle
function initBowlerRun() {
  if (ballsRemaining <= 0) {
    gameState = 'OVER';
    showPrompt("MATCH FINISHED!", "#38ef7d");
    if (tg?.MainButton) {
      tg.MainButton.setText("PLAY AGAIN");
      tg.MainButton.show();
      tg.MainButton.onClick(() => {
        runs = 0; wickets = 0; ballsRemaining = 6;
        scoreDisplay.textContent = `0 / 0`;
        ballsDisplay.textContent = `6`;
        tg.MainButton.hide();
        initBowlerRun();
      });
    }
    return;
  }
  gameState = 'RUN_UP';
  bowler.step = 0;
  bowler.x = width * 0.5 - 30;
  bowler.y = height * 0.28;
  ball.active = false;
  ball.hit = false;
  batsman.swingProgress = 0;
  batsman.isSwinging = false;
}
initBowlerRun();

function releaseBall() {
  gameState = 'BOWLED';
  ball.active = true;
  ball.x = bowler.x + 10;
  ball.y = bowler.y + 15;
  ball.z = 1.0; // Distance scale: 1 is far, >3 is close
  // Speed variations for energetic gameplay
  const targetX = width * 0.5 + (Math.random() * 50 - 25);
  ball.vx = (targetX - ball.x) / 45;
  ball.vy = (height * 0.76 - ball.y) / 45;
  ball.vz = 0.055;
}

// User Action: Swing Bat
function swingBat() {
  if (batsman.isSwinging || gameState !== 'BOWLED') return;
  batsman.isSwinging = true;

  // Collision Check based on depth (z)
  if (ball.active && !ball.hit) {
    // Timing check
    if (ball.z >= 2.6 && ball.z <= 3.8) {
      // Good or Perfect Hit!
      playBatHitSound();
      ball.hit = true;
      screenShake = 16;

      const timingDelta = Math.abs(ball.z - 3.2); // sweet spot at 3.2
      if (timingDelta < 0.25) {
        // SIX RUNS!
        runs += 6;
        triggerHaptic('hit');
        playCheerSound();
        spawnParticles(ball.x, ball.y, '#ff0055', 40);
        spawnParticles(ball.x, ball.y, '#ffd700', 40);
        showPrompt("MASSIVE 6!", "#ff007f");
        ball.vx = (Math.random() - 0.5) * 10;
        ball.vy = -18;
      } else {
        // FOUR RUNS!
        runs += 4;
        triggerHaptic('four');
        spawnParticles(ball.x, ball.y, '#00f2fe', 30);
        showPrompt("CRACKING 4!", "#00f2fe");
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * 12;
        ball.vy = -10;
      }
      ballsRemaining--;
      scoreDisplay.textContent = `${runs} / ${wickets}`;
      ballsDisplay.textContent = `${ballsRemaining}`;
      setTimeout(initBowlerRun, 2200);
    }
  }
}

// Window Listeners
window.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  swingBat();
});

// --- RENDER STYLIZED GRAPHICS ---
function drawCartoonBatsman(x, y, swing) {
  ctx.save();
  ctx.translate(x, y);

  // Dynamic Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 45, 35, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Bat Rotation logic
  const batAngle = -0.8 + swing * 2.5;

  // Left & Right Leg Pads
  ctx.fillStyle = '#f0f3f6';
  ctx.strokeStyle = '#2c3e50';
  ctx.lineWidth = 3;
  // Pad Left
  ctx.roundRect(-22, 10, 16, 36, [6]).fill();
  ctx.stroke();
  // Pad Right
  ctx.roundRect(-2, 10, 16, 36, [6]).fill();
  ctx.stroke();

  // Vibrant Blue Team Jersey Body
  ctx.fillStyle = '#0052d4';
  ctx.beginPath();
  ctx.roundRect(-26, -30, 48, 44, [10]);
  ctx.fill();
  ctx.stroke();

  // Jersey Number / Stripe
  ctx.fillStyle = '#ffeb3b';
  ctx.fillRect(-6, -24, 8, 30);

  // Bat & Arms
  ctx.save();
  ctx.translate(10, -5);
  ctx.rotate(batAngle);

  // Wooden Cartoon Bat
  ctx.fillStyle = '#d29054';
  ctx.strokeStyle = '#5a3d1e';
  ctx.lineWidth = 2.5;
  ctx.fillRect(-5, -60, 14, 60);
  ctx.strokeRect(-5, -60, 14, 60);

  // Colored Bat Grip & Rubber Cap
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(-3, 0, 10, 20);
  // Red Gloves
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.arc(2, 2, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // Big Cartoon Head & Helmet
  ctx.fillStyle = '#003180'; // Dark Blue Helmet
  ctx.beginPath();
  ctx.arc(-2, -45, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Helmet Grill / Visor (Metallic Steel)
  ctx.strokeStyle = '#ecf0f1';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, -45);
  ctx.lineTo(16, -36);
  ctx.moveTo(2, -39);
  ctx.lineTo(18, -32);
  ctx.stroke();

  // Cute Big Cartoon Eye visible through visor
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(8, -45, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(10, -45, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawCartoonBowler(x, y, step) {
  ctx.save();
  ctx.translate(x, y);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 30, 20, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  const bounce = Math.sin(step * 0.3) * 6;

  // Legs in run motion
  ctx.strokeStyle = '#27ae60';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(-8, 10 + bounce);
  ctx.lineTo(-12, 30);
  ctx.moveTo(8, 10 + bounce);
  ctx.lineTo(12, 30);
  ctx.stroke();

  // Jersey (Emerald Green rival team)
  ctx.fillStyle = '#2ecc71';
  ctx.strokeStyle = '#1e824c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-15, -15 + bounce, 30, 28, [6]);
  ctx.fill();
  ctx.stroke();

  // Cartoon Head
  ctx.fillStyle = '#ffdbac';
  ctx.beginPath();
  ctx.arc(0, -25 + bounce, 12, 0, Math.PI * 2);
  ctx.fill();

  // Green Headband
  ctx.fillStyle = '#27ae60';
  ctx.fillRect(-12, -32 + bounce, 24, 6);

  // Bowling Arm swinging
  ctx.strokeStyle = '#ffdbac';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(12, -10 + bounce);
  ctx.lineTo(24, Math.sin(step * 0.4) * 20 - 15);
  ctx.stroke();

  ctx.restore();
}

function drawStumps(x, y, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  ctx.fillStyle = '#f39c12';
  ctx.strokeStyle = '#7f4f09';
  ctx.lineWidth = 1.5;

  // 3 Stumps
  for (let i = -1; i <= 1; i++) {
    ctx.fillRect(i * 9 - 3, -40, 6, 40);
    ctx.strokeRect(i * 9 - 3, -40, 6, 40);
  }
  // Bails
  ctx.fillStyle = '#e67e22';
  ctx.fillRect(-14, -44, 28, 4);
  ctx.restore();
}

// --- MAIN LOOP ---
function update() {
  // Screen Shake Decay
  if (screenShake > 0) screenShake *= 0.88;

  // Batsman Swing animation
  if (batsman.isSwinging) {
    batsman.swingProgress += 0.12;
    if (batsman.swingProgress >= 1) {
      batsman.isSwinging = false;
      batsman.swingProgress = 0;
    }
  }

  // Bowler Run-Up logic
  if (gameState === 'RUN_UP') {
    bowler.step++;
    bowler.y += 0.8;
    if (bowler.y >= height * 0.35) {
      releaseBall();
    }
  }

  // Ball Trajectory
  if (gameState === 'BOWLED' && ball.active) {
    if (!ball.hit) {
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.z += ball.vz;

      // Missed shot check -> Clean Bowled or Dot Ball
      if (ball.z > 3.9) {
        ball.active = false;
        wickets++;
        ballsRemaining--;
        triggerHaptic('out');
        showPrompt("CLEAN BOWLED!", "#ff0055");
        screenShake = 10;
        scoreDisplay.textContent = `${runs} / ${wickets}`;
        ballsDisplay.textContent = `${ballsRemaining}`;
        setTimeout(initBowlerRun, 2000);
      }
    } else {
      // Ball soaring into stadium
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.vy += 0.35; // gravity arc
      ball.radius = Math.max(3, ball.radius * 0.985);
    }
  }

  // Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function render() {
  ctx.save();
  // Screen Shake Transform
  if (screenShake > 0.5) {
    const dx = (Math.random() - 0.5) * screenShake;
    const dy = (Math.random() - 0.5) * screenShake;
    ctx.translate(dx, dy);
  }

  // 1. Sky & Stadium Floodlights Background
  const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.4);
  skyGrad.addColorStop(0, '#0a192f');
  skyGrad.addColorStop(1, '#1b2a4a');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, width, height);

  // Stadium Crowd Silhouettes
  ctx.fillStyle = '#0e1826';
  for (let i = 0; i < width; i += 18) {
    const h = 40 + Math.sin(i * 0.3) * 12;
    ctx.beginPath();
    ctx.arc(i + 8, height * 0.3 - h + 10, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(i, height * 0.3 - h + 10, 16, h);
  }

  // Floodlights Glow Effect
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath();
  ctx.arc(width * 0.15, height * 0.1, 80, 0, Math.PI * 2);
  ctx.arc(width * 0.85, height * 0.1, 80, 0, Math.PI * 2);
  ctx.fill();

  // 2. Outfield Grass
  const grassGrad = ctx.createLinearGradient(0, height * 0.3, 0, height);
  grassGrad.addColorStop(0, '#107a3e');
  grassGrad.addColorStop(1, '#0b5329');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, height * 0.3, width, height * 0.7);

  // 3. 3D Perspective Pitch
  pitch.topY = height * 0.34;
  pitch.bottomY = height * 0.88;
  ctx.fillStyle = '#c8a876';
  ctx.beginPath();
  ctx.moveTo(width * 0.5 - pitch.topWidth * 0.5, pitch.topY);
  ctx.lineTo(width * 0.5 + pitch.topWidth * 0.5, pitch.topY);
  ctx.lineTo(width * 0.5 + pitch.bottomWidth * 0.5, pitch.bottomY);
  ctx.lineTo(width * 0.5 - pitch.bottomWidth * 0.5, pitch.bottomY);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#b29362';
  ctx.stroke();

  // White Crease Lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  // Bowling Crease
  ctx.moveTo(width * 0.5 - 40, height * 0.36);
  ctx.lineTo(width * 0.5 + 40, height * 0.36);
  // Batting Crease
  ctx.moveTo(width * 0.5 - 110, height * 0.8);
  ctx.lineTo(width * 0.5 + 110, height * 0.8);
  ctx.stroke();

  // Far Stumps (Bowler End)
  drawStumps(width * 0.5, height * 0.35, 0.5);

  // 4. Draw Bowler (When Bowling)
  if (gameState === 'RUN_UP' || (gameState === 'BOWLED' && !ball.hit)) {
    drawCartoonBowler(bowler.x, bowler.y, bowler.step);
  }

  // 5. Draw Timing Sweetspot Guide Circle on Pitch
  if (ball.active && !ball.hit) {
    ctx.strokeStyle = 'rgba(255, 235, 59, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(width * 0.5, height * 0.78, 60, 20, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 6. Draw Near Stumps (Behind Batsman)
  drawStumps(width * 0.5 - 35, height * 0.81, 1.1);

  // 7. Draw Cartoon Batsman
  batsman.x = width * 0.5;
  batsman.y = height * 0.8;
  drawCartoonBatsman(batsman.x, batsman.y, batsman.swingProgress);

  // 8. Draw Ball with Realistic Cartoon Shading & Depth
  if (ball.active) {
    const currentRadius = ball.radius * (ball.hit ? 1 : ball.z);
    // Dynamic Shadow on Pitch
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath();
    ctx.ellipse(ball.x, ball.y + currentRadius * 0.8, currentRadius, currentRadius * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Red Cricket Ball with Glow
    const ballGrad = ctx.createRadialGradient(
      ball.x - currentRadius * 0.3,
      ball.y - currentRadius * 0.3,
      currentRadius * 0.1,
      ball.x,
      ball.y,
      currentRadius
    );
    ballGrad.addColorStop(0, '#ff6b6b');
    ballGrad.addColorStop(0.7, '#c0392b');
    ballGrad.addColorStop(1, '#781e14');

    ctx.fillStyle = ballGrad;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, currentRadius, 0, Math.PI * 2);
    ctx.fill();

    // White Seam
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(1, currentRadius * 0.15);
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, currentRadius * 0.85, -0.6, 0.6);
    ctx.stroke();
  }

  // 9. Particle Bursts
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  });

  ctx.restore();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
